<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<script src="../voice.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dexter's Number Bond Blast</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#0b0a2a,#2a1b5e);color:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden;touch-action:manipulation}
#stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 15%,#fff9,transparent),radial-gradient(2px 2px at 40% 70%,#fff7,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff8,transparent),radial-gradient(1px 1px at 25% 45%,#fff9,transparent)}
#app{position:relative;max-width:640px;margin:0 auto;padding:16px;height:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{margin:6px 0 0;font-size:clamp(30px,7vw,46px);color:#ffd400;text-align:center;line-height:1.05}
.sub{margin:0;text-align:center;font-size:clamp(16px,3.8vw,20px);opacity:.9}
.btn{font:inherit;font-weight:700;font-size:clamp(18px,4.4vw,24px);color:#fff;background:#3a86ff;border:none;border-radius:22px;padding:16px 20px;width:100%;cursor:pointer;box-shadow:0 5px 0 #0003}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.btn small{display:block;font-weight:400;font-size:.7em;opacity:.9}
.top{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#ffffff22;border-radius:999px;padding:8px 14px;font-weight:700;font-size:18px}
.home{background:#ff8c42;width:auto;padding:10px 16px;font-size:18px}
.target{font-size:clamp(22px,5.4vw,30px);font-weight:700;text-align:center}
.target b{color:#ffd400;font-size:1.4em}
#field{position:relative;flex:1;width:100%;min-height:300px}
.rock{position:absolute;width:var(--s);height:var(--s);border-radius:46% 54% 50% 50%/52% 46% 54% 48%;background:radial-gradient(circle at 35% 30%,#efe6da,#b0a496 60%,#7a6f64);border:3px solid #3a332d;color:#1a1a2e;font-weight:800;font-size:calc(var(--s)*0.42);display:flex;align-items:center;justify-content:center;cursor:pointer;animation:float var(--d) ease-in-out infinite alternate;box-shadow:inset -6px -8px 0 #0002;transition:transform .15s}
.rock::before,.rock::after{content:'';position:absolute;border-radius:50%;background:#0002}
.rock::before{width:18%;height:18%;left:18%;top:62%}.rock::after{width:12%;height:12%;right:20%;top:20%}
.rock span{background:#fff;border-radius:999px;padding:0 .25em;line-height:1.1}
.rock.sel{outline:5px solid #ffd400;outline-offset:3px;transform:scale(1.1)}
.rock.bad{animation:shake .4s}
.rock.boom{animation:boom .45s forwards}
@keyframes float{from{translate:0 -6px}to{translate:0 6px}}
@keyframes shake{0%,100%{translate:0}25%{translate:-8px}75%{translate:8px}}
@keyframes boom{to{transform:scale(1.8);opacity:0}}
.msg{min-height:30px;font-size:20px;font-weight:700;text-align:center}
.result{background:#ffffff14;border-radius:24px;padding:20px;width:100%;text-align:center}
.big{font-size:56px;font-weight:800;color:#ffd400}
.modes{display:grid;gap:12px;width:100%}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app"></div>
<script>
const app=document.getElementById('app');
let voiceOn=true,AC=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function sBoom(){tone(140,0.3,'sawtooth',0.12);[523,659,784].forEach((f,i)=>tone(f,0.2,'triangle',0.13,0.1+i*0.07));}
function sTap(){tone(600,0.08,'sine',0.08);}
function sBad(){tone(200,0.25,'square',0.07);}
function sWin(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.15,i*0.12));}
function say(t){if(!voiceOn)return;try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.95;u.pitch=1.1;const v=s.getVoices().find(x=>/en[-_]GB/i.test(x.lang));if(v)u.voice=v;s.speak(u);}catch(e){}}
function getBest(m){try{return parseFloat(localStorage.getItem('bond_best_'+m))||0;}catch(e){return 0;}}
function setBest(m,v){try{const b=getBest(m);if(!b||v<b)localStorage.setItem('bond_best_'+m,v);}catch(e){}}
const MODES=[
 {id:'10',em:'🔟',name:'Make 10',desc:'Pairs that add to 10',target:()=>10,step:1},
 {id:'20',em:'2️⃣0️⃣',name:'Make 20',desc:'Pairs that add to 20',target:()=>20,step:1},
 {id:'100',em:'💯',name:'Make 100',desc:'Tens that add to 100',target:()=>100,step:10},
 {id:'mix',em:'🎲',name:'Mystery target',desc:'A new target every wave: 6 to 20',target:()=>6+Math.floor(Math.random()*15),step:1}];
let st=null;
function menu(){st=null;app.innerHTML='<img src="../img/logo-192.png" alt="" style="width:110px;height:110px;margin-top:6px" onerror="this.remove()"><h1>Number Bond Blast</h1><p class="sub">Tap two asteroids that add up to the target to blast them!</p><div class="modes" id="modes"></div><button class="btn" id="voice" style="background:#6a4c93">Voice: '+(voiceOn?'on':'off')+'</button>';
 const m=document.getElementById('modes');
 MODES.forEach(md=>{const b=getBest(md.id);const btn=document.createElement('button');btn.className='btn';btn.innerHTML=md.em+' '+md.name+'<small>'+md.desc+(b?' · best time '+b+'s':'')+'</small>';btn.onclick=()=>{audioInit();start(md);};m.appendChild(btn);});
 document.getElementById('voice').onclick=()=>{voiceOn=!voiceOn;menu();};}
function start(md){st={md,wave:0,blasts:0,t0:Date.now()};wave();}
function makePairs(T,step){const pairs=[],used=new Set();let guard=0;
 while(pairs.length<4&&guard++<200){const a=step*(1+Math.floor(Math.random()*(T/step-1)));const b=T-a;const key=Math.min(a,b)+'-'+Math.max(a,b);if(used.has(key)&&guard<150)continue;used.add(key);pairs.push([a,b]);}
 return pairs;}
function wave(){const md=st.md,T=md.target();st.T=T;st.sel=null;st.left=8;
 app.innerHTML='<div class="top"><button class="btn home" id="home">⌂ Menu</button><span class="pill">Wave '+(st.wave+1)+' of 3</span><span class="pill">💥 '+st.blasts+'</span></div><div class="target">Make <b>'+T+'</b></div><div id="field"></div><div class="msg" id="msg"></div>';
 document.getElementById('home').onclick=menu;say('Make '+T);
 const f=document.getElementById('field'),vals=makePairs(T,md.step).flat().sort(()=>Math.random()-0.5);
 const W=f.clientWidth,H=f.clientHeight,s=Math.max(64,Math.min(110,Math.min(W/4.2,H/3.4)));
 /* place 8 asteroids on a jittered 4 x 2 grid so they never overlap */
 vals.forEach((v,i)=>{const c=i%4,r=Math.floor(i/4);const x=(W/4)*c+(W/4-s)/2+(Math.random()-0.5)*(W/4-s)*0.6,y=(H/2)*r+(H/2-s)/2+(Math.random()-0.5)*(H/2-s)*0.6;
  const el=document.createElement('div');el.className='rock';el.style.setProperty('--s',s+'px');el.style.setProperty('--d',(1.6+Math.random()*1.4)+'s');el.style.left=x+'px';el.style.top=y+'px';el.innerHTML='<span>'+v+'</span>';el.dataset.v=v;
  el.onpointerdown=e=>{e.preventDefault();tap(el);};f.appendChild(el);});}
function tap(el){if(el.classList.contains('boom'))return;const msg=document.getElementById('msg');
 if(!st.sel){st.sel=el;el.classList.add('sel');sTap();return;}
 if(st.sel===el){el.classList.remove('sel');st.sel=null;return;}
 const a=+st.sel.dataset.v,b=+el.dataset.v,first=st.sel;st.sel=null;first.classList.remove('sel');
 if(a+b===st.T){first.classList.add('boom');el.classList.add('boom');sBoom();st.blasts++;st.left-=2;msg.textContent=a+' + '+b+' = '+st.T+' 💥';say(a+' and '+b+' make '+st.T);
  if(st.left<=0){st.wave++;setTimeout(()=>{if(!st)return;if(st.wave<3)wave();else result();},1200);}}
 else{sBad();[first,el].forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');});msg.textContent=a+' + '+b+' = '+(a+b)+'. We need '+st.T+'!';say(a+' and '+b+' make '+(a+b)+'. Try again');}}
function result(){const secs=Math.round((Date.now()-st.t0)/1000),md=st.md;const prev=getBest(md.id);setBest(md.id,secs);sWin();
 const rec=!prev||secs<prev;
 app.innerHTML='<h1>All asteroids blasted!</h1><div class="result"><div style="font-size:70px">💥🚀</div><div class="big">'+secs+' seconds</div><p class="sub">'+(rec?'New record! ':'')+'Best time: '+getBest(md.id)+' seconds</p></div><button class="btn" id="again" style="background:#2bb24c">Play again</button><button class="btn" id="menu" style="background:#6a4c93">Choose a mission</button>';
 say((rec?'New record! ':'Well done! ')+'You blasted them all in '+secs+' seconds');
 document.getElementById('again').onclick=()=>start(md);document.getElementById('menu').onclick=menu;}
menu();
</script>
</body>
</html>
