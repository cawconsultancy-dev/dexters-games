<style>
:root{--bg:#9fd3ff;--accent:radial-gradient(circle at 35% 30%,#ffd43a,#ff7a3a);--accent-d:#e0602a}

@font-face{font-family:Fredoka;src:url(../fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff6e5;font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5;transition:opacity .2s}
.hud.off{opacity:0}
.hud .pill{display:flex;align-items:center;gap:8px;background:#0b123acc;border:2px solid #ffffff22;border-radius:999px;padding:6px 16px 6px 10px;font-size:24px;font-weight:700;box-shadow:0 6px 16px #0005;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud .pill i{font-style:normal;font-size:22px}

.hud .sp{flex:1}
.hud button{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:2px solid #ffffff33;background:#0b123acc;color:#fff;font:700 18px Fredoka,sans-serif;box-shadow:0 6px 16px #0005;cursor:pointer}

.ov[hidden]{display:none}
.card{width:min(440px,100%);text-align:center;padding:26px 24px 24px;border-radius:34px;background:linear-gradient(180deg,#ffffffee,#f3eeffee);color:#1d1b3a;box-shadow:0 30px 70px #000a,inset 0 -6px 0 #0000000f;animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{transform:translateY(40px) scale(.9);opacity:0}}
.icon{width:132px;height:132px;margin:-90px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:72px;background:radial-gradient(circle at 35% 30%,#ffffff66,transparent 40%),var(--accent);box-shadow:0 0 0 7px #fff,0 0 0 13px var(--gold,#f2b33d),0 18px 30px #0006}
.card h1{margin:4px 0 6px;font-size:clamp(34px,8vw,46px);line-height:1;font-weight:700;letter-spacing:-.02em}
.card p{margin:0 auto 18px;font-size:19px;line-height:1.35;color:#4a4870;max-width:30ch}
.big{font-size:72px;font-weight:700;line-height:1;color:var(--accent-d);margin:6px 0 4px}
.tag{display:inline-block;background:var(--gold,#f2b33d);color:#2a1a00;border-radius:999px;padding:4px 14px;font-weight:700;font-size:17px;margin-bottom:10px}

.go:active{transform:translateY(5px);box-shadow:0 2px 0 #b7801d}
.go svg{width:30px;height:30px}
.row{display:flex;gap:10px;margin-top:14px}
.ghost{flex:1;border:2px solid #1d1b3a22;background:#fff;color:#1d1b3a;border-radius:999px;padding:11px;font:600 18px Fredoka,sans-serif;cursor:pointer}
.best{font-size:17px;color:#6b6990;margin-top:12px}
.hint{font-size:16px;color:#6b6990;margin:-6px 0 14px}
.float{position:fixed;pointer-events:none}
@media (prefers-reduced-motion:reduce){.card{animation:none}}


#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
canvas#c{z-index:1;background:transparent}
.hud{display:none!important}
.pick{margin:0 0 12px}
.pick h3{margin:0 0 6px;font-size:16px;color:#6b6990;font-weight:600}
.lvl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lb{width:40px;height:40px;border-radius:12px;border:2px solid #1d1b3a18;background:#fff;font:700 17px Fredoka,sans-serif;color:#1d1b3a;cursor:pointer}
.lb.on{background:#e0602a;color:#fff;border-color:#e0602a}
.lb.lock{opacity:.35}
.trow2{display:flex;gap:8px}
.tbtn{flex:1;min-width:0;border:2px solid #1d1b3a18;background:#fff;border-radius:16px;padding:8px 4px;font:600 15px Fredoka,sans-serif;color:#1d1b3a;cursor:pointer}
.tbtn.on{background:#1d1b3a;color:#fff;border-color:#1d1b3a}
#title{overflow-y:auto;place-items:start center;padding-top:110px}
#title .card{margin:0 auto 30px}

<div class="ov" id="title" hidden><div class="card"><div class="icon" id="tIcon"></div><h1 id="tTitle"></h1><p id="tSub"></p><div class="hint" id="tHint"></div><button class="go" id="play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2a1a00"/><path d="M10 7.5v9l7-4.5z" fill="#f2b33d"/></svg>Play</button><div class="best" id="tBest"></div><div class="row"><button class="ghost snd"></button></div></div></div>

<script>
const GAME_KEY='onetwothreefour';

const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');let W=innerWidth,H=innerHeight,DPR=1;
const store={get(k,d){try{const v=localStorage.getItem('fun_'+GAME_KEY+'_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('fun_'+GAME_KEY+'_'+k,JSON.stringify(v));}catch(e){}}};
/* ---------- sound ---------- */
let AC=null,soundOn=store.get('sound',true),master=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=soundOn?1:0;master.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,vol,delay,slideTo){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.05);}
function noise(d,vol,freq,delay,type){if(!AC)return;const t=AC.currentTime+(delay||0),n=Math.max(1,Math.floor(AC.sampleRate*d)),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq||1000;const g=AC.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(master);s.start(t);}
const sfx={
 coin(){tone(988,0.08,'square',0.06);tone(1319,0.18,'square',0.06,0.07);},
 pop(){noise(0.08,0.25,1800);tone(500,0.08,'sine',0.12,0,1200);},
 jump(){tone(330,0.18,'square',0.06,0,700);},
 hit(){noise(0.25,0.35,400,0,'lowpass');tone(160,0.3,'sawtooth',0.08,0,60);},
 good(){[523,659,784].forEach((f,i)=>tone(f,0.16,'triangle',0.12,i*0.06));},
 win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.24,'triangle',0.13,i*0.1));},
 over(){[392,330,262,196].forEach((f,i)=>tone(f,0.3,'triangle',0.12,i*0.16));},
 whoosh(){noise(0.18,0.18,600,0,'bandpass');},
 tap(){tone(700,0.05,'sine',0.07);}};
function say(t){if(!soundOn)return;try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.92;u.pitch=1.1;const v=s.getVoices().find(x=>/en[-_]GB/i.test(x.lang));if(v)u.voice=v;s.speak(u);}catch(e){}}
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}}
function emoji(e,x,y,size,rot,alpha){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(alpha!==undefined)ctx.globalAlpha=alpha;ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,0,size*0.06);ctx.restore();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function text(t,x,y,size,col,align,stroke){ctx.font='700 '+size+'px Fredoka,"Arial Rounded MT Bold",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=size*0.18;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(t,x,y);}ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);}
/* ---------- particles, floating text, shake ---------- */
let parts=[],floats=[],shakeT=0,shakeM=0;
function burst(x,y,cols,n,spd,size,grav){for(let i=0;i<(n||14);i++){const a=Math.random()*Math.PI*2,s=rnd(0.3,1)*(spd||260);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(0.5,0.9),L:0.9,r:rnd(0.5,1)*(size||6),c:pick(cols),g:grav===undefined?500:grav,star:Math.random()<0.25});}}
function floatText(t,x,y,col,size){floats.push({t,x,y,c:col||'#fff',s:size||30,l:1});}
function shake(m,t){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t||0.3);}
function star(x,y,r,fill){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}}
function drawFx(dt){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=0.985;p.l-=dt;ctx.globalAlpha=clamp(p.l/p.L*1.4,0,1);if(p.star)star(p.x,p.y,p.r*1.4,p.c);else circ(p.x,p.y,p.r,p.c);});ctx.globalAlpha=1;parts=parts.filter(p=>p.l>0);
 floats.forEach(f=>{f.y-=60*dt;f.l-=dt*0.9;ctx.globalAlpha=clamp(f.l*1.5,0,1);text(f.t,f.x,f.y,f.s*(1+0.2*(1-f.l)),f.c,'center','#0008');});ctx.globalAlpha=1;floats=floats.filter(f=>f.l>0);}
/* ---------- game state ---------- */
let state='title',score=0,lives=0,best=store.get('best',0),T=0,last=0;
function setScore(v){score=Math.max(0,Math.round(v));$('score').textContent=score;}
function addScore(v,x,y,col){setScore(score+v);if(x!==undefined)floatText((v>0?'+':'')+v,x,y,col||'#ffd27a');}
function setLives(v){lives=v;$('lives').textContent=v>0?'❤️'.repeat(v):'';$('lives').hidden=!G.lives;}
function loseLife(x,y){if(!G.lives)return;setLives(lives-1);shake(14,0.35);sfx.hit();if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}if(lives<=0)setTimeout(()=>{if(state==='play')gameOver();},450);}
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';if(G.resize)G.resize();}
function show(id){['title','pause','over'].forEach(k=>$(k).hidden=k!==id);$('hud').classList.toggle('off',!(id===null||id==='pause'));}
function start(){audioInit();parts=[];floats=[];T=0;setScore(0);setLives(G.lives||0);G.init();state='play';show(null);sfx.tap();}
function gameOver(custom){if(state!=='play')return;state='over';const nb=score>best;if(nb){best=score;store.set('best',best);}
 $('oTitle').textContent=(custom&&custom.title)||(nb&&score>0?pick(['Amazing!','Superstar!','Wow!']):(score>0?pick(['Great game!','Brilliant!','So close!','Nice one!']):'Have another go!'));
 $('oTag').hidden=!(nb&&score>0);$('oScore').textContent=score;$('oUnit').textContent=G.unit||'points';$('oBest').textContent='Best: '+best+' '+(G.unit||'points');
 setTimeout(()=>{show('over');(nb&&score>0?sfx.win:sfx.over)();if(nb&&score>0)for(let i=0;i<4;i++)setTimeout(()=>burst(rnd(W*0.2,W*0.8),rnd(H*0.2,H*0.5),['#ffd27a','#ff6b9a','#7ad7ff','#9bff8a','#fff'],26,380,7,300),i*180);},custom&&custom.delay!==undefined?custom.delay:500);}
function pause(){if(state!=='play')return;state='pause';show('pause');}
function resume(){if(state!=='pause')return;state='play';show(null);last=performance.now();}
function frame(now){const dt=Math.min(0.034,(now-(last||now))/1000);last=now;
 if(state==='play'){T+=dt;G.update(dt);}else if(G.idle)G.idle(dt);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(shakeT>0){shakeT-=dt;const m=shakeM*clamp(shakeT/0.3,0,1);ctx.translate(rnd(-m,m),rnd(-m,m));}else shakeM=0;
 G.draw(ctx,dt);drawFx(dt);requestAnimationFrame(frame);}
function pos(e){return[e.clientX,e.clientY];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(state!=='play')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}if(G.down)G.down(...pos(e),e);});
cv.addEventListener('pointermove',e=>{if(state==='play'&&G.move)G.move(...pos(e),e);});
addEventListener('pointerup',e=>{if(state==='play'&&G.up)G.up(...pos(e),e);});
addEventListener('pointercancel',e=>{if(state==='play'&&G.up)G.up(...pos(e),e);});
addEventListener('keydown',e=>{if(e.repeat)return;if(state==='title'&&(e.key===' '||e.key==='Enter')){start();return;}if(e.key==='Escape'||e.key==='p'){state==='play'?pause():resume();return;}if(state==='play'&&G.key){G.key(e.key,true);e.preventDefault();}});
addEventListener('keyup',e=>{if(state==='play'&&G.key)G.key(e.key,false);});
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
function setSound(on){soundOn=on;store.set('sound',on);if(master)master.gain.value=on?1:0;document.querySelectorAll('.snd').forEach(b=>b.textContent=on?'🔊 Sound on':'🔇 Sound off');}
function boot(){document.title=G.title;$('tIcon').textContent=G.icon;$('tTitle').textContent=G.title;$('tSub').textContent=G.sub;$('tHint').textContent=G.hint||'';$('tBest').textContent=best?'Best: '+best+' '+(G.unit||'points'):'';$('scoreIcon').textContent=G.scoreIcon||'⭐';
 $('play').onclick=start;$('again').onclick=start;$('restart').onclick=()=>{state='over';start();};$('resume').onclick=resume;$('pauseBtn').onclick=pause;
 $('toTitle').onclick=()=>{$('tBest').textContent=best?'Best: '+best+' '+(G.unit||'points'):'';state='title';G.init();show('title');};
 document.querySelectorAll('.snd').forEach(b=>b.onclick=()=>{audioInit();setSound(!soundOn);});setSound(soundOn);
 if(G.noPause)$('pauseBtn').hidden=true;
 fit();G.init();show('title');requestAnimationFrame(frame);}



say=function(){};/* no voice-over in this game (Craig, 08/11/2026) */
const G={title:'1,2,3,4',icon:'🔴',sub:'Roll your ball, collect number balls to make it bigger, and steer round the blocks. Then bounce up the rainbow steps!',hint:'Drag left and right to steer.',unit:'stars',scoreIcon:'⭐'};
let maxLevel=Math.max(1,+store.get('maxlvl',1)||1),level=Math.min(maxLevel,+store.get('lvl',1)||1),theme=store.get('theme','snow');
const THEMES={
 snow:{name:'❄️ Snowy mountains',sky:['#8ccaf7','#e9f6ff'],fog:0xe9f6ff,ground:0xf4f8ff,road:['#e2f1ff','#c9e2f8'],edge:0x9cc4e8,obs:[0xa8dcff,0x7cc4f0,0xd6efff]},
 desert:{name:'🏜️ Desert',sky:['#ffc27a','#fff1d6'],fog:0xfff1d6,ground:0xf0d095,road:['#f2d6a0','#e6c486'],edge:0xd3a85e,obs:[0xd9a35a,0xc48a40,0xe8bc74]},
 candy:{name:'🍭 Candy land',sky:['#ffaedc','#fff0fa'],fog:0xfff0fa,ground:0xffd1ec,road:['#ffffff','#ffe1f2'],edge:0xff8fc8,obs:[0x7a4a2a,0x5a321a,0x8f5a36]}};
/* ---------- number pictures ---------- */
const VCOL=['#ff5a5a','#ff9f3a','#ffcf2a','#4fc95e','#3aa0ff','#7a6bff','#ff6bd0','#22c4b4','#9ccc3a','#ff7a5a'];
function colOf(v){return VCOL[(v-1)%VCOL.length];}
function numCanvas(txt,size){size=size||140;const c=document.createElement('canvas');const x=c.getContext('2d');const f='700 '+size+'px Fredoka, "Arial Rounded MT Bold", sans-serif';x.font=f;const w=Math.ceil(x.measureText(txt).width)+size*0.45;c.width=Math.max(size,w);c.height=Math.ceil(size*1.3);
 x.font=f;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=size*0.16;x.strokeStyle='rgba(20,16,40,0.85)';x.strokeText(txt,c.width/2,c.height/2+size*0.04);x.fillStyle='#fff';x.fillText(txt,c.width/2,c.height/2+size*0.04);return c;}
function numSprite(txt,h){const c=numCanvas(txt);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(h*c.width/c.height,h,1);s.userData.h=h;s.renderOrder=2;return s;}
function setSpriteText(s,txt,h){const c=numCanvas(txt);s.material.map.dispose();s.material.map=new THREE.CanvasTexture(c);s.material.needsUpdate=true;s.userData.h=h;s.scale.set(h*c.width/c.height,h,1);}
function ballTex(col){const c=document.createElement('canvas');c.width=128;c.height=64;const x=c.getContext('2d');x.fillStyle=col;x.fillRect(0,0,128,64);x.fillStyle='rgba(255,255,255,0.35)';x.fillRect(0,26,128,12);x.fillStyle='rgba(0,0,0,0.12)';for(let i=0;i<4;i++){x.beginPath();x.arc(16+i*32,14,5,0,7);x.fill();x.beginPath();x.arc(32+i*32,50,5,0,7);x.fill();}return new THREE.CanvasTexture(c);}

  if(phase==='dbl'&&pz<=dbl.end){say('The end of the road! You made '+fmt(val));endDouble('You made '+fmt(val)+'!');}}
 else if(phase==='climb'){
  if(hop){hop.t+=dt/0.42;const k=Math.min(1,hop.t);pz=hop.z0+(hop.z1-hop.z0)*k;px=hop.x0*(1-k);me.position.y=hop.y0+(hop.y1-hop.y0)*k+Math.sin(k*Math.PI)*1.4;
   if(k>=1){hop=null;climb++;const n=NOTES[climb-1];tone(n,0.45,'triangle',0.6);tone(n*2,0.3,'sine',0.3);tone(n/2,0.35,'square',0.12);const [sx,sy]=screenOf(px,me.position.y+rad,pz);floatText('♪',sx+rnd(-30,30),sy-20,['#ff5a5a','#3aa0ff','#4fc95e','#ff6bd0','#ffcf2a'][climb%5],48);finishT=0.08;}}
  else{finishT-=dt;if(finishT<=0){const nxt=steps[climb];if(nxt&&val>=nxt.v){const cy=climb>0?steps[climb-1].y:0;hop={t:0,z0:pz,z1:nxt.z,y0:cy+rad,y1:nxt.y+rad,x0:px};}else{phase='done';finishLevel();}}}}
 objs.forEach(o=>{if(o.type==='ball'&&!o.done){o.m.rotation.y+=dt*1.5;}});
 debris.forEach(d=>{d.t-=dt;d.v.y-=20*dt;d.m.position.addScaledVector(d.v,dt);d.m.rotation.x+=d.r.x*dt;d.m.rotation.y+=d.r.y*dt;if(d.t<=0)scene.remove(d.m);});debris=debris.filter(d=>d.t>0);
 const s=rad;me.scale.set(s,s,s);me.position.x=px;me.position.z=pz;if(phase==='run'||phase==='ready')me.position.y=s+(bumpT>0?Math.sin(bumpT*9)*0.3:0);if(phase==='dbl'||(phase==='done'&&dbl))me.position.y=dbl.by+s;me.rotation.x=-roll;
 meLab.position.set(px,me.position.y+s+0.5+meLab.userData.h*0.3,pz);
 const ch=phase==='climb'||phase==='done'||phase==='dbl'?Math.max(0,me.position.y-s):0;camZ+=(pz-camZ)*Math.min(1,dt*8);camera.position.set(px*0.35+(ch&&!dbl?3:0),6.4+s+ch*0.8,camZ+10+s*1.5);camera.lookAt(px*0.35,0.6+ch,camZ-9);}
function finishLevel(){const n=climb;const stars=n>=10?3:n>=6?2:1;setScore(stars);sfx.win();
 for(let i=0;i<5;i++)setTimeout(()=>burst(rnd(W*0.2,W*0.8),rnd(H*0.2,H*0.5),['#ffd27a','#ff6b9a','#7ad7ff','#9bff8a','#fff'],26,380,7,300),i*180);
 say(n>=10?'You reached the top with '+val+'! Brilliant!':'You made '+val+' and bounced up '+n+' steps! '+(stars===2?'Great job!':'Well done!'));
 if(level>=maxLevel&&level<10){maxLevel=level+1;store.set('maxlvl',maxLevel);}const done=level;if(level<10)level++;store.set('lvl',level);
 setTimeout(()=>{if(state!=='play'||!LV)return;startDouble();},2000);}
/* ---------- HUD ---------- */
function drawHUD(){ctx.clearRect(0,0,W,H);if(state!=='play'||!LV)return;
 rr(12,14,46,46,23);ctx.fillStyle='#0b123acc';ctx.fill();text('❚❚',35,37,18,'#fff');
 rr(70,14,150,46,23);ctx.fillStyle='#0b123acc';ctx.fill();text(dbl?'×2 run':'Level '+level,145,37,24,'#fff');
 if(dbl){const nar=W<640;const bx=nar?20:W*0.25,bw=nar?W-40:W*0.5,by=nar?76:30;const f=Math.min(1,Math.log2(val)/30);rr(bx,by,bw,16,8);ctx.fillStyle='#ffffffcc';ctx.fill();rr(bx,by,bw*f,16,8);ctx.fillStyle='#ff4fa8';ctx.fill();text('×2 to 1,073,741,824',bx+bw/2,by+36,20,'#fff','center','#0008');text(fmt(val),W/2,H-50,Math.min(54,W*0.09),'#fff','center','#000a');return;}
 const f=Math.min(1,Math.max(0,-pz/(-LV.finish)));const nar=W<640;const bx=nar?20:W*0.3,bw=nar?W-80:W*0.5,by=nar?76:30;rr(bx,by,bw,14,7);ctx.fillStyle='#ffffffcc';ctx.fill();rr(bx,by,bw*f,14,7);ctx.fillStyle='#ff7a3a';ctx.fill();text('🏁',bx+bw+20,by+7,22,'#fff');
 if(phase==='ready')text('Drag to steer!',W/2,H*0.35,Math.min(W,H)*0.07,'#fff','center','#0008');}
/* ---------- hooks ---------- */
let readyT=0;
G.init=()=>{initGL();buildPicker();};
G.resize=()=>resizeGL();
const _start=start;start=function(){if(!buildWorld()){return;}_start();phase='ready';readyT=1.2;say('Level '+level+'. Collect the number balls!');};
G.update=dt=>{if(phase==='ready'){readyT-=dt;if(readyT<=0)phase='run';}update(dt);};
G.idle=dt=>{if(state==='pause')return;if((!LV||builtTheme!==theme)&&renderer){buildWorld();phase='title';}if(!LV)return;const t=performance.now()/1000;camera.position.set(Math.sin(t*0.2)*3,7,10);camera.lookAt(0,0.6,-10);me.scale.set(rad,rad,rad);me.position.set(0,rad+Math.abs(Math.sin(t*3))*0.4,0);me.rotation.x=-t*2;meLab.position.set(0,me.position.y+rad+0.9,0);};
G.draw=()=>{if(renderer&&LV)renderer.render(scene,camera);drawHUD();};
G.down=(x,y)=>{if(x<64&&y<70){pause();return;}dragX=x;dragPX=px;};
G.move=(x)=>{if(dragX===null||(phase!=='run'&&phase!=='ready'&&phase!=='dbl'))return;px=dragPX+(x-dragX)/Math.min(W,700)*ROADW*1.4;px=Math.max(-ROADW/2+rad,Math.min(ROADW/2-rad,px));};
G.up=()=>{dragX=null;};
G.key=(k,down)=>{if(k==='ArrowLeft'||k==='a')keyL=down;if(k==='ArrowRight'||k==='d')keyR=down;};
function buildPicker(){if($('picker'))return renderPicker();const box=document.createElement('div');box.id='picker';
 box.innerHTML='<div class="pick"><h3>Pick a level</h3><div class="lvl" id="lvls"></div></div><div class="pick"><h3>Pick a world</h3><div class="trow2" id="trow"></div></div>';
 const play=$('play');play.parentNode.insertBefore(box,play);
 $('lvls').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;const n=+b.dataset.l;if(n>maxLevel){say('Finish level '+maxLevel+' first');return;}level=n;store.set('lvl',level);renderPicker();say('Level '+n);LV=null;};
 $('trow').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;theme=b.dataset.t;store.set('theme',theme);renderPicker();say(b.textContent.replace(/^\S+\s/,''));LV=null;};renderPicker();}
function renderPicker(){$('lvls').innerHTML=Array.from({length:10},(_,i)=>i+1).map(n=>'<button class="lb'+(n===level?' on':'')+(n>maxLevel?' lock':'')+'" data-l="'+n+'">'+(n>maxLevel?'🔒':n)+'</button>').join('');
 $('trow').innerHTML=Object.keys(THEMES).map(k=>'<button class="tbtn'+(k===theme?' on':'')+'" data-t="'+k+'">'+THEMES[k].name+'</button>').join('');}

boot();
</script>
