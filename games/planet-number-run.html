<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Planet Number Run</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0920;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const LANES=3;
/* Real space objects, smallest to largest. Index k is the object for number 2^k. */
const RAW=[
 ['Psyche','a metal asteroid','#9aa3ad','#4d5560','rock',0],
 ['Mimas','a moon of Saturn','#c9c9c9','#7d7d7d','mimas'],
 ['Hygiea','a giant asteroid','#6f665e','#3a332d','rock',1],
 ['Enceladus','an icy moon of Saturn','#f2f7ff','#a9c4dd','enceladus'],
 ['Vesta','a giant asteroid','#a39889','#5e554b','rock',2],
 ['Salacia','a dwarf planet candidate','#8a6f63','#4a3a33','plain'],
 ['Ceres','a dwarf planet','#9c9a96','#55524d','ceres'],
 ['Quaoar','a dwarf planet candidate','#b0705a','#5e3427','plain'],
 ['Charon','a moon of Pluto','#a9a49e','#5e5852','charon'],
 ['Makemake','a dwarf planet','#c98a62','#7a4a2c','plain'],
 ['Haumea','an egg-shaped dwarf planet','#eef1f4','#9aa6b2','egg'],
 ['Eris','a dwarf planet','#f0eee8','#a8a49a','craters'],
 ['Pluto','a dwarf planet','#d9b48f','#7d5a3c','pluto'],
 ['Triton','a moon of Neptune','#e9cfc8','#9b7d76','triton'],
 ['Europa','a moon of Jupiter','#efe3c8','#a8916a','europa'],
 ['the Moon',"Earth's moon",'#c4c4c4','#7a7a7a','craters'],
 ['Io','a moon of Jupiter','#f2d64b','#b08a1e','io'],
 ['Callisto','a moon of Jupiter','#7d7064','#3d342c','callisto'],
 ['Mercury','a planet','#a8998a','#6e6155','craters'],
 ['Titan','a moon of Saturn','#e0a04a','#8a5a1e','titan'],
 ['Ganymede','the biggest moon','#a69a8c','#5e5448','ganymede'],
 ['Mars','a planet','#d1552a','#8a2d12','mars'],
 ['Venus','a planet','#e9c77d','#b98d3e','swirl'],
 ['Earth','a planet','#2f6fd6','#1b3f86','earth'],
 ['Neptune','a planet','#3d5fd9','#22337f','bands'],
 ['Uranus','a planet','#9fe3e8','#5fa9b0','uranus'],
 ['Saturn','a planet','#e6cc8f','#a88a4c','saturn'],
 ['Jupiter','the biggest planet','#d9a066','#8f5a2e','jupiter'],
 ['the Sun','our star','#ffcf3a','#ff7b00','star'],
 ['Sirius','the brightest star in the night sky','#e8f2ff','#8fb8ff','star'],
 ['Arcturus','an orange giant star','#ffb35c','#d0621a','star'],
 ['Rigel','a blue supergiant star','#bfe0ff','#4a90ff','star'],
 ['Betelgeuse','a red supergiant star','#ff7a4a','#c0200a','star'],
 ['VY Canis Majoris','a red hypergiant star','#ff5a3a','#8a1000','star'],
 ['the Solar System','our home in space','#2a2466','#0a0820','system'],
 ['the Orion Nebula','a nebula','#b04ad0','#0a0820','nebula',0],
 ['the Tarantula Nebula','a giant nebula','#ff6a8a','#0a0820','nebula',1],
 ['the Large Magellanic Cloud','a small galaxy','#4a4aa0','#0a0820','irregular'],
 ['the Triangulum Galaxy','a spiral galaxy','#3a4ab0','#0a0820','spiral',1],
 ['the Milky Way','our galaxy','#5a4ab8','#0a0820','spiral',0],
 ['the Andromeda Galaxy','a spiral galaxy','#4a3aa0','#0a0820','spiral',2],
 ['IC 1101','a giant galaxy','#6a4a80','#0a0820','elliptical'],
 ['the Local Group','a group of galaxies','#2a2466','#0a0820','group'],
 ['the Virgo Cluster','a cluster of galaxies','#3a3080','#0a0820','gcluster'],
 ['Laniakea','a supercluster of galaxies','#2a2466','#05041a','web'],
 ['the whole universe','everything there is!','#241c5c','#05041a','universe']];
const SHORTFIX={'the Large Magellanic Cloud':'Magellanic Cloud','the Triangulum Galaxy':'Triangulum','the Andromeda Galaxy':'Andromeda','the whole universe':'Universe'};
const PL=RAW.map(a=>({label:a[0],cat:a[1],c:a[2],d:a[3],f:a[4],va:a[5]||0,
 short:SHORTFIX[a[0]]||(a[0].replace(/^the /,'').replace(/^./,m=>m.toUpperCase()))}));
const DEEP=['system','nebula','irregular','spiral','elliptical','group','gcluster','web','universe'];
const MAXL=PL.length-3;
let W,H,DPR,trackW,trackX,laneW,baseR,playerY;
let state='title',slow=true,voiceOn=true;
let best=1;try{best=Math.max(1,Math.min(MAXL,parseInt(localStorage.getItem('snr_best'))||1));}catch(e){}
let level=best;
let player={x:0,tx:0,v:1,pop:0,shake:0};
let objs=[],parts=[],msgs=[],buttons=[];
let dist=0,nextRowD=0,rowIndex=0,totalRows=0,finishD=null,target=8,startV=1,dragging=false;
let keys={l:false,r:false},safeLane=null,sched=[],schedIdx=0,behind=false;
const stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random(),s:0.3+Math.random()*0.7});

function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
 trackW=Math.min(W*0.92,560);trackX=(W-trackW)/2;laneW=trackW/LANES;baseR=Math.min(laneW*0.26,H*0.06);playerY=H*0.74;
 if(!player.x){player.x=player.tx=W/2;}}
addEventListener('resize',resize);resize();

function uiFs(){return Math.max(16,Math.min(40,Math.min(W,H)/17));}
function shade(h,a){const n=parseInt(h.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')';}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function kOf(v){return Math.min(PL.length-1,Math.max(0,Math.round(Math.log2(v))));}
function radius(v){const k=kOf(v);return Math.min(laneW*0.42,baseR*(0.75+0.055*k));}
function laneX(i){return trackX+laneW*(i+0.5);}
function fmt(v){if(v<1e6)return v.toLocaleString('en-GB');const u=v>=1e12?[1e12,' trillion']:v>=1e9?[1e9,' billion']:[1e6,' million'];
 let n=v/u[0];n=n<10?Math.round(n*100)/100:n<100?Math.round(n*10)/10:Math.round(n);return n+u[1];}

/* ---------- sound and voice ---------- */
let AC=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function sMerge(k){const b=330*Math.pow(2,(k%8)/8);[0,4,7,12].forEach((s,i)=>tone(b*Math.pow(2,s/12),0.25,'triangle',0.15,i*0.06));}
function sComet(){tone(160,0.35,'sawtooth',0.12);tone(90,0.45,'square',0.08,0.05);}
function sBoing(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(150,t+0.25);g.gain.setValueAtTime(0.14,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.35);}
function sWin(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.15,i*0.12));}
function say(txt){if(!voiceOn)return;try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='en-GB';u.rate=0.95;u.pitch=1.15;const v=s.getVoices().find(x=>/en[-_]GB/i.test(x.lang));if(v)u.voice=v;s.speak(u);}catch(e){}}

/* ---------- level and track ---------- */
/* Each level starts on one object and grows three steps to the goal */
function startLevel(){startV=Math.pow(2,level-1);target=startV*8;player.v=startV;player.x=player.tx=W/2;player.pop=0;player.shake=0;
 objs=[];parts=[];msgs=[];dist=0;nextRowD=H*0.9;rowIndex=0;finishD=null;safeLane=null;
 totalRows=40;schedIdx=0;behind=false;sched=[5,17,29];state='play';say('You are '+PL[kOf(startV)].label+'. Grow into '+PL[kOf(target)].label);}
function chainValue(){let c=player.v;const ahead=objs.filter(o=>o.type==='ball'&&!o.dead&&o.d>dist).sort((a,b)=>a.d-b.d);
 for(const o of ahead){if(o.v===c&&c<target)c*=2;}return c;}
function decoyVal(c){const o=[],top=Math.pow(2,PL.length-1);for(let v=Math.max(1,startV/16);v<=Math.min(top,target*4);v*=2)if(v!==c&&v!==target)o.push(v);return o.length?o[Math.floor(Math.random()*o.length)]:c*2;}
function spawnRow(){
 if(rowIndex>=totalRows){if(player.v<target&&totalRows<56){totalRows+=4;}else{finishD=nextRowD;return;}}
 const d=nextRowD;rowIndex++;nextRowD+=H*0.32;
 const lanes=[0,1,2].sort(()=>Math.random()-0.5);
 const hz=(lane)=>objs.push({type:'comet',x:laneX(lane),d});
 const ball=(lane,v)=>objs.push({type:'ball',v,x:laneX(lane),d});
 const kind=rowIndex%2===1?'help':(Math.random()<0.6?'comet':'decoy');
 if(kind==='help'){if(safeLane!==null){lanes.splice(lanes.indexOf(safeLane),1);lanes.unshift(safeLane);safeLane=null;}
  /* the matching ball comes at planned points through the level, or straight away if a hazard knocked you back */
  const due=schedIdx<sched.length&&rowIndex>=sched[schedIdx];
  const c=chainValue();
  if(c<target&&(due||behind||schedIdx>=sched.length)){ball(lanes[0],c);if(due)schedIdx++;behind=false;}
  else ball(lanes[0],decoyVal(c));
  ball(lanes[1],decoyVal(c));
  if(level>=3&&Math.random()<0.25)hz(lanes[2]);else if(Math.random()<0.5)ball(lanes[2],decoyVal(c));}
 else if(kind==='comet'){const n=level<4?1:(Math.random()<0.6?1:2);for(let i=0;i<n;i++)hz(lanes[i]);safeLane=lanes[LANES-1];
  if(n===1&&Math.random()<0.5)ball(lanes[1],decoyVal(chainValue()));}
 else{const n=2+(Math.random()<0.4?1:0);for(let i=0;i<n;i++)ball(lanes[i],decoyVal(chainValue()));}
}
function speed(){return H*(slow?0.2:0.3)*(1+0.01*(level-1));}

function msg(t,col){msgs.push({t,col,life:2});msgs=msgs.slice(-2);}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(0.3+Math.random())*H*0.5;parts.push({kind:'dot',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,life:0.8,r:3+Math.random()*5});}}

function hit(o){
 o.dead=true;const oy=playerY-(o.d-dist);
 if(o.type==='comet'){const old=player.v;if(player.v>1){player.v/=2;behind=true;}player.shake=0.5;sComet();burst(o.x,oy,'#bfe8ff',16);
  msg(old>1?'Comet! '+fmt(old)+' halved to '+fmt(player.v):'Comet! Watch out','#ff9a9a');return;}
 if(o.v===player.v){const old=player.v;player.v*=2;player.pop=1;const k=kOf(player.v),p=PL[k];sMerge(k);burst(player.x,playerY,p.c,26);
  msg(fmt(old)+' + '+fmt(old)+' = '+fmt(player.v),'#ffd400');msg("You're "+p.short+'!','#ffffff');
  say((old<10000?old+' and '+old+' make '+player.v+'. ':'Double! ')+p.label+', '+p.cat+'!');
  if(player.v>=target)win();}
 else{sBoing();parts.push({kind:'ball',x:o.x,y:oy,vx:(o.x<player.x?-1:1)*W*0.8,vy:-H*0.6,v:o.v,r:radius(o.v),life:1});
  msg(fmt(player.v)+' and '+fmt(o.v)+" don't match",'#9fd3ff');}
}
function win(){state='win';sWin();const p=PL[kOf(player.v)];say('Well done! You are '+p.label+', '+p.cat);
 best=Math.max(best,Math.min(level+1,MAXL));try{localStorage.setItem('snr_best',best);}catch(e){}
 for(let i=0;i<90;i++)parts.push({kind:'conf',x:Math.random()*W,y:-Math.random()*H*0.5,vx:(Math.random()-0.5)*W*0.2,vy:Math.random()*H*0.2,col:PL[(i*7)%PL.length].c,life:3.5,rot:Math.random()*6});}

/* ---------- update ---------- */
function update(dt){
 for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=H*(p.kind==='conf'?0.25:1.5)*dt;if(p.rot!==undefined)p.rot+=dt*6;}
 parts=parts.filter(p=>p.life>0);
 for(const m of msgs)m.life-=dt;msgs=msgs.filter(m=>m.life>0);
 player.pop=Math.max(0,player.pop-dt*3);player.shake=Math.max(0,player.shake-dt);
 if(state==='title'){dist+=H*0.1*dt;return;}
 if(state!=='play')return;
 dist+=speed()*dt;
 while(finishD===null&&nextRowD<dist+H)spawnRow();
 const minX=trackX+radius(player.v)+6,maxX=trackX+trackW-radius(player.v)-6;
 if(keys.l)player.tx-=W*1.1*dt;if(keys.r)player.tx+=W*1.1*dt;
 player.tx=Math.max(minX,Math.min(maxX,player.tx));
 player.x+=(player.tx-player.x)*Math.min(1,dt*12);
 const pr=radius(player.v);
 for(const o of objs){if(o.dead)continue;const oy=playerY-(o.d-dist);const orr=o.type==='comet'?baseR*0.65:radius(o.v);
  const dx=o.x-player.x,dy=oy-playerY;if(dx*dx+dy*dy<(pr+orr)*(pr+orr)*0.7){hit(o);if(state!=='play')return;}}
 objs=objs.filter(o=>!o.dead&&(o.d-dist)>-H*0.3);
 if(finishD!==null&&dist>=finishD){state='fail';say('So close! Try again');}
}

/* ---------- object drawing ---------- */
let A=1;
function fa(a){cx.globalAlpha=A*a;}
function dots(list,col,al){fa(al);cx.fillStyle=col;for(const[a,b,c]of list){cx.beginPath();cx.arc(a,b,c,0,7);cx.fill();}fa(1);}
function blobs(r,list,col,al){fa(al);cx.fillStyle=col;for(const[a,b,c,d,e]of list){cx.beginPath();cx.ellipse(a*r,b*r,c*r,d*r,e||0,0,7);cx.fill();}fa(1);}
function stripes(r,col,alpha,gap,h,off){fa(alpha);cx.fillStyle=col;for(let i=-5;i<=5;i++)cx.fillRect(-r,(i*gap+(off||0))*r,2*r,h*r);fa(1);}
function lines(r,list,col,w,al){fa(al);cx.strokeStyle=col;cx.lineWidth=r*w;cx.lineCap='round';cx.beginPath();for(const[a,b,c,d]of list){cx.moveTo(a*r,b*r);cx.lineTo(c*r,d*r);}cx.stroke();fa(1);}
function glow(x,y,rad,col,al){const g=cx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');fa(al);cx.fillStyle=g;cx.beginPath();cx.arc(x,y,rad,0,7);cx.fill();fa(1);}
const ROCKS=[[1,0.84,0.95,0.78,1,0.9,0.95,0.8,0.98,0.86],[0.92,1,0.84,0.96,0.8,1,0.9,0.85],[1,0.95,1,0.92,0.98,0.88,1,0.94,0.97,0.9,0.96]];
function bodyPath(r,p){cx.beginPath();
 if(p.f==='rock'){const R=ROCKS[p.va];R.forEach((m,i)=>{const a=i/R.length*Math.PI*2,px=Math.cos(a)*r*m,py=Math.sin(a)*r*m*0.88;if(i)cx.lineTo(px,py);else cx.moveTo(px,py);});cx.closePath();}
 else if(p.f==='egg')cx.ellipse(0,0,r*1.2,r*0.74,0.3,0,7);
 else cx.arc(0,0,r,0,7);}
function satRing(r,back){cx.lineCap='butt';const a0=back?Math.PI:0,a1=back?Math.PI*2:Math.PI;
 fa(0.9);cx.strokeStyle='#e8d4a0';cx.lineWidth=r*0.2;cx.beginPath();cx.ellipse(0,0,r*1.75,r*0.42,-0.3,a0,a1);cx.stroke();
 fa(0.7);cx.strokeStyle='#b8995c';cx.lineWidth=r*0.07;cx.beginPath();cx.ellipse(0,0,r*1.45,r*0.33,-0.3,a0,a1);cx.stroke();fa(1);}
function uraRing(r,back){cx.lineCap='butt';const a0=back?Math.PI/2:-Math.PI/2,a1=back?Math.PI*1.5:Math.PI/2;
 fa(0.6);cx.strokeStyle='#e6fbff';cx.lineWidth=r*0.06;cx.beginPath();cx.ellipse(0,0,r*0.42,r*1.3,0.2,a0,a1);cx.stroke();fa(1);}
function spiral(r,va){const sq=[0.75,0.85,0.42][va],rot=[0,0.5,-0.55][va],arms=[2,3,2][va],cols=[['#bcd0ff','#ffb6e6'],['#9fd8ff','#c8b6ff'],['#ffe0b0','#bcd0ff']][va];
 cx.save();cx.rotate(rot);cx.scale(1,sq);cx.rotate(dist*0.0015);
 glow(0,0,r*0.45,'#fff6d8',0.95);
 for(let arm=0;arm<arms;arm++)for(let i=0;i<40;i++){const t=i/40,ang=arm*Math.PI*2/arms+t*Math.PI*2.2,rad=(0.12+t*0.82)*r;
  fa(0.85*(1-t*0.6));cx.fillStyle=cols[i%3?0:1];cx.beginPath();cx.arc(Math.cos(ang)*rad,Math.sin(ang)*rad,r*(0.075-t*0.045),0,7);cx.fill();}
 fa(1);cx.restore();}
function features(p,r){
 switch(p.f){
 case 'rock':dots([[-0.3*r,-0.15*r,0.18*r],[0.3*r,0.2*r,0.14*r],[0.1*r,-0.45*r,0.1*r],[-0.2*r,0.4*r,0.08*r]],p.d,0.55);if(p.va===2)dots([[0.05*r,0.55*r,0.35*r]],p.d,0.35);break;
 case 'mimas':dots([[0.35*r,-0.05*r,0.32*r]],p.d,0.5);dots([[0.35*r,-0.05*r,0.08*r]],'#ffffff',0.4);dots([[-0.4*r,0.3*r,0.1*r],[-0.2*r,-0.5*r,0.08*r]],p.d,0.4);break;
 case 'enceladus':lines(r,[[-0.5,0.35,0.1,0.55],[-0.35,0.2,0.3,0.42],[-0.2,0.08,0.45,0.28]],'#5aa9e6',0.06,0.7);break;
 case 'plain':blobs(r,[[-0.3,0.2,0.3,0.18,0.4],[0.35,-0.3,0.22,0.12,-0.3]],p.d,0.35);break;
 case 'ceres':dots([[-0.3*r,-0.2*r,0.16*r],[0.35*r,0.3*r,0.12*r],[0.4*r,-0.4*r,0.08*r]],p.d,0.45);dots([[0.05*r,0.0,0.07*r],[0.14*r,0.05*r,0.04*r]],'#ffffff',0.95);break;
 case 'charon':blobs(r,[[0,-0.95,0.6,0.32,0]],'#7a3b2a',0.75);dots([[-0.3*r,0.3*r,0.12*r],[0.35*r,0.1*r,0.1*r]],p.d,0.4);break;
 case 'egg':blobs(r,[[0.45,0.15,0.22,0.16,0.3]],'#b84a3a',0.5);break;
 case 'craters':dots([[-0.35*r,-0.25*r,0.2*r],[0.35*r,0.1*r,0.15*r],[-0.05*r,0.45*r,0.13*r],[0.25*r,-0.5*r,0.1*r],[-0.55*r,0.25*r,0.09*r]],p.d,0.45);break;
 case 'pluto':blobs(r,[[-0.55,0.1,0.35,0.5,0.2]],'#6e3f2a',0.55);
  fa(0.95);cx.fillStyle='#fbf3e6';cx.beginPath();cx.moveTo(0.2*r,0.55*r);cx.bezierCurveTo(-0.4*r,0.15*r,-0.15*r,-0.35*r,0.2*r,-0.1*r);cx.bezierCurveTo(0.55*r,-0.35*r,0.8*r,0.15*r,0.2*r,0.55*r);cx.fill();fa(1);break;
 case 'triton':blobs(r,[[0,0.55,0.8,0.35,0]],'#f8ece6',0.6);dots([[-0.3*r,-0.2*r,0.08*r],[0.25*r,-0.35*r,0.06*r],[0.1*r,0.0,0.05*r]],p.d,0.5);break;
 case 'europa':lines(r,[[-0.9,-0.3,0.8,0.2],[-0.6,0.6,0.7,-0.5],[-0.2,-0.9,0.3,0.9],[-0.9,0.2,0.4,0.7]],'#8a5a3a',0.045,0.65);break;

 const sx=player.shake>0?(Math.random()-0.5)*player.shake*24:0;
 cx.save();cx.translate(sx,0);drawBg();drawTrack();if(state!=='title')drawWorld();cx.restore();
 drawParts();if(state==='play'||state==='pause')drawHud();drawMsgs();
 if(state==='title')drawTitle();else if(state==='win')drawWin();else if(state==='fail')drawFail();else if(state==='pause')drawPause();}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();const x=e.clientX,y=e.clientY;
 for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}}
 if(state==='play'){dragging=true;player.tx=x;}});
cv.addEventListener('pointermove',e=>{if(dragging&&state==='play')player.tx=e.clientX;});
addEventListener('pointerup',()=>{dragging=false;});addEventListener('pointercancel',()=>{dragging=false;});
addEventListener('keydown',e=>{audioInit();if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;
 if((e.key===' '||e.key==='Enter')&&state!=='play'&&state!=='pause')startLevel();if(e.key==='p'&&state==='play')state='pause';});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause';});

let last=performance.now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
