<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<script src="../voice.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12234a">
<title>Planet Pinball</title>
<style>
:root{--bg:#070b2e;--accent:radial-gradient(circle at 35% 30%,#ffb35c,#7a3ae0);--accent-d:#7a3ae0}

@font-face{font-family:Fredoka;src:url(../fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff6e5;font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5;transition:opacity .2s}
.hud.off{opacity:0}
.hud .pill{display:flex;align-items:center;gap:8px;background:#0b123acc;border:2px solid #ffffff22;border-radius:999px;padding:6px 16px 6px 10px;font-size:24px;font-weight:700;box-shadow:0 6px 16px #0005;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud .pill i{font-style:normal;font-size:22px}
.hud .lives{font-size:24px;letter-spacing:2px}
.hud .sp{flex:1}
.hud button{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:2px solid #ffffff33;background:#0b123acc;color:#fff;font:700 18px Fredoka,sans-serif;box-shadow:0 6px 16px #0005;cursor:pointer}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:10;background:radial-gradient(circle at 50% 40%,#0000 0,#00000059 100%)}
.ov[hidden]{display:none}
.card{width:min(440px,100%);text-align:center;padding:26px 24px 24px;border-radius:34px;background:linear-gradient(180deg,#ffffffee,#f3eeffee);color:#1d1b3a;box-shadow:0 30px 70px #000a,inset 0 -6px 0 #0000000f;animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{transform:translateY(40px) scale(.9);opacity:0}}
.icon{width:132px;height:132px;margin:-90px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:72px;background:radial-gradient(circle at 35% 30%,#ffffff66,transparent 40%),var(--accent);box-shadow:0 0 0 7px #fff,0 0 0 13px var(--gold,#f2b33d),0 18px 30px #0006}
.card h1{margin:4px 0 6px;font-size:clamp(34px,8vw,46px);line-height:1;font-weight:700;letter-spacing:-.02em}
.card p{margin:0 auto 18px;font-size:19px;line-height:1.35;color:#4a4870;max-width:30ch}
.big{font-size:72px;font-weight:700;line-height:1;color:var(--accent-d);margin:6px 0 4px}
.tag{display:inline-block;background:var(--gold,#f2b33d);color:#2a1a00;border-radius:999px;padding:4px 14px;font-weight:700;font-size:17px;margin-bottom:10px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:999px;padding:16px;font:700 26px Fredoka,sans-serif;background:var(--gold,#f2b33d);color:#2a1a00;box-shadow:0 7px 0 #b7801d;cursor:pointer;margin-top:4px}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 #b7801d}
.go svg{width:30px;height:30px}
.row{display:flex;gap:10px;margin-top:14px}
.ghost{flex:1;border:2px solid #1d1b3a22;background:#fff;color:#1d1b3a;border-radius:999px;padding:11px;font:600 18px Fredoka,sans-serif;cursor:pointer}
.best{font-size:17px;color:#6b6990;margin-top:12px}
.hint{font-size:16px;color:#6b6990;margin:-6px 0 14px}
.float{position:fixed;pointer-events:none}
@media (prefers-reduced-motion:reduce){.card{animation:none}}


#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
canvas#c{z-index:1;background:transparent}
.hud{display:none!important}
.pick{margin:0 0 12px}
.pick h3{margin:0 0 6px;font-size:16px;color:#6b6990;font-weight:600}
.lvl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lb{width:44px;height:44px;border-radius:12px;border:2px solid #1d1b3a18;background:#fff;font:700 18px Fredoka,sans-serif;color:#1d1b3a;cursor:pointer}
.lb.on{background:#7a3ae0;color:#fff;border-color:#7a3ae0}
.lb.lock{opacity:.35}
.lvname{font-size:15px;color:#6b6990;margin-top:6px;text-align:center}
#title{overflow-y:auto;place-items:start center;padding-top:110px}
#title .card{margin:0 auto 30px}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud off" id="hud"><div class="pill"><i id="scoreIcon">⭐</i><span id="score">0</span></div><div class="lives" id="lives"></div><span class="sp"></span><button id="pauseBtn" aria-label="Pause">❚❚</button></div>
<div class="ov" id="title" hidden><div class="card"><div class="icon" id="tIcon"></div><h1 id="tTitle"></h1><p id="tSub"></p><div class="hint" id="tHint"></div><button class="go" id="play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2a1a00"/><path d="M10 7.5v9l7-4.5z" fill="#f2b33d"/></svg>Play</button><div class="best" id="tBest"></div><div class="row"><button class="ghost snd"></button></div></div></div>
<div class="ov" id="pause" hidden><div class="card"><h1>Paused</h1><p>Take a break. Your game is waiting.</p><button class="go" id="resume"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2a1a00"/><path d="M10 7.5v9l7-4.5z" fill="#f2b33d"/></svg>Keep playing</button><div class="row"><button class="ghost" id="restart">Start again</button><button class="ghost snd"></button></div></div></div>
<div class="ov" id="over" hidden><div class="card"><div class="tag" id="oTag">New best!</div><h1 id="oTitle"></h1><div class="big" id="oScore">0</div><div class="best" id="oUnit" style="margin-top:0">points</div><div class="best" id="oBest"></div><button class="go" id="again" style="margin-top:16px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2a1a00"/><path d="M10 7.5v9l7-4.5z" fill="#f2b33d"/></svg>Play again</button><div class="row"><button class="ghost" id="toTitle">Menu</button><button class="ghost snd"></button></div></div></div>

<canvas id="gl"></canvas>
<script src="lib/three.min.js"></script>

<script>
const GAME_KEY='planetpinball';

const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');let W=innerWidth,H=innerHeight,DPR=1;
const store={get(k,d){try{const v=localStorage.getItem('fun_'+GAME_KEY+'_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('fun_'+GAME_KEY+'_'+k,JSON.stringify(v));}catch(e){}}};
/* ---------- sound ---------- */
let AC=null,soundOn=store.get('sound',true),master=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=soundOn?1:0;master.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,vol,delay,slideTo){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.05);}
function noise(d,vol,freq,delay,type){if(!AC)return;const t=AC.currentTime+(delay||0),n=Math.max(1,Math.floor(AC.sampleRate*d)),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq||1000;const g=AC.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(master);s.start(t);}
const sfx={
 coin(){tone(988,0.08,'square',0.06);tone(1319,0.18,'square',0.06,0.07);},
 pop(){noise(0.08,0.25,1800);tone(500,0.08,'sine',0.12,0,1200);},
 jump(){tone(330,0.18,'square',0.06,0,700);},
 hit(){noise(0.25,0.35,400,0,'lowpass');tone(160,0.3,'sawtooth',0.08,0,60);},
 good(){[523,659,784].forEach((f,i)=>tone(f,0.16,'triangle',0.12,i*0.06));},
 win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.24,'triangle',0.13,i*0.1));},
 over(){[392,330,262,196].forEach((f,i)=>tone(f,0.3,'triangle',0.12,i*0.16));},
 whoosh(){noise(0.18,0.18,600,0,'bandpass');},
 tap(){tone(700,0.05,'sine',0.07);}};
function say(t){if(!soundOn)return;try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.92;u.pitch=1.1;const v=s.getVoices().find(x=>/en[-_]GB/i.test(x.lang));if(v)u.voice=v;s.speak(u);}catch(e){}}
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}}
function emoji(e,x,y,size,rot,alpha){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(alpha!==undefined)ctx.globalAlpha=alpha;ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,0,size*0.06);ctx.restore();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function text(t,x,y,size,col,align,stroke){ctx.font='700 '+size+'px Fredoka,"Arial Rounded MT Bold",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=size*0.18;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(t,x,y);}ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);}
/* ---------- particles, floating text, shake ---------- */
let parts=[],floats=[],shakeT=0,shakeM=0;
function burst(x,y,cols,n,spd,size,grav){for(let i=0;i<(n||14);i++){const a=Math.random()*Math.PI*2,s=rnd(0.3,1)*(spd||260);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(0.5,0.9),L:0.9,r:rnd(0.5,1)*(size||6),c:pick(cols),g:grav===undefined?500:grav,star:Math.random()<0.25});}}
function floatText(t,x,y,col,size){floats.push({t,x,y,c:col||'#fff',s:size||30,l:1});}
function shake(m,t){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t||0.3);}
function star(x,y,r,fill){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}}
function drawFx(dt){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=0.985;p.l-=dt;ctx.globalAlpha=clamp(p.l/p.L*1.4,0,1);if(p.star)star(p.x,p.y,p.r*1.4,p.c);else circ(p.x,p.y,p.r,p.c);});ctx.globalAlpha=1;parts=parts.filter(p=>p.l>0);
 floats.forEach(f=>{f.y-=60*dt;f.l-=dt*0.9;ctx.globalAlpha=clamp(f.l*1.5,0,1);text(f.t,f.x,f.y,f.s*(1+0.2*(1-f.l)),f.c,'center','#0008');});ctx.globalAlpha=1;floats=floats.filter(f=>f.l>0);}
/* ---------- game state ---------- */
let state='title',score=0,lives=0,best=store.get('best',0),T=0,last=0;
function setScore(v){score=Math.max(0,Math.round(v));$('score').textContent=score;}
function addScore(v,x,y,col){setScore(score+v);if(x!==undefined)floatText((v>0?'+':'')+v,x,y,col||'#ffd27a');}
function setLives(v){lives=v;$('lives').textContent=v>0?'❤️'.repeat(v):'';$('lives').hidden=!G.lives;}
function loseLife(x,y){if(!G.lives)return;setLives(lives-1);shake(14,0.35);sfx.hit();if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}if(lives<=0)setTimeout(()=>{if(state==='play')gameOver();},450);}
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';if(G.resize)G.resize();}
function show(id){['title','pause','over'].forEach(k=>$(k).hidden=k!==id);$('hud').classList.toggle('off',!(id===null||id==='pause'));}
function start(){audioInit();parts=[];floats=[];T=0;setScore(0);setLives(G.lives||0);G.init();state='play';show(null);sfx.tap();}
function gameOver(custom){if(state!=='play')return;state='over';const nb=score>best;if(nb){best=score;store.set('best',best);}
 $('oTitle').textContent=(custom&&custom.title)||(nb&&score>0?pick(['Amazing!','Superstar!','Wow!']):(score>0?pick(['Great game!','Brilliant!','So close!','Nice one!']):'Have another go!'));
 $('oTag').hidden=!(nb&&score>0);$('oScore').textContent=score;$('oUnit').textContent=G.unit||'points';$('oBest').textContent='Best: '+best+' '+(G.unit||'points');
 setTimeout(()=>{show('over');(nb&&score>0?sfx.win:sfx.over)();if(nb&&score>0)for(let i=0;i<4;i++)setTimeout(()=>burst(rnd(W*0.2,W*0.8),rnd(H*0.2,H*0.5),['#ffd27a','#ff6b9a','#7ad7ff','#9bff8a','#fff'],26,380,7,300),i*180);},custom&&custom.delay!==undefined?custom.delay:500);}
function pause(){if(state!=='play')return;state='pause';show('pause');}
function resume(){if(state!=='pause')return;state='play';show(null);last=performance.now();}
function frame(now){const dt=Math.min(0.034,(now-(last||now))/1000);last=now;
 if(state==='play'){T+=dt;G.update(dt);}else if(G.idle)G.idle(dt);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(shakeT>0){shakeT-=dt;const m=shakeM*clamp(shakeT/0.3,0,1);ctx.translate(rnd(-m,m),rnd(-m,m));}else shakeM=0;
 G.draw(ctx,dt);drawFx(dt);requestAnimationFrame(frame);}
function pos(e){return[e.clientX,e.clientY];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(state!=='play')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}if(G.down)G.down(...pos(e),e);});
cv.addEventListener('pointermove',e=>{if(state==='play'&&G.move)G.move(...pos(e),e);});
addEventListener('pointerup',e=>{if(state==='play'&&G.up)G.up(...pos(e),e);});
addEventListener('pointercancel',e=>{if(state==='play'&&G.up)G.up(...pos(e),e);});
addEventListener('keydown',e=>{if(e.repeat)return;if(state==='title'&&(e.key===' '||e.key==='Enter')){start();return;}if(e.key==='Escape'||e.key==='p'){state==='play'?pause():resume();return;}if(state==='play'&&G.key){G.key(e.key,true);e.preventDefault();}});
addEventListener('keyup',e=>{if(state==='play'&&G.key)G.key(e.key,false);});
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
function setSound(on){soundOn=on;store.set('sound',on);if(master)master.gain.value=on?1:0;document.querySelectorAll('.snd').forEach(b=>b.textContent=on?'🔊 Sound on':'🔇 Sound off');}
function boot(){document.title=G.title;$('tIcon').textContent=G.icon;$('tTitle').textContent=G.title;$('tSub').textContent=G.sub;$('tHint').textContent=G.hint||'';$('tBest').textContent=best?'Best: '+best+' '+(G.unit||'points'):'';$('scoreIcon').textContent=G.scoreIcon||'⭐';
 $('play').onclick=start;$('again').onclick=start;$('restart').onclick=()=>{state='over';start();};$('resume').onclick=resume;$('pauseBtn').onclick=pause;
 $('toTitle').onclick=()=>{$('tBest').textContent=best?'Best: '+best+' '+(G.unit||'points'):'';state='title';G.init();show('title');};
 document.querySelectorAll('.snd').forEach(b=>b.onclick=()=>{audioInit();setSound(!soundOn);});setSound(soundOn);
 if(G.noPause)$('pauseBtn').hidden=true;
 fit();G.init();show('title');requestAnimationFrame(frame);}



const G={title:'Planet Pinball',icon:'🪐',sub:'Flip the ball round the solar system! Hit every planet to light it up and finish the level.',hint:'Tap the left or right side of the screen to flip.',unit:'points',scoreIcon:'⭐',noPause:0};
/* ---------- planet pictures (shared with Space Studio 3D) ---------- */
let animOn=true,nowS=0,faceOpen=0;
const D2={ROCK:{}};const EXO={};
const STARC={sun:[['#fff6b0','#ffc531','#ff8a00'],'255,190,60'],sirius:[['#ffffff','#cfe2ff','#8fb4ff'],'170,200,255'],polaris:[['#fffbe8','#fff0b8','#e8c766'],'255,240,180'],
 betelgeuse:[['#ffd2a8','#ff6a3d','#b22a12'],'255,90,50'],rigel:[['#ffffff','#a9c8ff','#5b86ff'],'140,180,255'],vega:[['#ffffff','#d7e6ff','#9dbcff'],'190,215,255'],
 proxima:[['#ffb08a','#e2502e','#8f2414'],'255,90,50'],antares:[['#ffc39e','#ff4d2e','#a51e10'],'255,70,40'],aldebaran:[['#ffe2b8','#ff9a3d','#c25b12'],'255,150,60'],
 arcturus:[['#ffe8c6','#ffa94d','#cc6a1a'],'255,170,80'],wdgreen:[['#f4ffb8','#9be22a','#4f9a12'],'160,255,80']};
const MOOD={sirius:'grin',betelgeuse:'happy',proxima:'o',earth:'smile',moon:'happy',mars:'grin',jupiter:'grin'};
function hash(s){let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h;}
function seeded(s){return()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function blinkOf(t){return animOn&&((nowS+(hash(t)%97)*0.13)%3.7)<0.13;}
function face(c,r,t,ink){if(r<6)return;const m=MOOD[t]||['smile','grin','o','tongue','smile','happy','smile'][hash(t)%7];ink=ink||'#2a1630';
 const ey=-0.12*r,ex=0.3*r,er=0.15*r,lw=Math.max(1.2,0.055*r);c.save();c.lineCap='round';
 c.fillStyle='rgba(255,110,150,0.35)';[-1,1].forEach(s=>{c.beginPath();c.ellipse(s*0.52*r,0.12*r,0.12*r,0.08*r,0,0,7);c.fill();});
 const blink=blinkOf(t);
 [-1,1].forEach(s=>{const x=s*ex;
  if(blink){c.strokeStyle=ink;c.lineWidth=lw;c.beginPath();c.moveTo(x-er*0.8,ey+er*0.2);c.lineTo(x+er*0.8,ey+er*0.2);c.stroke();return;}
  if(m==='happy'||(m==='wink'&&s===1)){c.strokeStyle=ink;c.lineWidth=lw;c.beginPath();c.arc(x,ey+er*0.45,er*0.75,Math.PI*1.15,Math.PI*1.85);c.stroke();return;}
  c.fillStyle='#fff';c.beginPath();c.ellipse(x,ey,er,er*1.18,0,0,7);c.fill();c.strokeStyle='rgba(0,0,0,0.3)';c.lineWidth=Math.max(0.8,r*0.02);c.stroke();
  c.fillStyle='#1d1430';c.beginPath();c.arc(x+er*0.15,ey+er*0.2,er*0.6,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x+er*0.35,ey-er*0.05,er*0.22,0,7);c.fill();});
 const my=0.2*r,mr=0.2*r;c.strokeStyle=ink;c.lineWidth=lw;

  for(const S of SEGS){if(collide(S.ax,S.ay,S.bx,S.by,0.09,S.kick?0.4:0.45,S.kick)&&S.kick){tone(520,0.08,'square',0.06);hitFx.push({x:ball.x,y:ball.y,t:0.25});}}
  if(ball.inLane&&ball.y>12.4)ball.inLane=false;
  if(!ball.inLane&&ball.x>LANE&&ball.y<12.0+BR&&ball.y>11.4&&ball.vy<0){ball.y=12.0+BR;ball.vy=-ball.vy*0.4;}
  ['l','r'].forEach(k=>{const F=FL[k],ex=F.px+Math.cos(fa[k])*FLEN,ey=F.py+Math.sin(fa[k])*FLEN;
   const dx=ex-F.px,dy=ey-F.py,l2=dx*dx+dy*dy;let t=((ball.x-F.px)*dx+(ball.y-F.py)*dy)/l2;t=t<0?0:t>1?1:t;const cx=F.px+dx*t,cy=F.py+dy*t,w=fw[k];
   collide(F.px,F.py,ex,ey,FRAD*(1-0.35*t),0.25,0,-w*(cy-F.py),w*(cx-F.px));});
  BUMP.forEach(b=>{if(collide(b.x,b.y,b.x,b.y,b.r,0.5,b.kick)){onBump(b);}});
  const sp=Math.hypot(ball.vx,ball.vy);if(sp>26){ball.vx*=26/sp;ball.vy*=26/sp;}
  if(ball.y<-1){drain();break;}}
 if(phase==='play'){if(Math.hypot(ball.vx,ball.vy)<0.4&&ball.y>3.3&&!(ball.x>LANE&&ball.y<1.5)){stillT+=dt;if(stillT>2.5){ball.vy+=5;ball.vx+=(Math.random()-0.5)*4;stillT=0;}}else stillT=0;}}
function onBump(b){b.pulse=0.25;hitFx.push({x:b.x,y:b.y,t:0.3});
 if(b.id==='post'){tone(300,0.06,'sine',0.05);return;}
 if(b.id==='sun'){addScore(10);tone(330+Math.random()*80,0.12,'triangle',0.1);return;}
 if(b.target){if(!lit[b.id]){lit[b.id]=1;addScore(100);sfx.good();say(NAMES[b.id]+', '+FACT[b.id]);const [sx,sy]=scr(b.x,1,b.y);floatText(NAMES[b.id]+'!',sx,sy,'#ffd27a',34);burst(sx,sy,['#ffd27a','#7ad7ff','#fff'],16,260,5,0);checkClear();}else{addScore(10);tone(600+Math.random()*200,0.1,'triangle',0.09);}return;}
 addScore(5);tone(220,0.08,'square',0.05);}
function addScore(n){setScore(score+n);}
function checkClear(){const L=LEVELS[level-1];if(L.t.every(id=>lit[id])){phase='clear';clearT=2.6;addScore(500);sfx.win();say('Level complete! You lit up '+L.name.toLowerCase()+'!');
  for(let i=0;i<4;i++)setTimeout(()=>burst(rnd(W*0.2,W*0.8),rnd(H*0.2,H*0.5),['#ffd27a','#ff6b9a','#7ad7ff','#9bff8a','#fff'],26,380,7,300),i*180);
  if(level>=maxLevel&&level<LEVELS.length){maxLevel=level+1;store.set('maxlvl',maxLevel);}}}
function drain(){if(performance.now()/1000-launchT<12){saveMsgT=2;say('Ball saved! Try again');}else{balls--;sfx.hit();
  if(balls<=0){phase='over';say('Great flipping! You scored '+score);setTimeout(()=>gameOver({title:'Great flipping!',delay:0}),900);return;}say(balls===1?'Last ball!':balls+' balls left');}
 resetBall();}
function resetBall(){ball={x:4.5,y:0.7,vx:0,vy:0,inLane:true};phase='ready';}
function launch(){if(phase!=='ready')return;phase='play';ball.vx=-0.2;ball.vy=20.5+Math.random()*1.5;ball.inLane=true;launchT=performance.now()/1000;tone(200,0.25,'sawtooth',0.07,0,700);}
/* ---------- 3D ---------- */
let renderer=null,scene,camera,sphereGeo,boxGeo,objs={},ballMesh,flipMesh={},bumpMesh=[];
function initGL(){if(renderer||!window.THREE)return;try{renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,400);sphereGeo=new THREE.SphereGeometry(1,40,28);boxGeo=new THREE.BoxGeometry(1,1,1);resizeGL();}catch(e){renderer=null;}}
function resizeGL(){if(!renderer)return;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();placeCam();}
function placeCam(){if(!camera)return;const a=camera.aspect;const dist=a<0.8?25:a<1.2?22:18;camera.position.set(CX,dist*0.86,dist*0.33+1);camera.lookAt(CX,0,-9.3);}
function W3(x,y,h){return new THREE.Vector3(x,h||0,-y);}
function scr(x,h,y){const v=W3(x,y,h).project(camera);return [(v.x+1)/2*W,(1-v.y)/2*H];}
function glowTex(rgb){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba('+rgb+',0.9)');g.addColorStop(0.35,'rgba('+rgb+',0.45)');g.addColorStop(1,'rgba('+rgb+',0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
function tableTex(){const c=document.createElement('canvas');c.width=512;c.height=1024;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,1024);g.addColorStop(0,'#1a1060');g.addColorStop(0.6,'#0d1a4a');g.addColorStop(1,'#08102e');x.fillStyle=g;x.fillRect(0,0,512,1024);
 const R=seeded(77);for(let i=0;i<260;i++){x.fillStyle='rgba(255,255,255,'+(0.3+R()*0.6)+')';x.beginPath();x.arc(R()*512,R()*1024,R()*1.8+0.3,0,7);x.fill();}
 const tx=v=>(v+5)/10*512,ty=v=>1024-v/19*1024;x.strokeStyle='rgba(160,180,255,0.35)';x.lineWidth=2;[1.6,2.7,3.6,4.4].forEach(r=>{x.beginPath();x.ellipse(tx(CX),ty(SUNY),r/10*512,r/19*1024,0,0,7);x.stroke();});
 x.font='700 44px Fredoka, sans-serif';x.textAlign='center';x.fillStyle='rgba(255,215,120,0.85)';x.fillText('PLANET PINBALL',tx(CX),ty(5.6));
 x.fillStyle='rgba(120,200,255,0.5)';x.font='700 28px Fredoka, sans-serif';x.fillText('▲',tx(4.5),ty(2.2));x.fillText('▲',tx(4.5),ty(3.4));return new THREE.CanvasTexture(c);}
function makeFaceSprite(id){const fc=document.createElement('canvas');fc.width=fc.height=160;const ft=new THREE.CanvasTexture(fc);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:ft,transparent:true,depthWrite:false}));s.renderOrder=2;s.userData={fc,ft,key:''};return s;}
function drawFace(s,id,open){const key=(blinkOf(id)?'b':'o')+Math.round(open*10);if(key===s.userData.key)return;s.userData.key=key;const c=s.userData.fc.getContext('2d');c.clearRect(0,0,160,160);c.save();c.translate(80,80);faceOpen=open;face(c,64,id,STARC[id]?'#5a2a10':undefined);faceOpen=0;c.restore();s.userData.ft.needsUpdate=true;}
function buildScene(){initGL();if(!renderer)return false;while(scene.children.length)scene.remove(scene.children[0]);
 scene.background=new THREE.Color(0x050a24);scene.add(new THREE.AmbientLight(0xffffff,0.6));const dl=new THREE.DirectionalLight(0xffffff,0.75);dl.position.set(-4,14,6);scene.add(dl);
 const N=900,pos=new Float32Array(N*3),R=seeded(9);for(let i=0;i<N;i++){const u=R()*2-1,a=R()*Math.PI*2,s=Math.sqrt(1-u*u),d=140;pos[i*3]=Math.cos(a)*s*d;pos[i*3+1]=Math.abs(u)*d*0.8-20;pos[i*3+2]=Math.sin(a)*s*d;}
 const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.9})));
 const tb=new THREE.Mesh(new THREE.BoxGeometry(10,0.4,19),new THREE.MeshLambertMaterial({map:tableTex()}));tb.position.set(0,-0.2,-9.5);scene.add(tb);
 const rim=new THREE.Mesh(new THREE.BoxGeometry(10.6,0.6,19.6),new THREE.MeshLambertMaterial({color:0x2a1a6a}));rim.position.set(0,-0.45,-9.5);scene.add(rim);
 SEGS.forEach(S=>{const l=Math.hypot(S.bx-S.ax,S.by-S.ay);const m=new THREE.Mesh(boxGeo,new THREE.MeshLambertMaterial({color:S.col,emissive:S.kick?0x552200:0x1a1040}));m.scale.set(l+0.12,0.55,0.18);m.position.copy(W3((S.ax+S.bx)/2,(S.ay+S.by)/2,0.27));m.rotation.y=Math.atan2(S.by-S.ay,S.bx-S.ax);scene.add(m);});
 ['l','r'].forEach(k=>{const g=new THREE.Group();const m=new THREE.Mesh(boxGeo,new THREE.MeshLambertMaterial({color:0xffcf3a,emissive:0x553300}));m.scale.set(FLEN,0.38,0.36);m.position.set(FLEN/2,0.22,0);g.add(m);const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.42,20),new THREE.MeshLambertMaterial({color:0xff9f3a}));cap.position.set(0,0.22,0);g.add(cap);g.position.copy(W3(FL[k].px,FL[k].py,0));scene.add(g);flipMesh[k]=g;});
 ballMesh=new THREE.Mesh(sphereGeo,new THREE.MeshPhongMaterial({color:0xdfe6f2,specular:0xffffff,shininess:90}));ballMesh.scale.set(BR,BR,BR);scene.add(ballMesh);
 buildBumperMeshes();return true;}
function buildBumperMeshes(){bumpMesh.forEach(o=>o.forEach(m=>scene.remove(m)));bumpMesh=[];
 BUMP.forEach(b=>{const parts=[];let m;
  if(b.id==='post'){m=new THREE.Mesh(new THREE.CylinderGeometry(b.r,b.r,0.6,20),new THREE.MeshLambertMaterial({color:0x9b6bff}));m.position.copy(W3(b.x,b.y,0.3));}
  else if(b.id==='rock'){m=new THREE.Mesh(new THREE.DodecahedronGeometry(1,0),new THREE.MeshLambertMaterial({color:0x8a7d70}));m.scale.set(b.r,b.r*0.8,b.r);m.position.copy(W3(b.x,b.y,b.r*0.8));}
  else if(b.id==='comet'){m=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:0xbfe9ff}));m.scale.set(b.r,b.r,b.r);const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex('150,220,255'),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));gl.scale.set(2.2,2.2,1);m.add(gl);gl.scale.set(2.6,2.6,1);gl.position.set(0,0,0);}
  else{const tex=new THREE.CanvasTexture(texCanvas(b.id));const star=!!STARC[b.id];m=new THREE.Mesh(sphereGeo,star?new THREE.MeshBasicMaterial({map:tex}):new THREE.MeshLambertMaterial({map:tex}));m.scale.set(b.r,b.r,b.r);m.position.copy(W3(b.x,b.y,b.r));
   if(star){const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(STARC[b.id][1]),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));gl.scale.set(3.4,3.4,1);m.add(gl);}
   if(b.id==='saturn'){const rg=new THREE.Mesh(new THREE.RingGeometry(1.35,2.1,48),new THREE.MeshBasicMaterial({color:0xd9b45a,side:THREE.DoubleSide,transparent:true,opacity:0.85}));rg.rotation.x=-Math.PI/2+0.35;m.add(rg);}
   const fs=makeFaceSprite(b.id);scene.add(fs);parts.push(fs);b.fs=fs;
   if(b.target){const ring=new THREE.Mesh(new THREE.TorusGeometry(b.r+0.16,0.06,8,40),new THREE.MeshBasicMaterial({color:0x5a5a7a}));ring.rotation.x=Math.PI/2;ring.position.copy(W3(b.x,b.y,0.05));scene.add(ring);parts.push(ring);b.ring=ring;}}
  scene.add(m);parts.unshift(m);b.mesh=m;bumpMesh.push(parts);});}
function render3(dt){if(!renderer)return;const t=performance.now()/1000;nowS=t;
 ballMesh.position.copy(W3(ball.x,ball.y,BR));ballMesh.rotation.x-=ball.vy*dt/BR;ballMesh.rotation.z-=ball.vx*dt/BR;
 ['l','r'].forEach(k=>{flipMesh[k].rotation.y=fa[k];});
 BUMP.forEach(b=>{if(!b.mesh)return;const p=b.pulse>0?1+b.pulse*0.8:1;if(b.pulse>0)b.pulse-=dt;const base=b.id==='post'?1:b.r;
  if(b.id!=='post')b.mesh.scale.set(base*p,(b.id==='rock'?base*0.8:base)*p,base*p);if(b.move)b.mesh.position.copy(W3(b.x,b.y,b.r));
  if(b.mesh&&b.id!=='post'&&b.id!=='rock')b.mesh.rotation.y+=dt*0.6;
  if(b.ring){const on=lit[b.id];b.ring.material.color.setHex(on?0xffd23a:0x5a5a7a);}
  if(b.fs){const toCam=camera.position.clone().sub(b.mesh.position).normalize();b.fs.position.copy(b.mesh.position).addScaledVector(toCam,b.r*p*1.6);b.fs.scale.set(b.r*p*2.3,b.r*p*2.3,1);drawFace(b.fs,b.id,b.pulse>0?0.8:0);}});
 renderer.render(scene,camera);}
/* ---------- HUD ---------- */
const ICON={};function iconOf(id){if(ICON[id])return ICON[id];const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const src=texCanvas(id);x.save();x.beginPath();x.arc(32,32,28,0,7);x.clip();x.drawImage(src,0,0,256,256,4,4,56,56);x.restore();ICON[id]=c;return c;}
function drawHUD(){ctx.clearRect(0,0,W,H);if(state!=='play')return;const L=LEVELS[level-1];
 rr(12,14,46,46,23);ctx.fillStyle='#0b123acc';ctx.fill();text('❚❚',35,37,18,'#fff');
 const nar=W<640;rr(68,14,nar?120:240,46,23);ctx.fillStyle='#0b123acc';ctx.fill();text(nar?'Level '+level:'Level '+level+': '+L.name,68+(nar?60:120),37,nar?20:19,'#fff');
 rr(W-150,14,138,46,23);ctx.fillStyle='#0b123acc';ctx.fill();text('⭐ '+score,W-81,37,22,'#fff');
 for(let i=0;i<3;i++){circ(W-135+i*22,76,8,i<balls?'#dfe6f2':'#ffffff33');}
 const n=L.t.length,s=nar?30:38,x0=W/2-n*(s+6)/2,y0=nar?92:22;L.t.forEach((id,i)=>{ctx.globalAlpha=lit[id]?1:0.35;ctx.drawImage(iconOf(id),x0+i*(s+6),y0,s,s);ctx.globalAlpha=1;if(lit[id])text('✓',x0+i*(s+6)+s-4,y0+6,14,'#9bff8a');});
 if(phase==='ready'){const [sx,sy]=scr(4.5,0,2.6);text('Tap to launch!',Math.min(W-90,sx-40),sy-30,Math.min(W,H)*0.045,'#ffd27a','center','#000a');}
 if(saveMsgT>0)text('Ball saved!',W/2,H*0.42,Math.min(W,H)*0.07,'#9bff8a','center','#000a');
 if(phase==='clear')text('Level complete!',W/2,H*0.4,Math.min(W,H)*0.08,'#ffd27a','center','#000a');}
/* ---------- hooks ---------- */
G.init=()=>{initGL();buildPicker();if(renderer&&!scene.children.length){buildTable();buildBumpers();buildScene();}};
G.resize=()=>resizeGL();
const _start=start;start=function(){buildTable();buildBumpers();if(!buildScene())return;_start();balls=3;resetBall();lit={};say('Level '+level+', '+LEVELS[level-1].name+'. Hit every planet to light it up!');};
G.update=dt=>{physics(dt);if(saveMsgT>0)saveMsgT-=dt;
 if(phase==='clear'){clearT-=dt;if(clearT<=0){if(level<LEVELS.length){level++;store.set('lvl',level);buildBumpers();buildBumperMeshes();resetBall();say('Level '+level+', '+LEVELS[level-1].name);}else{phase='over';gameOver({title:'You finished the solar system!',delay:300});}}}};
G.idle=dt=>{if(!renderer)return;if(!SEGS.length){buildTable();buildBumpers();buildScene();}stepFlippers(dt);};
G.draw=(c,dt)=>{render3(dt||0.016);drawHUD();hitFx=hitFx.filter(f=>(f.t-=0.016)>0);};
G.down=(x,y,e)=>{if(x<64&&y<70){pause();return;}const id=e&&e.pointerId!==undefined?e.pointerId:0;if(phase==='ready'){launch();ptrSide[id]=null;return;}const side=x<W/2?'l':'r';ptrSide[id]=side;flip[side]=true;tone(side==='l'?240:260,0.05,'square',0.04);};
G.up=(x,y,e)=>{const id=e&&e.pointerId!==undefined?e.pointerId:0;const side=ptrSide[id];if(side)flip[side]=false;delete ptrSide[id];if(!Object.keys(ptrSide).length){flip.l=false;flip.r=false;}};
G.key=(k,down)=>{if(k==='ArrowLeft'||k==='z'||k==='Z')flip.l=down;if(k==='ArrowRight'||k==='m'||k==='M'||k==='/')flip.r=down;if((k===' '||k==='ArrowDown'||k==='Enter')&&down)launch();};
function buildPicker(){if($('picker'))return renderPicker();const box=document.createElement('div');box.id='picker';box.innerHTML='<div class="pick"><h3>Pick a level</h3><div class="lvl" id="lvls"></div><div class="lvname" id="lvname"></div></div>';
 const play=$('play');play.parentNode.insertBefore(box,play);
 $('lvls').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;const n=+b.dataset.l;if(n>maxLevel){say('Finish level '+maxLevel+' first');return;}level=n;store.set('lvl',level);renderPicker();say('Level '+n+', '+LEVELS[n-1].name);};renderPicker();}
function renderPicker(){$('lvls').innerHTML=LEVELS.map((L,i)=>{const n=i+1;return '<button class="lb'+(n===level?' on':'')+(n>maxLevel?' lock':'')+'" data-l="'+n+'">'+(n>maxLevel?'🔒':n)+'</button>';}).join('');$('lvname').textContent=LEVELS[level-1].name;}

boot();
</script>
