<!DOCTYPE html>

<head>

<style>
@font-face{font-family:Fredoka;src:url(../fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#fde7f0;color:#1d1b3a;font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
.pill{display:flex;align-items:center;gap:8px;background:#ffffffd9;border:2px solid #ffffff;border-radius:999px;padding:6px 18px 6px 12px;font-size:26px;font-weight:700;box-shadow:0 6px 16px #0002;color:#5b2373}
.sp{flex:1}
.hud button{pointer-events:auto;width:52px;height:52px;border-radius:50%;border:2px solid #fff;background:#ffffffd9;font-size:24px;box-shadow:0 6px 16px #0002;cursor:pointer}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:auto;max-width:100%}
.panel{background:#ffffffcc;border:2px solid #fff;border-radius:28px;padding:10px 12px;box-shadow:0 10px 30px #0002;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cols{display:flex;gap:9px;overflow-x:auto;padding:6px 4px;max-width:calc(100vw - 30px);scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:56px;height:56px;border-radius:14px;border:none;cursor:pointer;position:relative;box-shadow:inset -5px -6px 0 #0000002e,inset 4px 4px 0 #ffffff55,0 4px 8px #0003;transition:transform .15s}
.sw.on{transform:translateY(-6px) scale(1.08);outline:4px solid #5b2373;outline-offset:3px}
.tb{border:none;border-radius:20px;background:#fff;color:#3a2a55;font:700 19px Fredoka,sans-serif;padding:10px 16px;min-height:58px;display:flex;align-items:center;gap:8px;box-shadow:0 5px 0 #d8c6ea,0 8px 16px #0002;cursor:pointer}
.tb:active{transform:translateY(3px);box-shadow:0 2px 0 #d8c6ea}
.tb i{font-style:normal;font-size:26px}
.tb canvas{width:44px;height:44px}
.make{border:none;border-radius:26px;padding:12px 26px;min-height:70px;font:700 26px Fredoka,sans-serif;color:#fff;background:linear-gradient(180deg,#ff7ab8,#e2317f);box-shadow:0 7px 0 #a01e58,0 12px 24px #e2317f66;cursor:pointer;animation:glow 1.6s ease-in-out infinite}
.make:active{transform:translateY(4px);box-shadow:0 3px 0 #a01e58}
.make.off{filter:grayscale(.7) opacity(.7);animation:none}
@keyframes glow{50%{transform:scale(1.05)}}
.pulse{animation:pulse 1s ease-in-out infinite;background:#fff4b0}
@keyframes pulse{50%{transform:scale(1.12)}}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#5b2373;color:#fff;padding:10px 22px;border-radius:999px;font-size:22px;font-weight:700;z-index:8;box-shadow:0 8px 20px #0003;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:10;background:#3a1a4a55}
.card{width:min(460px,100%);text-align:center;padding:26px 24px 24px;border-radius:34px;background:linear-gradient(180deg,#fff,#f6edff);box-shadow:0 30px 70px #0006;animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{transform:translateY(40px) scale(.9);opacity:0}}
.icon{width:132px;height:132px;margin:-90px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:70px;background:conic-gradient(#e63946,#ff8a1f,#ffd23f,#1fa95b,#2f6fe0,#8e4bd6,#e63946);box-shadow:0 0 0 7px #fff,0 0 0 13px #f2b33d,0 18px 30px #0005}
.card h1{margin:4px 0 6px;font-size:44px;line-height:1}

.btn{display:block;width:100%;border:none;border-radius:22px;padding:16px;margin-top:12px;font:700 26px Fredoka,sans-serif;color:#fff;background:linear-gradient(180deg,#ff7ab8,#e2317f);box-shadow:0 6px 0 #a01e58;cursor:pointer}
.btn.b2{background:linear-gradient(180deg,#8f6bff,#5b3fd6);box-shadow:0 6px 0 #3a2596}
.btn.b3{background:#fff;color:#5b2373;box-shadow:0 5px 0 #d8c6ea;font-size:20px;padding:12px}
.sheet{position:fixed;inset:0;z-index:12;background:#3a1a4a66;display:flex;align-items:flex-end;justify-content:center}
.sheetin{width:min(760px,100%);max-height:86vh;overflow-y:auto;background:#fff;border-radius:30px 30px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #0004;animation:up .3s ease-out both}
@keyframes up{from{transform:translateY(100%)}}
.sheetin h2{margin:4px 6px 10px;font-size:26px;color:#5b2373;display:flex;align-items:center}
.sheetin h2 .x{margin-left:auto;border:none;background:#f0e6fa;border-radius:50%;width:48px;height:48px;font-size:24px;cursor:pointer}
.sheetin h3{margin:12px 6px 6px;font-size:20px;color:#8a6aa8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.sh{border:3px solid #eee3f7;background:#fbf8ff;border-radius:20px;padding:8px 4px 6px;font:700 17px Fredoka,sans-serif;color:#3a2a55;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.sh canvas{width:76px;height:76px}
.sh.on{border-color:#e2317f;background:#fff0f7}
</style>

<canvas id="c"></canvas>
<div class="hud" id="hud"><div class="pill" id="count">🧊 0</div><div class="sp"></div><button id="sndBtn" aria-label="Sound">🔊</button></div>

 <button class="btn" id="startBtn">▶ Start</button>

</div></div>

<script src="lib/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('pm_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('pm_'+k,JSON.stringify(v));}catch(e){}}};
const D=Math.PI/180,rand=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=k=>1-(1-k)*(1-k),easeIn=k=>k*k,back=k=>{const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};

/* ---------- colours ---------- */
const COLS=[['Red','#e63946'],['Orange','#ff8a1f'],['Yellow','#ffd23f'],['Lime','#9bd43a'],['Green','#1fa95b'],['Turquoise','#21c7c2'],['Blue','#2f6fe0'],['Purple','#8e4bd6'],['Pink','#ff6fb5'],['Brown','#9a5b30'],['White','#f5f5f7'],['Black','#2a2a33']];

/* ---------- sound (no talking in this game) ---------- */
let AC=null,master=null,NB=null,soundOn=store.get('sound',true);
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=soundOn?1:0;master.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
 if(AC&&AC.state==='suspended')AC.resume();}
function env(g,t,a,d,v){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function osc(type,f1,f2,dur,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,.004,dur,vol);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq,q,delay){if(!AC||!NB)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;env(g,t,.003,dur,vol);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
let lastPew=0;
const S={
 place(){osc('triangle',280+rand()*80,170,.08,.28);noise(.03,.18,1400,1);},
 pop(){osc('sine',650+rand()*350,130,.07,.55);noise(.035,.4,2600+rand()*800,1.3);},
 pew(){const n=performance.now();if(n-lastPew<35)return;lastPew=n;osc('square',380+rand()*240,1500,.08,.05);},
 suck(){osc('sine',900+rand()*200,1800,.05,.06);},
 boom(){osc('sine',170,45,.4,.7);noise(.3,.35,700,.7);},
 rise(){osc('sine',500+rand()*300,900,.05,.12);},
 whoosh(){noise(.35,.28,500,.5);},
 thud(){osc('sine',130,55,.18,.5);noise(.06,.2,400,1);},
 tada(){[523,659,784,1047].forEach((f,i)=>osc('triangle',f,0,.22,.25,i*.1));},
 click(){osc('sine',800,600,.04,.12);},
 poof(){noise(.12,.2,1800,.8);}
};
function setSound(on){soundOn=on;store.set('sound',on);if(master)master.gain.value=on?1:0;$('sndBtn').textContent=on?'🔊':'🔇';$('sndCard').textContent=on?'🔊 Sound on':'🔇 Sound off';}

/* ---------- 2D shape maths (signed distance, inside is negative) ---------- */
const len=Math.hypot;
function sCirc(x,y,cx,cy,r){return len(x-cx,y-cy)-r;}
function sBox(x,y,cx,cy,hx,hy,rr){rr=rr||0;const dx=Math.abs(x-cx)-hx+rr,dy=Math.abs(y-cy)-hy+rr;return len(Math.max(dx,0),Math.max(dy,0))+Math.min(Math.max(dx,dy),0)-rr;}
function sEll(x,y,cx,cy,rx,ry,rot){let px=x-cx,py=y-cy;if(rot){const c=Math.cos(rot),s=Math.sin(rot),qx=px*c+py*s,qy=-px*s+py*c;px=qx;py=qy;}return (len(px/rx,py/ry)-1)*Math.min(rx,ry);}
function sCap(x,y,ax,ay,bx,by,r){const px=x-ax,py=y-ay,ex=bx-ax,ey=by-ay,t=clamp((px*ex+py*ey)/(ex*ex+ey*ey),0,1);return len(px-ex*t,py-ey*t)-r;}
function sPoly(x,y,v){let d=(x-v[0][0])**2+(y-v[0][1])**2,s=1;for(let i=0,j=v.length-1;i<v.length;j=i,i++){const ex=v[j][0]-v[i][0],ey=v[j][1]-v[i][1],wx=x-v[i][0],wy=y-v[i][1];const t=clamp((wx*ex+wy*ey)/(ex*ex+ey*ey),0,1);const bx=wx-ex*t,by=wy-ey*t;d=Math.min(d,bx*bx+by*by);const c1=y>=v[i][1],c2=y<v[j][1],c3=ex*wy>ey*wx;if((c1&&c2&&c3)||(!c1&&!c2&&!c3))s=-s;}return s*Math.sqrt(d);}
function smin(a,b,k){const h=clamp(.5+.5*(b-a)/k,0,1);return b*(1-h)+a*h-k*h*(1-h);}
const SU=(k,...a)=>a.reduce((p,c)=>smin(p,c,k));
const mir=pts=>pts.map(p=>[-p[0],p[1]]);
const HEART=[];for(let i=0;i<120;i++){const t=i/120*Math.PI*2,s=Math.sin(t);HEART.push([16*s*s*s/17,(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)+2.5)/17]);}
const STAR=[];for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,r=i%2?.42:.92;STAR.push([Math.cos(a)*r,Math.sin(a)*r]);}
const TRI=[0,1,2].map(i=>{const a=Math.PI/2+i*2*Math.PI/3;return [Math.cos(a)*.88,Math.sin(a)*.88];});
const HEX=[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3;return [Math.cos(a)*.9,Math.sin(a)*.9];});
const FINL=[[-.3,-.15],[-.72,-.75],[-.7,-.94],[-.25,-.62]],FINR=mir(FINL);
const EARL=[[-.62,.12],[-.6,.88],[-.12,.45]],EARR=mir(EARL);

const SHAPES=[
 {id:'circle',g:0,name:'Circle',f:(x,y)=>len(x,y)-.95},
 {id:'square',g:0,name:'Square',f:(x,y)=>sBox(x,y,0,0,.86,.86,.2)},
 {id:'rectangle',g:0,name:'Rectangle',f:(x,y)=>sBox(x,y,0,0,.96,.62,.12)},
 {id:'heart',g:0,name:'Heart',f:(x,y)=>sPoly(x,y,HEART)},
 {id:'star',g:0,name:'Star',f:(x,y)=>sPoly(x,y,STAR)-.07},
 {id:'triangle',g:0,name:'Triangle',f:(x,y)=>sPoly(x,y,TRI)-.12},
 {id:'hexagon',g:0,name:'Hexagon',f:(x,y)=>sPoly(x,y,HEX)-.06},
 {id:'rocket',g:1,name:'Rocket',f:(x,y)=>SU(.06,sEll(x,y,0,.1,.36,.86),sPoly(x,y,FINL),sPoly(x,y,FINR),sBox(x,y,0,-.8,.19,.11,.04))},
 {id:'planet',g:1,name:'Planet',f:(x,y)=>Math.min(sCirc(x,y,0,0,.62),sEll(x,y,0,0,1.02,.2,-.35))},
 {id:'moon',g:1,name:'Moon',f:(x,y)=>Math.max(sCirc(x,y,0,0,.92),-sCirc(x,y,.45,.22,.72))},
 {id:'alien',g:1,name:'Alien',f:(x,y)=>SU(.05,sEll(x,y,0,-.05,.62,.74),sCap(x,y,-.22,.55,-.5,.98,.06),sCap(x,y,.22,.55,.5,.98,.06),sCirc(x,y,-.52,1.0,.14),sCirc(x,y,.52,1.0,.14))},
 {id:'ufo',g:1,name:'UFO',f:(x,y)=>SU(.05,sEll(x,y,0,.14,.45,.5),sEll(x,y,0,-.1,1.0,.3),sEll(x,y,0,-.38,.42,.13))},
 {id:'dinosaur',g:2,name:'Dinosaur',f:(x,y)=>SU(.06,sEll(x,y,-.05,-.08,.64,.44),sCap(x,y,.35,.1,.6,.5,.17),sEll(x,y,.74,.6,.28,.18),sPoly(x,y,[[-.5,.18],[-1.08,.32],[-.58,-.3]]),sBox(x,y,-.3,-.55,.13,.2,.06),sBox(x,y,.22,-.55,.13,.2,.06),sPoly(x,y,[[-.5,.22],[-.38,.54],[-.24,.28]]),sPoly(x,y,[[-.22,.3],[-.06,.62],[.08,.32]]),sPoly(x,y,[[.08,.28],[.24,.56],[.34,.22]]))},
 {id:'fish',g:2,name:'Fish',f:(x,y)=>SU(.05,sEll(x,y,-.15,0,.62,.42),sPoly(x,y,[[.35,0],[.95,.52],[.82,0],[.95,-.52]]),sPoly(x,y,[[-.35,.35],[.05,.64],[.2,.3]]))},
 {id:'cat',g:2,name:'Cat',f:(x,y)=>SU(.06,sEll(x,y,0,-.1,.7,.6),sPoly(x,y,EARL),sPoly(x,y,EARR))},
 {id:'car',g:2,name:'Car',f:(x,y)=>SU(.04,sBox(x,y,0,-.12,.95,.28,.14),sBox(x,y,-.05,.28,.52,.26,.16),sCirc(x,y,-.55,-.42,.25),sCirc(x,y,.55,-.42,.25))},
 {id:'train',g:2,name:'Train',f:(x,y)=>SU(.04,sBox(x,y,.1,-.08,.62,.3,.1),sBox(x,y,-.55,.12,.32,.5,.06),sBox(x,y,.45,.36,.1,.2,.03),sCirc(x,y,.05,.25,.13),sCirc(x,y,-.55,-.48,.2),sCirc(x,y,-.05,-.48,.17),sCirc(x,y,.42,-.48,.17),sPoly(x,y,[[.72,-.36],[.98,-.6],[.72,-.6]]))}
];
const SH=Object.fromEntries(SHAPES.map(s=>[s.id,s]));
const GROUPS=['Shapes','Space','Animals and vehicles'];

/* marching squares: outline of the inside (f<0) as one loop */
function contour(f,N,E){N=N||150;E=E||1.25;const st=2*E/N,W=N+1,V=new Float32Array(W*W);
 for(let j=0;j<=N;j++)for(let i=0;i<=N;i++)V[j*W+i]=f(-E+i*st,-E+j*st);
 const HO=W*N,adj=new Map(),pts=new Map();
 const h=(i,j)=>j*N+i,v=(i,j)=>HO+j*W+i;
 function P(id){if(pts.has(id))return pts.get(id);let x,y;if(id<HO){const j=Math.floor(id/N),i=id%N,a=V[j*W+i],b=V[j*W+i+1],t=a/(a-b);x=-E+(i+t)*st;y=-E+j*st;}else{const k=id-HO,j=Math.floor(k/W),i=k%W,a=V[j*W+i],b=V[(j+1)*W+i],t=a/(a-b);x=-E+i*st;y=-E+(j+t)*st;}const p=[x,y];pts.set(id,p);return p;}
 function L(a,b){(adj.get(a)||adj.set(a,[]).get(a)).push(b);(adj.get(b)||adj.set(b,[]).get(b)).push(a);}
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=V[j*W+i],b=V[j*W+i+1],c=V[(j+1)*W+i+1],d=V[(j+1)*W+i];
  const code=(a<0?1:0)|(b<0?2:0)|(c<0?4:0)|(d<0?8:0);if(code===0||code===15)continue;
  const e=[h(i,j),v(i+1,j),h(i,j+1),v(i,j)];const m=(a+b+c+d)/4<0;
  const T={1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:m?[[0,1],[2,3]]:[[3,0],[1,2]],6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[0,2]],10:m?[[3,0],[1,2]]:[[0,1],[2,3]],11:[[1,2]],12:[[1,3]],13:[[0,1]],14:[[3,0]]}[code];
  T.forEach(s=>L(e[s[0]],e[s[1]]));}
 const seen=new Set();let best=null,bestA=0;
 adj.forEach((_,start)=>{if(seen.has(start))return;const loop=[];let cur=start,prev=-1,guard=0;
  while(guard++<200000){seen.add(cur);loop.push(P(cur));const nb=adj.get(cur);const nx=nb[0]!==prev?nb[0]:nb[1];if(nx===undefined||nx===start)break;prev=cur;cur=nx;}
  let A=0;for(let k=0;k<loop.length;k++){const p=loop[k],q=loop[(k+1)%loop.length];A+=p[0]*q[1]-q[0]*p[1];}
  if(Math.abs(A)>bestA){bestA=Math.abs(A);best=loop;}});
 const out=[];best.forEach(p=>{const l=out[out.length-1];if(!l||len(p[0]-l[0],p[1]-l[1])>.012)out.push(p);});return out;}

/* popper layout for a shape: outline in world units plus bubble spots on a honeycomb */
const LAY={};
function layoutFor(id){if(LAY[id])return LAY[id];const sh=SH[id],loopN=contour(sh.f);
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;loopN.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);});
 const Sc=7/Math.max(x1-x0,y1-y0),cx=(x0+x1)/2,cy=(y0+y1)/2;
 const loop=loopN.map(p=>[(p[0]-cx)*Sc,(p[1]-cy)*Sc]);const sdf=(x,y)=>sh.f(x/Sc+cx,y/Sc+cy)*Sc;

 if(pop.bubbles.every(x=>x.popped)){setTimeout(()=>{if(stage!=='play')return;S.tada();const cs=[...new Set(pop.bubbles.map(x=>COLS[x.ci][1]))];
  for(let i=0;i<45;i++){const p=new THREE.Vector3((rand()-.5)*7,5+rand()*3,(rand()-.5)*6);spray(p,cs[i%cs.length],1,.4,true);}$('flipBtn').classList.add('pulse');},250);}}
function flip(){audioInit();if(flipping||stage!=='play'||!pop)return;flipping=true;$('flipBtn').classList.remove('pulse');S.whoosh();const bd=pop.body,hx=pop.L.rad;
 anim(.32,k=>{const a=Math.PI/2*easeIn(k);bd.rotation.z=a;bd.position.y=.26+(hx*.75+.3)*Math.sin(a);bd.scale.setScalar(1-.25*Math.sin(a));},()=>{
  pop.bubbles.forEach(b=>{b.popped=!b.popped;b.m.scale.y=b.popped?-BK:BK;b.m.material=bubbleMat(b.ci,b.popped);});
  anim(.32,k=>{const a=-Math.PI/2*(1-easeOut(k));bd.rotation.z=a;bd.position.y=.26+(hx*.75+.3)*Math.abs(Math.sin(a));bd.scale.setScalar(1-.25*Math.abs(Math.sin(a)));},()=>{
   bd.rotation.z=0;bd.position.y=.26;bd.scale.setScalar(1);S.thud();flipping=false;anim(.2,k=>{const s=Math.sin(k*Math.PI)*.06;bd.scale.set(1+s,1-s*2,1+s);});});});}
function changeShape(id){shapeId=id;store.set('shape',id);drawShapeBtns();if(stage==='play'&&pop){const old=pop;S.poof();
 anim(.22,k=>{old.g.scale.setScalar(Math.max(.001,1-k));},()=>{disposePopper(old);pop=buildPopper(id,old.seq,patIx,old.layout);pop.layout=old.layout;scene.add(pop.g);pop.g.scale.setScalar(.01);playView(.5);
  anim(.4,k=>{pop.g.scale.setScalar(Math.max(.01,back(k)));},()=>{S.thud();});save();});}}
function backToBuild(){audioInit();if(stage!=='play'||flipping)return;stage='build';const old=pop;
 anim(.3,k=>{old.g.scale.setScalar(Math.max(.001,1-k));},()=>{old.g.visible=false;});
 plate.visible=true;anim(.35,k=>{const s=Math.max(.01,back(k));plate.scale.set(s,s,s);});
 const lay=(old&&old.layout)||[];lay.forEach((l,i)=>addCube(l[0],CELLS[l[1]],.3+i*Math.min(.025,1.2/Math.max(1,lay.length)),i%4!==0));
 showTray('build');setCount();setView(new THREE.Vector3(0,.7,0),5.4,52*D,.7);}

/* ---------- pointer ---------- */
const down=new Set();
function playPick(e){if(!pop)return;const h=pick(e,pop.bubbles.map(b=>b.m));if(h&&h.object.userData.bub)popB(h.object.userData.bub);}
canvas.addEventListener('pointerdown',e=>{audioInit();down.add(e.pointerId);try{canvas.setPointerCapture(e.pointerId);}catch(_){}if(stage==='build')buildTap(e);else if(stage==='play')playPick(e);});
canvas.addEventListener('pointermove',e=>{if(down.has(e.pointerId)&&stage==='play')playPick(e);});
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,e=>down.delete(e.pointerId)));

/* ---------- buttons ---------- */
function drawThumb(cv,id,on){const g=cv.getContext('2d'),W=cv.width,L=layoutFor(id),s=W/9.4;g.clearRect(0,0,W,W);g.save();g.translate(W/2,W/2);g.scale(s,-s);
 g.beginPath();L.loop.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();const gr=g.createLinearGradient(0,4,0,-4);gr.addColorStop(0,on?'#ff7ab8':'#b58cf0');gr.addColorStop(1,on?'#e2317f':'#7c55d6');g.fillStyle=gr;g.fill();
 g.fillStyle='#ffffffcc';L.bubbles.forEach(b=>{g.beginPath();g.arc(b.x,b.y,L.r*.8,0,Math.PI*2);g.fill();});g.restore();}
function drawShapeBtns(){[$('shapeBtn'),$('shape2Btn')].forEach(b=>drawThumb(b.querySelector('canvas'),shapeId,true));}
function buildCols(){$('cols').innerHTML=COLS.map((c,i)=>`<button class="sw${i===sel?' on':''}" data-i="${i}" aria-label="${c[0]}" style="background:${c[1]}"></button>`).join('');
 $('cols').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{audioInit();sel=+b.dataset.i;store.set('col',sel);$('cols').querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));S.click();});}
function openSheet(){audioInit();S.click();let h='';GROUPS.forEach((gn,gi)=>{h+=`<h3>${gn}</h3><div class="grid">`+SHAPES.filter(s=>s.g===gi).map(s=>`<button class="sh${s.id===shapeId?' on':''}" data-s="${s.id}"><canvas width="152" height="152"></canvas>${s.name}</button>`).join('')+'</div>';});
 $('sheetBody').innerHTML=h;$('sheetBody').querySelectorAll('.sh').forEach(b=>{drawThumb(b.querySelector('canvas'),b.dataset.s,b.dataset.s===shapeId);b.onclick=()=>{$('sheet').hidden=true;S.click();if(b.dataset.s!==shapeId)changeShape(b.dataset.s);};});$('sheet').hidden=false;}
$('sheetX').onclick=()=>{$('sheet').hidden=true;};$('sheet').addEventListener('pointerdown',e=>{if(e.target===$('sheet'))$('sheet').hidden=true;});
$('shapeBtn').onclick=openSheet;$('shape2Btn').onclick=openSheet;
$('handBtn').onclick=()=>{audioInit();if(stage==='build')handful();};
$('undoBtn').onclick=()=>{audioInit();if(stage==='build')undo();};
$('clearBtn').onclick=()=>{audioInit();if(stage==='build')clearAll();};
$('makeBtn').onclick=make;
$('flipBtn').onclick=flip;
$('patBtn').onclick=()=>{audioInit();if(stage!=='play')return;S.click();patIx=(patIx+1)%PATS.length;store.set('pat',patIx);$('patName').textContent=PATS[patIx];recolour();};
$('backBtn').onclick=backToBuild;
$('sndBtn').onclick=()=>{audioInit();setSound(!soundOn);};$('sndCard').onclick=()=>{audioInit();setSound(!soundOn);};
$('patName').textContent=PATS[patIx];
const last=store.get('last',null);if(last&&last.layout&&last.layout.length)$('lastBtn').hidden=false;
$('startBtn').onclick=()=>{audioInit();S.click();$('title').hidden=true;stage='build';showTray('build');setCount();setView(new THREE.Vector3(0,.7,0),5.4,52*D,0);applyCam();};
$('lastBtn').onclick=()=>{audioInit();$('title').hidden=true;const l=store.get('last',null);if(l.shape&&SH[l.shape]){shapeId=l.shape;drawShapeBtns();}patIx=l.pat||0;$('patName').textContent=PATS[patIx];
 const lay=l.layout.filter(x=>CELLS[x[1]]&&COLS[x[0]]);plate.visible=false;pop=buildPopper(shapeId,lay.map(x=>x[0]),patIx,lay);pop.layout=lay;scene.add(pop.g);S.boom();reveal(new THREE.Vector3(0,4.4,0));};

/* ---------- loop ---------- */
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
 for(let i=anims.length-1;i>=0;i--){const a=anims[i];a.t+=dt;if(a.t<0)continue;if(!a.st){a.st=true;if(a.start)a.start();}const k=Math.min(1,a.t/a.d);a.fn(k);if(k>=1){anims.splice(i,1);if(a.done)a.done();}}
 if(orbit.length){const V=swirl.position;orbit.forEach(c=>{c.orb.a+=c.orb.sp*orbitSpeed*dt;const r=c.orb.r*orbitShrink;c.m.position.set(V.x+Math.cos(c.orb.a)*r,V.y+c.orb.y*orbitShrink,V.z+Math.sin(c.orb.a)*r);c.m.rotation.x+=dt*4;c.m.rotation.y+=dt*3;});}
 if(swirl.visible)swirl.rotation.z+=dt*4;
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.vy-=(p.spin?2:12)*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;if(p.spin){p.m.rotation.x+=p.spin*dt;p.m.rotation.z+=p.spin*.7*dt;}
  const f=p.t/p.life;p.m.material.opacity=1-f;if(p.m.position.y<.03){p.m.position.y=.03;p.vy=0;p.vx*=.8;p.vz*=.8;}if(f>=1){scene.remove(p.m);p.m.material.dispose();parts.splice(i,1);}}
 if(vK<1){vK=Math.min(1,vK+dt/vDur);const e=easeOut(vK)*(2-easeOut(vK))*.5+easeOut(vK)*.5;cur.c.lerpVectors(vFrom.c,vTo.c,e);cur.r=vFrom.r+(vTo.r-vFrom.r)*e;cur.el=vFrom.el+(vTo.el-vFrom.el)*e;}
 applyCam();R.render(scene,cam);requestAnimationFrame(frame);}
buildCols();drawShapeBtns();setSound(soundOn);resize();setCount();
requestAnimationFrame(frame);
window.__pm={cam,get stage(){return stage;},get pop(){return pop;},get cubes(){return cubes;},make,flip,changeShape,backToBuild,addCube,CELLS,SHAPES,layoutFor,popB};
})();
</script>
