<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../voice.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dexter's Vehicle Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFCF5; --ink:#232538; --card:#FFFFFF;
    --coral:#FF6B5B; --marigold:#FFB627; --teal:#2EC4B6; --violet:#7B61FF; --grass:#43B75D; --pink:#FF8FB1;
    --muted:#6B6D82;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
  }
  :root:not([data-theme="light"]){ --bg:var(--cream); --fg:var(--ink); --card-bg:var(--card); --card-border:var(--ink); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1B1C2B; --fg:#FDF9EE; --card-bg:#262840; --card-border:#FDF9EE; }
  }
  :root[data-theme="dark"]{ --bg:#1B1C2B; --fg:#FDF9EE; --card-bg:#262840; --card-border:#FDF9EE; }
  html,body{height:100%;} *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:'Baloo 2', ui-rounded, 'Segoe UI', sans-serif; min-height:100%; display:flex; justify-content:center; overflow-x:hidden; }
  #app{ width:100%; max-width:520px; padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:18px; scroll-padding-top:env(safe-area-inset-top,0px); }

  .pill-btn{ font-family:inherit; font-weight:700; font-size:1rem; color:var(--ink); border:3px solid var(--card-border); border-radius:999px; padding:12px 20px; cursor:pointer; background:var(--card-bg); box-shadow:5px 5px 0 var(--card-border); transition:transform .08s ease, box-shadow .08s ease; }
  .pill-btn:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--card-border); }
  .icon-btn{ width:44px; height:44px; border-radius:50%; border:3px solid var(--card-border); background:var(--card-bg); font-size:1.2rem; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:3px 3px 0 var(--card-border); transition:transform .08s ease, box-shadow .08s ease; }
  .icon-btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--card-border); }
  h1,h2,h3{ margin:0; }

  .menu-hero{ position:relative; height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:-6px; }
  .menu-hero .drift{ position:absolute; animation:drift 5.5s ease-in-out infinite; opacity:.95; }
  .menu-hero svg{ display:block; }
  .drift.d1{ top:0; left:4%; width:58px; animation-delay:.2s; }
  .drift.d2{ top:10px; right:6%; width:52px; animation-delay:1.1s; }
  .drift.d3{ bottom:-4px; left:22%; width:46px; animation-delay:.6s; }
  .drift.d4{ bottom:4px; right:22%; width:50px; animation-delay:1.6s; }
  @keyframes drift{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-10px) rotate(5deg); } }
  .title-wrap{ text-align:center; }
  .title-wrap h1{ font-size:2rem; font-weight:800; line-height:1.05; }
  .title-wrap p{ margin:6px 0 0; color:var(--muted); font-weight:600; font-size:.95rem; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px; }
  @media (max-width:380px){ .mode-grid{ grid-template-columns:1fr; } }
  .mode-card{ border:3px solid var(--card-border); border-radius:22px; background:var(--card-bg); box-shadow:6px 6px 0 var(--card-border); padding:18px 14px; text-align:left; cursor:pointer; font-family:inherit; color:var(--fg); display:flex; flex-direction:column; gap:6px; transition:transform .08s ease, box-shadow .08s ease; }
  .mode-card:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--card-border); }
  .mode-card .emoji{ font-size:1.9rem; }
  .mode-card .label{ font-weight:800; font-size:1.05rem; }
  .mode-card .sub{ font-weight:600; font-size:.82rem; color:var(--muted); }
  .mode-card.mixed{ grid-column:1 / -1; flex-direction:row; align-items:center; gap:14px; }
  .mode-card.mixed .txt{ display:flex; flex-direction:column; gap:2px; }

  .best-row{ display:flex; justify-content:center; gap:14px; font-weight:700; font-size:.78rem; color:var(--muted); flex-wrap:wrap; margin-top:2px; }
  .best-row span b{ color:var(--fg); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stat{ font-weight:800; font-size:.95rem; display:flex; align-items:center; gap:6px; background:var(--card-bg); border:3px solid var(--card-border); border-radius:999px; padding:6px 14px; box-shadow:3px 3px 0 var(--card-border); }
  .progress-dots{ display:flex; gap:5px; justify-content:center; flex-wrap:wrap; }
  .progress-dots span{ width:10px; height:10px; border-radius:50%; background:var(--card-border); opacity:.25; }
  .progress-dots span.done{ opacity:1; background:var(--grass); }
  .progress-dots span.current{ opacity:1; background:var(--marigold); transform:scale(1.3); }

  .shape-card{ position:relative; align-self:center; width:min(80vw,260px); height:min(80vw,260px); background:var(--card-bg); border:4px solid var(--card-border); border-radius:28px; box-shadow:7px 7px 0 var(--card-border); transform:rotate(-1.5deg); display:flex; align-items:center; justify-content:center; margin:4px 0; }
  .shape-card svg{ width:84%; height:84%; animation:popin .32s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popin{ 0%{ transform:scale(.55); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .shape-card.wrong-shake{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{ transform:rotate(-1.5deg) translateX(0); } 25%{ transform:rotate(-1.5deg) translateX(-8px); } 75%{ transform:rotate(-1.5deg) translateX(8px); } }

  .prompt{ text-align:center; font-weight:800; font-size:1.15rem; margin-top:2px; }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
  .opt-btn{ font-family:inherit; font-weight:700; font-size:1.02rem; color:var(--ink); border:3px solid var(--ink); border-radius:18px; padding:16px 8px; cursor:pointer; box-shadow:5px 5px 0 var(--ink); min-height:64px; display:flex; align-items:center; justify-content:center; text-align:center; transition:transform .08s ease, box-shadow .08s ease; }
  .opt-btn:active:not(.locked){ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--ink); }
  .opt-btn.c0{ background:var(--coral); } .opt-btn.c1{ background:var(--teal); } .opt-btn.c2{ background:var(--marigold); } .opt-btn.c3{ background:var(--violet); color:#fff; }
  .opt-btn.correct{ background:var(--grass); color:#fff; outline:4px solid var(--ink); }
  .opt-btn.incorrect{ background:#E24C4C; color:#fff; }
  .opt-btn.dim{ opacity:.45; }

  .next-wrap{ display:flex; justify-content:center; margin-top:4px; min-height:52px; }
  .next-btn{ background:var(--fg); color:var(--bg); font-weight:800; font-size:1rem; border:3px solid var(--card-border); border-radius:999px; padding:12px 26px; cursor:pointer; box-shadow:5px 5px 0 var(--card-border); animation:popin .25s ease; }
  .next-btn:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--card-border); }

  .burst{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .burst span{ position:absolute; left:50%; top:50%; font-size:1.4rem; animation:fly .8s ease-out forwards; }
  @keyframes fly{ 0%{ transform:translate(-50%,-50%) scale(.6); opacity:1; } 100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity:0; } }

  .result-card{ text-align:center; background:var(--card-bg); border:4px solid var(--card-border); border-radius:26px; box-shadow:7px 7px 0 var(--card-border); padding:30px 20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .stars{ font-size:2.2rem; letter-spacing:4px; }
  .score-big{ font-size:2.6rem; font-weight:800; }
  .result-msg{ font-weight:700; color:var(--muted); }
  .result-actions{ display:flex; gap:12px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ================= helpers ================= */
  function hexToRgb(h){ h=h.replace('#',''); return {r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16)}; }
  function shade(hex, amt){
    const {r,g,b} = hexToRgb(hex);
    const f = (c)=> Math.max(0, Math.min(255, Math.round(amt>0 ? c+(255-c)*amt : c+c*amt)));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function pick(arr,n){ return shuffle(arr).slice(0,n); }
  function safeGet(key){ try{ return localStorage.getItem(key); } catch(e){ return null; } }
  function safeSet(key,val){ try{ localStorage.setItem(key,val); } catch(e){} }

  /* ================= vehicle data ================= */
  const CATEGORIES = ['Land','Rail','Water','Air','Space'];

  const VEHICLES = [
    {id:'car', name:'Car', wheels:4, type:'Land', color:'#FF6B5B'},
    {id:'policeCar', name:'Police car', wheels:4, type:'Land', color:'#F5F5F0'},
    {id:'taxi', name:'Taxi', wheels:4, type:'Land', color:'#FFD23F'},
    {id:'ambulance', name:'Ambulance', wheels:4, type:'Land', color:'#F5F5F0'},
    {id:'fireEngine', name:'Fire engine', wheels:6, type:'Land', color:'#E63946'},
    {id:'bus', name:'Bus', wheels:6, type:'Land', color:'#FFB627'},
    {id:'motorbike', name:'Motorbike', wheels:2, type:'Land', color:'#232538'},
    {id:'bicycle', name:'Bicycle', wheels:2, type:'Land', color:'#2EC4B6'},
    {id:'scooter', name:'Scooter', wheels:2, type:'Land', color:'#7B61FF'},
    {id:'tricycle', name:'Tricycle', wheels:3, type:'Land', color:'#FF8FB1'},
    {id:'tuktuk', name:'Tuk-tuk', wheels:3, type:'Land', color:'#FFB627'},
    {id:'wheelbarrow', name:'Wheelbarrow', wheels:1, type:'Land', color:'#9CA3AF'},
    {id:'unicycle', name:'Unicycle', wheels:1, type:'Land', color:'#E63946'},
    {id:'skateboard', name:'Skateboard', wheels:4, type:'Land', color:'#43B75D'},
    {id:'tractor', name:'Tractor', wheels:4, type:'Land', color:'#43B75D'},
    {id:'monsterTruck', name:'Monster truck', wheels:4, type:'Land', color:'#7B61FF'},
    {id:'raceCar', name:'Race car', wheels:4, type:'Land', color:'#E63946'},
    {id:'dumpTruck', name:'Dump truck', wheels:6, type:'Land', color:'#FFB627'},
    {id:'digger', name:'Digger', wheels:0, type:'Land', color:'#FFB627'},
    {id:'bulldozer', name:'Bulldozer', wheels:0, type:'Land', color:'#FF9F45'},
    {id:'train', name:'Train', wheels:null, type:'Rail', color:'#5B8AA6'},
    {id:'tram', name:'Tram', wheels:null, type:'Rail', color:'#2EC4B6'},
    {id:'sailboat', name:'Sailboat', wheels:0, type:'Water', color:'#F5F5F0'},
    {id:'speedboat', name:'Speedboat', wheels:0, type:'Water', color:'#FF6B5B'},
    {id:'submarine', name:'Submarine', wheels:0, type:'Water', color:'#43708A'},
    {id:'cruiseShip', name:'Cruise ship', wheels:0, type:'Water', color:'#F5F5F0'},
    {id:'jetski', name:'Jet ski', wheels:0, type:'Water', color:'#FFB627'},
    {id:'airplane', name:'Airplane', wheels:null, type:'Air', color:'#9CA3AF'},
    {id:'helicopter', name:'Helicopter', wheels:null, type:'Air', color:'#FF6B5B'},
    {id:'hotAirBalloon', name:'Hot air balloon', wheels:0, type:'Air', color:'#FF8FB1'},
    {id:'rocket', name:'Rocket', wheels:0, type:'Space', color:'#F5F5F0'},
    {id:'spaceShuttle', name:'Space shuttle', wheels:null, type:'Space', color:'#F5F5F0'}
  ];

  /* ================= svg rendering ================= */
  function wheel(cx,cy,r){ r=r||24; return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#232538"/><circle cx="${cx}" cy="${cy}" r="${r*0.42}" fill="#B8BCC8"/>`; }
  function dualWheel(cx,cy,r){ r=r||18; return `${wheel(cx-10,cy,r)}${wheel(cx+10,cy,r)}`; }
  function track(x,y,w,h,color){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="#232538"/><rect x="${x+6}" y="${y+h*0.26}" width="${w-12}" height="${h*0.48}" rx="${h*0.2}" fill="${color}"/>`; }
  function waterLine(y){ return `<path d="M14 ${y} q20 -10 40 0 q20 10 40 0 q20 -10 40 0 q20 10 40 0 q20 -10 40 0 q20 10 40 0 q20 -10 26 0" stroke="#5B9DC7" stroke-width="6" fill="none" stroke-linecap="round"/>`; }
  function windowsRow(x,y,w,h,n,gap,color){
    color = color || '#BEE3F8';
    const each = (w-(n-1)*gap)/n; let out='';
    for(let i=0;i<n;i++) out += `<rect x="${x+i*(each+gap)}" y="${y}" width="${each}" height="${h}" rx="4" fill="${color}"/>`;
    return out;
  }

  function vehicleSvgInner(v){
    const c = v.color, dark = shade(c,-.3), light = shade(c,.35), darker = shade(c,-.5);
    switch(v.id){
      case 'car': return `
        <rect x="34" y="140" width="172" height="42" rx="16" fill="${c}"/>
        <path d="M62 140 q10 -40 40 -40 h36 q30 0 40 40 z" fill="${c}"/>
        ${windowsRow(78,110,84,26,2,6)}
        ${wheel(84,188)}${wheel(160,188)}`;
      case 'policeCar': return `
        <rect x="34" y="140" width="172" height="42" rx="16" fill="${c}"/>
        <path d="M62 140 q10 -40 40 -40 h36 q30 0 40 40 z" fill="${shade(c,-.05)}"/>
        ${windowsRow(78,110,84,26,2,6)}
        <rect x="98" y="122" width="44" height="12" rx="3" fill="#232538"/>
        <rect x="98" y="122" width="20" height="12" rx="3" fill="#4C6FFF"/>
        <rect x="122" y="122" width="20" height="12" rx="3" fill="#E63946"/>
        <rect x="60" y="150" width="120" height="10" fill="#4C6FFF"/>
        ${wheel(84,188)}${wheel(160,188)}`;
      case 'taxi': return `
        <rect x="34" y="140" width="172" height="42" rx="16" fill="${c}"/>
        <path d="M62 140 q10 -40 40 -40 h36 q30 0 40 40 z" fill="${c}"/>
        ${windowsRow(78,110,84,26,2,6)}
        <rect x="60" y="152" width="16" height="16" fill="#232538"/><rect x="88" y="152" width="16" height="16" fill="#232538"/>
        <rect x="116" y="152" width="16" height="16" fill="#232538"/><rect x="144" y="152" width="16" height="16" fill="#232538"/>
        <rect x="104" y="96" width="32" height="14" rx="4" fill="#232538"/>
        ${wheel(84,188)}${wheel(160,188)}`;
      case 'ambulance': return `
        <rect x="46" y="104" width="150" height="80" rx="14" fill="${c}"/>
        <rect x="46" y="104" width="60" height="80" rx="14" fill="#DCE3EA"/>
        ${windowsRow(60,116,32,22,1,0)}
        <rect x="140" y="126" width="10" height="36" fill="#E63946"/>
        <rect x="126" y="140" width="38" height="10" fill="#E63946"/>
        <rect x="46" y="98" width="40" height="8" fill="#4C6FFF"/>
        ${wheel(90,188)}${wheel(168,188)}`;
      case 'fireEngine': return `
        <rect x="30" y="118" width="180" height="66" rx="10" fill="${c}"/>
        <rect x="34" y="88" width="60" height="34" rx="8" fill="${c}"/>
        ${windowsRow(44,96,40,18,1,0)}
        <line x1="100" y1="100" x2="200" y2="100" stroke="${light}" stroke-width="4"/>
        ${[110,130,150,170,190].map(x=>`<line x1="${x}" y1="94" x2="${x}" y2="106" stroke="${light}" stroke-width="3"/>`).join('')}
        <rect x="60" y="96" width="26" height="8" fill="#FFD23F"/>
        ${dualWheel(70,190,15)}${dualWheel(168,190,15)}`;
      case 'bus': return `
        <rect x="28" y="96" width="184" height="86" rx="14" fill="${c}"/>
        ${windowsRow(42,110,156,26,5,6)}
        <rect x="42" y="150" width="156" height="10" rx="3" fill="${dark}"/>
        ${dualWheel(70,190,15)}${dualWheel(168,190,15)}`;
      case 'motorbike': return `
        <line x1="70" y1="182" x2="150" y2="182" stroke="${c}" stroke-width="6"/>
        <line x1="90" y1="182" x2="120" y2="130" stroke="${c}" stroke-width="8" stroke-linecap="round"/>
        <line x1="120" y1="130" x2="150" y2="150" stroke="${c}" stroke-width="8" stroke-linecap="round"/>
        <line x1="120" y1="130" x2="112" y2="116" stroke="${dark}" stroke-width="6" stroke-linecap="round"/>
        <line x1="102" y1="112" x2="122" y2="112" stroke="${dark}" stroke-width="6" stroke-linecap="round"/>
        <rect x="112" y="142" width="30" height="10" rx="4" fill="${dark}"/>
        ${wheel(76,192,28)}${wheel(154,192,28)}`;
      case 'bicycle': return `
        <circle cx="76" cy="188" r="30" fill="none" stroke="${c}" stroke-width="7"/>
        <circle cx="164" cy="188" r="30" fill="none" stroke="${c}" stroke-width="7"/>
        <line x1="76" y1="188" x2="120" y2="140" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
        <line x1="120" y1="140" x2="164" y2="188" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
        <line x1="120" y1="140" x2="96" y2="188" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
        <line x1="120" y1="140" x2="126" y2="120" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
        <line x1="112" y1="118" x2="132" y2="118" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
        <line x1="96" y1="188" x2="112" y2="176" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`;
      case 'scooter': return `
        <line x1="60" y1="196" x2="150" y2="196" stroke="${c}" stroke-width="8" stroke-linecap="round"/>
        <line x1="70" y1="196" x2="70" y2="90" stroke="${c}" stroke-width="7" stroke-linecap="round"/>
        <line x1="52" y1="92" x2="88" y2="92" stroke="${c}" stroke-width="7" stroke-linecap="round"/>
        ${wheel(66,206,18)}${wheel(150,206,18)}`;
      case 'tricycle': return `
        <line x1="112" y1="150" x2="112" y2="180" stroke="${c}" stroke-width="6"/>
        <line x1="70" y1="180" x2="154" y2="180" stroke="${c}" stroke-width="6"/>
        <line x1="112" y1="150" x2="150" y2="110" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
        <line x1="138" y1="108" x2="162" y2="108" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
        <rect x="98" y="140" width="26" height="16" rx="6" fill="${dark}"/>
        ${wheel(70,196,22)}${wheel(154,196,22)}${wheel(150,124,16)}`;
      case 'tuktuk': return `
        <path d="M64 178 v-46 q0 -18 24 -18 h40 q22 0 22 18 v46 z" fill="${c}"/>
        ${windowsRow(76,130,60,26,2,6)}
        <rect x="64" y="120" width="86" height="10" rx="4" fill="${dark}"/>
        ${wheel(84,192,20)}${wheel(148,192,20)}${wheel(70,178,14)}`;
      case 'wheelbarrow': return `
        <polygon points="90,150 190,150 178,192 102,192" fill="${c}"/>
        <line x1="90" y1="150" x2="40" y2="182" stroke="${dark}" stroke-width="7" stroke-linecap="round"/>
        <line x1="102" y1="192" x2="40" y2="196" stroke="${dark}" stroke-width="7" stroke-linecap="round"/>
        <line x1="40" y1="182" x2="40" y2="196" stroke="${dark}" stroke-width="7" stroke-linecap="round"/>
        ${wheel(150,206,20)}`;
      case 'unicycle': return `
        <line x1="120" y1="150" x2="120" y2="188" stroke="${c}" stroke-width="7"/>
        <rect x="98" y="134" width="44" height="16" rx="8" fill="${dark}"/>
        <line x1="104" y1="176" x2="136" y2="176" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
        ${wheel(120,196,32)}`;
      case 'skateboard': return `
        <rect x="46" y="150" width="148" height="20" rx="10" fill="${c}"/>
        ${wheel(66,178,14)}${wheel(94,178,14)}${wheel(146,178,14)}${wheel(174,178,14)}`;
      case 'tractor': return `
        <rect x="120" y="128" width="60" height="44" rx="8" fill="${c}"/>
        ${windowsRow(130,136,34,20,1,0)}
        <polygon points="60,170 120,170 120,150 90,150 70,170" fill="${dark}"/>
        <rect x="52" y="160" width="38" height="14" fill="${c}"/>
        ${wheel(70,196,22)}${wheel(158,196,34)}`;
      case 'monsterTruck': return `
        <rect x="60" y="132" width="120" height="34" rx="10" fill="${c}"/>
        <path d="M78 132 q6 -26 30 -26 h24 q24 0 30 26 z" fill="${c}"/>
        ${windowsRow(90,116,60,18,2,6)}
        ${wheel(80,196,38)}${wheel(160,196,38)}`;
      case 'raceCar': return `
        <path d="M40 172 q0 -14 20 -14 h140 q20 0 20 14 v6 h-180 z" fill="${c}"/>
        <path d="M96 158 q6 -26 24 -26 h0 q18 0 24 26 z" fill="${light}"/>
        <rect x="150" y="140" width="14" height="34" fill="${dark}"/>
        <circle cx="120" cy="150" r="12" fill="#FFFCF5"/>
        <text x="120" y="155" font-size="14" text-anchor="middle" fill="${dark}" font-weight="800">7</text>
        ${wheel(74,186,24)}${wheel(166,186,24)}`;
      case 'dumpTruck': return `
        <rect x="34" y="94" width="72" height="86" rx="8" fill="${dark}"/>

      case 'digger': return `
        ${track(46,182,148,26,'#9CA3AF')}
        <rect x="86" y="122" width="68" height="46" rx="8" fill="${c}"/>

        <line x1="150" y1="140" x2="196" y2="108" stroke="${dark}" stroke-width="10" stroke-linecap="round"/>
        <line x1="196" y1="108" x2="178" y2="86" stroke="${dark}" stroke-width="9" stroke-linecap="round"/>
        <polygon points="178,86 196,84 190,102 172,100" fill="${darker}"/>`;
      case 'bulldozer': return `
        ${track(44,182,150,26,'#9CA3AF')}
        <rect x="96" y="128" width="60" height="40" rx="8" fill="${c}"/>
        ${windowsRow(104,136,26,20,1,0)}
        <line x1="96" y1="150" x2="60" y2="150" stroke="${dark}" stroke-width="6"/>
        <rect x="34" y="132" width="14" height="52" rx="4" fill="${darker}"/>`;
      case 'train': return `
        <rect x="46" y="112" width="150" height="60" rx="10" fill="${c}"/>
        <path d="M46 112 q0 -20 22 -20 h20 v20 z" fill="${c}"/>

        <rect x="30" y="80" width="14" height="30" rx="4" fill="${dark}"/>
        ${windowsRow(96,124,88,22,3,6)}

      case 'tram': return `
        <rect x="40" y="112" width="164" height="58" rx="12" fill="${c}"/>
        ${windowsRow(52,122,140,22,4,6)}
        <line x1="120" y1="112" x2="120" y2="70" stroke="${dark}" stroke-width="4"/>
        <path d="M108 70 h24" stroke="${dark}" stroke-width="4"/>
        ${[64,96,150,182].map(x=>`<circle cx="${x}" cy="182" r="9" fill="#232538"/>`).join('')}`;
      case 'sailboat': return `
        ${waterLine(196)}
        <polygon points="70,190 190,190 160,206 100,206" fill="${dark}"/>
        <line x1="130" y1="190" x2="130" y2="70" stroke="${darker}" stroke-width="5"/>
        <polygon points="132,74 132,186 176,186" fill="${c}"/>
        <polygon points="128,110 128,186 98,186" fill="${light}"/>`;
      case 'speedboat': return `
        ${waterLine(196)}
        <path d="M50 182 q0 -16 20 -16 h108 q26 0 30 20 z" fill="${c}"/>
        <rect x="120" y="140" width="44" height="26" rx="8" fill="${light}"/>
        ${windowsRow(128,146,28,14,2,4)}
        <path d="M40 190 q-10 6 -18 4 M46 196 q-12 6 -20 2" stroke="#BEE3F8" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      case 'submarine': return `
        ${waterLine(200)}
        <ellipse cx="120" cy="176" rx="88" ry="30" fill="${c}"/>
        <rect x="108" y="132" width="18" height="30" fill="${dark}"/>
        <rect x="100" y="122" width="34" height="12" rx="4" fill="${darker}"/>
        <circle cx="80" cy="176" r="9" fill="${light}"/>
        <circle cx="120" cy="176" r="9" fill="${light}"/>
        <circle cx="160" cy="176" r="9" fill="${light}"/>
        <polygon points="200,168 224,164 216,188 200,184" fill="${dark}"/>`;
      case 'cruiseShip': return `
        ${waterLine(206)}
        <path d="M40 198 h164 l-14 18 h-136 z" fill="${dark}"/>
        <rect x="56" y="150" width="132" height="48" rx="6" fill="${c}"/>
        <rect x="76" y="118" width="92" height="34" rx="6" fill="${light}"/>
        ${windowsRow(66,160,112,14,6,5)}
        <rect x="150" y="90" width="14" height="30" fill="${dark}"/>`;
      case 'jetski': return `
        ${waterLine(200)}
        <path d="M56 188 q-4 -26 30 -30 h60 q24 0 24 22 v10 q0 10 -14 10 h-88 q-10 0 -12 -12 z" fill="${c}"/>
        <rect x="118" y="138" width="8" height="24" fill="${dark}"/>
        <line x1="102" y1="140" x2="134" y2="140" stroke="${dark}" stroke-width="6" stroke-linecap="round"/>
        <path d="M40 192 q-10 4 -16 0 M46 198 q-10 6 -18 2" stroke="#BEE3F8" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      case 'airplane': return `
        <ellipse cx="120" cy="140" rx="90" ry="20" fill="${c}"/>
        <polygon points="96,140 60,90 84,140" fill="${dark}"/>
        <polygon points="140,140 176,90 156,140" fill="${dark}"/>
        <polygon points="196,132 224,118 214,140" fill="${dark}"/>
        <polygon points="46,130 22,112 40,140" fill="${light}"/>
        ${windowsRow(74,132,110,10,7,4)}`;
      case 'helicopter': return `
        <line x1="60" y1="96" x2="180" y2="96" stroke="${dark}" stroke-width="5"/>
        <ellipse cx="130" cy="148" rx="58" ry="30" fill="${c}"/>
        <ellipse cx="90" cy="148" rx="26" ry="24" fill="${light}"/>
        <line x1="188" y1="150" x2="224" y2="150" stroke="${c}" stroke-width="10" stroke-linecap="round"/>
        <line x1="220" y1="138" x2="220" y2="162" stroke="${dark}" stroke-width="4"/>
        <line x1="100" y1="176" x2="88" y2="192" stroke="${dark}" stroke-width="5" stroke-linecap="round"/>
        <line x1="160" y1="176" x2="172" y2="192" stroke="${dark}" stroke-width="5" stroke-linecap="round"/>
        <line x1="86" y1="192" x2="174" y2="192" stroke="${dark}" stroke-width="5" stroke-linecap="round"/>`;
      case 'hotAirBalloon': return `
        <path d="M120 30 q64 0 64 74 q0 62 -64 62 q-64 0 -64 -62 q0 -74 64 -74 z" fill="${c}"/>
        <polygon points="90,110 150,110 138,138 102,138" fill="${light}"/>
        <path d="M96 138 l14 34 M144 138 l-14 34" stroke="${darker}" stroke-width="3"/>
        <rect x="100" y="172" width="40" height="26" rx="4" fill="${dark}"/>`;
      case 'rocket': return `
        <polygon points="120,26 148,110 92,110" fill="${light}"/>
        <rect x="94" y="108" width="52" height="76" rx="16" fill="${c}"/>
        <circle cx="120" cy="132" r="12" fill="${shade(c,-.2)}"/>
        <polygon points="94,168 66,198 94,190" fill="${dark}"/>
        <polygon points="146,168 174,198 146,190" fill="${dark}"/>
        <polygon points="104,184 136,184 120,222" fill="#FFB627"/>`;
      case 'spaceShuttle': return `
        <path d="M112 30 q8 -6 16 0 l6 96 h-28 z" fill="${c}"/>
        <polygon points="82,150 112,126 112,168" fill="${dark}"/>
        <polygon points="158,150 128,126 128,168" fill="${dark}"/>
        <rect x="104" y="126" width="32" height="66" rx="10" fill="${c}"/>
        <circle cx="120" cy="146" r="8" fill="#BEE3F8"/>
        <polygon points="110,192 130,192 120,214" fill="#FF9F45"/>`;
      default: return `<circle cx="120" cy="120" r="80" fill="${c}"/>`;
    }
  }
  function vehicleSvg(v){ return `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">${vehicleSvgInner(v)}</svg>`; }

  /* ================= sound ================= */
  let audioCtx = null;
  function tone(freqs, dur){
    if(state.muted) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      let t = audioCtx.currentTime;
      freqs.forEach((f)=>{
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type='sine'; osc.frequency.value=f;
        gain.gain.setValueAtTime(0.001,t);
        gain.gain.exponentialRampToValueAtTime(0.18,t+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t+dur+0.02);
        t += dur*0.65;
      });
    }catch(e){}
  }
  function playCorrect(){ tone([523.25,659.25,783.99],0.16); }
  function playWrong(){ tone([180],0.28); }

  /* ================= questions ================= */
  function makeNameQuestion(v){
    const others = [...new Set(VEHICLES.filter(x=>x.id!==v.id).map(x=>x.name))];
    const options = shuffle([v.name, ...pick(others,3)]);
    return {kind:'name', shape:v, prompt:'What vehicle is this?', options, correct:v.name};
  }
  function makeWheelsQuestion(v){
    const correctVal = v.wheels;
    const pool = [...new Set(VEHICLES.filter(x=>x.wheels!==null).map(x=>x.wheels))].filter(val=>val!==correctVal);
    let distractors = pick(pool,3);
    let guard=0;
    while(distractors.length<3 && guard<20){
      guard++;
      const cand = Math.max(0, correctVal + (Math.floor(Math.random()*6)-3));
      if(cand!==correctVal && !distractors.includes(cand)) distractors.push(cand);
    }
    const options = shuffle([correctVal, ...distractors]).map(String);
    return {kind:'wheels', shape:v, prompt:'How many wheels does this have?', options, correct:String(correctVal)};
  }
  function makeTypeQuestion(v){
    const distractors = pick(CATEGORIES.filter(cat=>cat!==v.type),3);
    const options = shuffle([v.type, ...distractors]);
    return {kind:'type', shape:v, prompt:'What type of vehicle is this?', options, correct:v.type};
  }
  function questionFor(kind, v){
    if(kind==='name') return makeNameQuestion(v);
    if(kind==='wheels') return makeWheelsQuestion(v);
    return makeTypeQuestion(v);
  }
  function buildRound(mode){
    const namePool = VEHICLES;
    const wheelsPool = VEHICLES.filter(v=>v.wheels!==null);
    const typePool = VEHICLES;
    const N = 10;
    const qs = [];
    if(mode==='mixed'){
      for(let i=0;i<N;i++){
        const kind = ['name','wheels','type'][Math.floor(Math.random()*3)];
        const pool = kind==='name' ? namePool : (kind==='wheels' ? wheelsPool : typePool);
        qs.push(questionFor(kind, pool[Math.floor(Math.random()*pool.length)]));
      }
    } else {
      const pool = mode==='name' ? namePool : (mode==='wheels' ? wheelsPool : typePool);
      const bag = shuffle(pool);
      for(let i=0;i<N;i++) qs.push(questionFor(mode, bag[i % bag.length]));
    }
    return qs;
  }

  /* ================= state ================= */
  const state = { screen:'menu', mode:null, round:[], qIndex:0, score:0, streak:0, bestStreak:0, locked:false, muted: safeGet('vehicles_muted')==='1' };

  const MODE_META = {
    name:{emoji:'🚗', label:'Name That Vehicle', sub:'Pick the right name'},
    wheels:{emoji:'🛞', label:'Count the Wheels', sub:'How many wheels?'},
    type:{emoji:'🗺️', label:'What Type?', sub:'Land, water, air, or more?'},
    mixed:{emoji:'🎲', label:'Mixed Challenge', sub:'A bit of everything'}
  };

  function bestFor(mode){ return safeGet('vehicles_best_'+mode) || '0'; }
  function setBestFor(mode, score){ const cur = parseInt(bestFor(mode),10)||0; if(score>cur) safeSet('vehicles_best_'+mode, String(score)); }

  /* ================= render: menu ================= */
  function renderMenu(){
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="menu-hero">
        <div class="drift d1">${vehicleSvg({id:'car', color:'#FF6B5B'})}</div>
        <div class="drift d2">${vehicleSvg({id:'rocket', color:'#F5F5F0'})}</div>
        <div class="drift d3">${vehicleSvg({id:'sailboat', color:'#F5F5F0'})}</div>
        <div class="drift d4">${vehicleSvg({id:'bicycle', color:'#2EC4B6'})}</div>
      </div>
      <div class="title-wrap">
        <h1>Dexter's Vehicle Game</h1>
        <p>From bicycles to rockets — how many can you spot?</p>
      </div>
      <div class="mode-grid">
        ${['name','wheels','type'].map(m=>`
          <button class="mode-card" data-mode="${m}">
            <span class="emoji">${MODE_META[m].emoji}</span>
            <span class="label">${MODE_META[m].label}</span>
            <span class="sub">${MODE_META[m].sub}</span>
          </button>`).join('')}
        <button class="mode-card mixed" data-mode="mixed">
          <span class="emoji">${MODE_META.mixed.emoji}</span>
          <span class="txt">
            <span class="label">${MODE_META.mixed.label}</span>
            <span class="sub">${MODE_META.mixed.sub}</span>
          </span>
        </button>
      </div>
      <div class="best-row">
        ${['name','wheels','type','mixed'].map(m=>`<span>${MODE_META[m].emoji} best: <b>${bestFor(m)}/10</b></span>`).join('')}
      </div>
    `;
    app.querySelectorAll('.mode-card').forEach(btn=>btn.addEventListener('click', ()=>startMode(btn.dataset.mode)));
  }

  /* ================= render: game ================= */
  function startMode(mode){
    state.mode = mode; state.round = buildRound(mode); state.qIndex = 0; state.score = 0; state.streak = 0;
    state.screen = 'game'; renderGame();
  }
  function currentQuestion(){ return state.round[state.qIndex]; }

  function renderGame(){
    const app = document.getElementById('app');
    const q = currentQuestion();
    const dots = state.round.map((_,i)=>{
      let cls=''; if(i<state.qIndex) cls='done'; else if(i===state.qIndex) cls='current';
      return `<span class="${cls}"></span>`;
    }).join('');

    app.innerHTML = `
      <div class="topbar">
        <button class="icon-btn" id="backBtn" aria-label="Back to menu">↩️</button>
        <div class="stat">⭐ ${state.score}</div>
        <div class="stat">🔥 ${state.streak}</div>
        <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">${state.muted?'🔇':'🔊'}</button>
      </div>
      <div class="progress-dots">${dots}</div>
      <div class="shape-card" id="shapeCard">
        ${vehicleSvg(q.shape)}
        <div class="burst" id="burst"></div>
      </div>
      <div class="prompt">${q.prompt}</div>
      <div class="options" id="options">
        ${q.options.map((opt,i)=>`<button class="opt-btn c${i}" data-val="${opt}">${opt}</button>`).join('')}
      </div>
      <div class="next-wrap" id="nextWrap"></div>
    `;

    document.getElementById('backBtn').addEventListener('click', ()=>{ state.screen='menu'; renderMenu(); });
    document.getElementById('muteBtn').addEventListener('click', ()=>{
      state.muted = !state.muted; safeSet('vehicles_muted', state.muted?'1':'0'); renderGame();
    });
    state.locked = false;
    document.querySelectorAll('.opt-btn').forEach(btn=>btn.addEventListener('click', ()=>selectAnswer(btn)));
  }

  function burstAt(container, emoji){
    for(let i=0;i<8;i++){
      const s = document.createElement('span'); s.textContent = emoji;
      const angle = Math.random()*Math.PI*2; const dist = 60+Math.random()*40;
      s.style.setProperty('--dx',(Math.cos(angle)*dist).toFixed(0)+'px');
      s.style.setProperty('--dy',(Math.sin(angle)*dist).toFixed(0)+'px');
      s.style.animationDelay=(Math.random()*0.1)+'s';
      container.appendChild(s);
    }
    setTimeout(()=>{ container.innerHTML=''; },900);
  }

  function selectAnswer(btn){
    if(state.locked) return; state.locked = true;
    const q = currentQuestion(); const val = btn.dataset.val; const correct = val === q.correct;
    document.querySelectorAll('.opt-btn').forEach(b=>{
      b.classList.add('locked');
      if(b.dataset.val === q.correct) b.classList.add('correct');
      else if(b===btn) b.classList.add('incorrect');
      else b.classList.add('dim');
    });
    if(correct){
      state.score++; state.streak++; if(state.streak>state.bestStreak) state.bestStreak=state.streak;
      playCorrect(); burstAt(document.getElementById('burst'), '✨');
    } else {
      state.streak = 0; playWrong();
      const card = document.getElementById('shapeCard');
      card.classList.add('wrong-shake'); setTimeout(()=>card.classList.remove('wrong-shake'),420);
    }
    const nextWrap = document.getElementById('nextWrap');
    nextWrap.innerHTML = `<button class="next-btn" id="nextBtn">${state.qIndex < state.round.length-1 ? 'Next ➜' : 'See my score 🏆'}</button>`;
    document.getElementById('nextBtn').addEventListener('click', advance);
    const stats = document.querySelectorAll('.stat');
    if(stats[0]) stats[0].textContent = `⭐ ${state.score}`;
    if(stats[1]) stats[1].textContent = `🔥 ${state.streak}`;
  }

  function advance(){
    if(state.qIndex < state.round.length-1){ state.qIndex++; renderGame(); }
    else { state.screen='result'; renderResult(); }
  }

  /* ================= render: result ================= */
  function renderResult(){
    setBestFor(state.mode, state.score);
    const pct = state.score/state.round.length;
    let stars='⭐', msg='Nice try — let\u2019s spot some more vehicles!';
    if(pct===1){ stars='⭐⭐⭐'; msg='Perfect score! You know every vehicle!'; }
    else if(pct>=0.7){ stars='⭐⭐⭐'; msg='Brilliant vehicle spotting!'; }
    else if(pct>=0.4){ stars='⭐⭐'; msg='Great effort — getting sharper!'; }

    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="menu-hero" style="height:70px;">
        <div class="drift d1">${vehicleSvg({id:'rocket', color:'#F5F5F0'})}</div>
        <div class="drift d3">${vehicleSvg({id:'bicycle', color:'#2EC4B6'})}</div>
      </div>
      <div class="result-card">
        <div class="stars">${stars}</div>
        <div class="score-big">${state.score}/${state.round.length}</div>
        <div class="result-msg">${msg}</div>
        <div class="result-msg">${MODE_META[state.mode].emoji} best for this game: ${bestFor(state.mode)}/10</div>
        <div class="result-actions">
          <button class="pill-btn" id="againBtn">Play again 🔁</button>
          <button class="pill-btn" id="menuBtn">Choose another game 🧩</button>
        </div>
      </div>
    `;
    document.getElementById('againBtn').addEventListener('click', ()=>startMode(state.mode));
    document.getElementById('menuBtn').addEventListener('click', ()=>{ state.screen='menu'; renderMenu(); });
    if(pct===1) burstConfetti();
  }

  function burstConfetti(){
    const layer = document.createElement('div');
    layer.className='burst'; layer.style.position='fixed'; layer.style.left='50%'; layer.style.top='30%';
    document.body.appendChild(layer);
    const emojis=['✨','🎉','⭐','🚗','🚀'];
    for(let i=0;i<16;i++){
      const s=document.createElement('span'); s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      const angle=Math.random()*Math.PI*2; const dist=80+Math.random()*140;
      s.style.setProperty('--dx',(Math.cos(angle)*dist).toFixed(0)+'px');
      s.style.setProperty('--dy',(Math.sin(angle)*dist).toFixed(0)+'px');
      s.style.animationDuration='1.1s';
      layer.appendChild(s);
    }
    setTimeout(()=>layer.remove(),1300);
  }

  /* ================= boot ================= */
  renderMenu();
})();
</script>
