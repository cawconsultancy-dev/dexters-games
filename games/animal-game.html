<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../voice.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dexter's Animal Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFCF5; --ink:#232538; --card:#FFFFFF;
    --coral:#FF6B5B; --marigold:#FFB627; --teal:#2EC4B6; --violet:#7B61FF; --grass:#43B75D; --pink:#FF8FB1;
    --muted:#6B6D82;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
  }
  :root:not([data-theme="light"]){ --bg:var(--cream); --fg:var(--ink); --card-bg:var(--card); --card-border:var(--ink); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1B1C2B; --fg:#FDF9EE; --card-bg:#262840; --card-border:#FDF9EE; }
  }
  :root[data-theme="dark"]{ --bg:#1B1C2B; --fg:#FDF9EE; --card-bg:#262840; --card-border:#FDF9EE; }
  html,body{height:100%;} *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:'Baloo 2', ui-rounded, 'Segoe UI', sans-serif; min-height:100%; display:flex; justify-content:center; overflow-x:hidden; }
  #app{ width:100%; max-width:520px; padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:18px; scroll-padding-top:env(safe-area-inset-top,0px); }

  .pill-btn{ font-family:inherit; font-weight:700; font-size:1rem; color:var(--ink); border:3px solid var(--card-border); border-radius:999px; padding:12px 20px; cursor:pointer; background:var(--card-bg); box-shadow:5px 5px 0 var(--card-border); transition:transform .08s ease, box-shadow .08s ease; }
  .pill-btn:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--card-border); }
  .icon-btn{ width:44px; height:44px; border-radius:50%; border:3px solid var(--card-border); background:var(--card-bg); font-size:1.2rem; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:3px 3px 0 var(--card-border); transition:transform .08s ease, box-shadow .08s ease; }
  .icon-btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--card-border); }
  h1,h2,h3{ margin:0; }

  .menu-hero{ position:relative; height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:-6px; }
  .menu-hero .drift{ position:absolute; animation:drift 5.5s ease-in-out infinite; opacity:.95; }
  .menu-hero svg{ display:block; }
  .drift.d1{ top:0; left:4%; width:56px; animation-delay:.2s; }
  .drift.d2{ top:10px; right:6%; width:50px; animation-delay:1.1s; }
  .drift.d3{ bottom:-4px; left:22%; width:44px; animation-delay:.6s; }
  .drift.d4{ bottom:4px; right:22%; width:48px; animation-delay:1.6s; }
  @keyframes drift{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-10px) rotate(6deg); } }
  .title-wrap{ text-align:center; }
  .title-wrap h1{ font-size:2rem; font-weight:800; line-height:1.05; }
  .title-wrap p{ margin:6px 0 0; color:var(--muted); font-weight:600; font-size:.95rem; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px; }
  @media (max-width:380px){ .mode-grid{ grid-template-columns:1fr; } }
  .mode-card{ border:3px solid var(--card-border); border-radius:22px; background:var(--card-bg); box-shadow:6px 6px 0 var(--card-border); padding:18px 14px; text-align:left; cursor:pointer; font-family:inherit; color:var(--fg); display:flex; flex-direction:column; gap:6px; transition:transform .08s ease, box-shadow .08s ease; }
  .mode-card:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--card-border); }
  .mode-card .emoji{ font-size:1.9rem; }
  .mode-card .label{ font-weight:800; font-size:1.05rem; }
  .mode-card .sub{ font-weight:600; font-size:.82rem; color:var(--muted); }
  .mode-card.mixed{ grid-column:1 / -1; flex-direction:row; align-items:center; gap:14px; }
  .mode-card.mixed .txt{ display:flex; flex-direction:column; gap:2px; }

  .best-row{ display:flex; justify-content:center; gap:14px; font-weight:700; font-size:.78rem; color:var(--muted); flex-wrap:wrap; margin-top:2px; }
  .best-row span b{ color:var(--fg); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stat{ font-weight:800; font-size:.95rem; display:flex; align-items:center; gap:6px; background:var(--card-bg); border:3px solid var(--card-border); border-radius:999px; padding:6px 14px; box-shadow:3px 3px 0 var(--card-border); }
  .progress-dots{ display:flex; gap:5px; justify-content:center; flex-wrap:wrap; }
  .progress-dots span{ width:10px; height:10px; border-radius:50%; background:var(--card-border); opacity:.25; }
  .progress-dots span.done{ opacity:1; background:var(--grass); }
  .progress-dots span.current{ opacity:1; background:var(--marigold); transform:scale(1.3); }

  .shape-card{ position:relative; align-self:center; width:min(80vw,260px); height:min(80vw,260px); background:var(--card-bg); border:4px solid var(--card-border); border-radius:28px; box-shadow:7px 7px 0 var(--card-border); transform:rotate(-1.5deg); display:flex; align-items:center; justify-content:center; margin:4px 0; }
  .shape-card svg{ width:82%; height:82%; animation:popin .32s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popin{ 0%{ transform:scale(.55); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .shape-card.wrong-shake{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{ transform:rotate(-1.5deg) translateX(0); } 25%{ transform:rotate(-1.5deg) translateX(-8px); } 75%{ transform:rotate(-1.5deg) translateX(8px); } }

  .prompt{ text-align:center; font-weight:800; font-size:1.15rem; margin-top:2px; }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
  .opt-btn{ font-family:inherit; font-weight:700; font-size:1.02rem; color:var(--ink); border:3px solid var(--ink); border-radius:18px; padding:16px 8px; cursor:pointer; box-shadow:5px 5px 0 var(--ink); min-height:64px; display:flex; align-items:center; justify-content:center; text-align:center; transition:transform .08s ease, box-shadow .08s ease; }
  .opt-btn:active:not(.locked){ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--ink); }
  .opt-btn.c0{ background:var(--coral); } .opt-btn.c1{ background:var(--teal); } .opt-btn.c2{ background:var(--marigold); } .opt-btn.c3{ background:var(--violet); color:#fff; }
  .opt-btn.correct{ background:var(--grass); color:#fff; outline:4px solid var(--ink); }
  .opt-btn.incorrect{ background:#E24C4C; color:#fff; }
  .opt-btn.dim{ opacity:.45; }

  .next-wrap{ display:flex; justify-content:center; margin-top:4px; min-height:52px; }
  .next-btn{ background:var(--fg); color:var(--bg); font-weight:800; font-size:1rem; border:3px solid var(--card-border); border-radius:999px; padding:12px 26px; cursor:pointer; box-shadow:5px 5px 0 var(--card-border); animation:popin .25s ease; }
  .next-btn:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--card-border); }

  .burst{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .burst span{ position:absolute; left:50%; top:50%; font-size:1.4rem; animation:fly .8s ease-out forwards; }
  @keyframes fly{ 0%{ transform:translate(-50%,-50%) scale(.6); opacity:1; } 100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity:0; } }

  .result-card{ text-align:center; background:var(--card-bg); border:4px solid var(--card-border); border-radius:26px; box-shadow:7px 7px 0 var(--card-border); padding:30px 20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .stars{ font-size:2.2rem; letter-spacing:4px; }
  .score-big{ font-size:2.6rem; font-weight:800; }
  .result-msg{ font-weight:700; color:var(--muted); }
  .result-actions{ display:flex; gap:12px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ================= helpers (shading, shuffle) ================= */
  function hexToRgb(h){ h=h.replace('#',''); return {r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16)}; }
  function shade(hex, amt){
    const {r,g,b} = hexToRgb(hex);
    const f = (c)=> Math.max(0, Math.min(255, Math.round(amt>0 ? c+(255-c)*amt : c+c*amt)));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
    return a;
  }
  function pick(arr,n){ return shuffle(arr).slice(0,n); }
  function safeGet(key){ try{ return localStorage.getItem(key); } catch(e){ return null; } }
  function safeSet(key,val){ try{ localStorage.setItem(key,val); } catch(e){} }

  /* ================= animal data ================= */
  const CATEGORIES = ['Mammal','Bird','Reptile','Amphibian','Fish','Insect','Arachnid','Mollusc'];

  const ANIMALS = [
    {id:'dog', name:'Dog', legs:4, type:'Mammal', color:'#C98A4B'},
    {id:'cat', name:'Cat', legs:4, type:'Mammal', color:'#E08B3E'},
    {id:'elephant', name:'Elephant', legs:4, type:'Mammal', color:'#9CA3AF'},
    {id:'lion', name:'Lion', legs:4, type:'Mammal', color:'#E0A94B'},
    {id:'giraffe', name:'Giraffe', legs:4, type:'Mammal', color:'#E8C078'},
    {id:'zebra', name:'Zebra', legs:4, type:'Mammal', color:'#F5F3EE'},
    {id:'kangaroo', name:'Kangaroo', legs:null, type:'Mammal', color:'#C98A5C'},
    {id:'bear', name:'Bear', legs:4, type:'Mammal', color:'#8B5A2B'},
    {id:'duck', name:'Duck', legs:2, type:'Bird', color:'#F4D35E'},
    {id:'owl', name:'Owl', legs:2, type:'Bird', color:'#A9784B'},
    {id:'penguin', name:'Penguin', legs:2, type:'Bird', color:'#232538'},
    {id:'flamingo', name:'Flamingo', legs:2, type:'Bird', color:'#FF8FB1'},
    {id:'peacock', name:'Peacock', legs:2, type:'Bird', color:'#2EC4B6'},
    {id:'snake', name:'Snake', legs:0, type:'Reptile', color:'#43B75D'},
    {id:'crocodile', name:'Crocodile', legs:4, type:'Reptile', color:'#5B8A3A'},
    {id:'turtle', name:'Turtle', legs:4, type:'Reptile', color:'#5B9E4A'},
    {id:'chameleon', name:'Chameleon', legs:4, type:'Reptile', color:'#4FBF6B'},
    {id:'frog', name:'Frog', legs:4, type:'Amphibian', color:'#6FCB6A'},
    {id:'toad', name:'Toad', legs:4, type:'Amphibian', color:'#8A8F5C'},
    {id:'goldfish', name:'Goldfish', legs:0, type:'Fish', color:'#FF9F45'},
    {id:'shark', name:'Shark', legs:0, type:'Fish', color:'#8B94A3'},
    {id:'seahorse', name:'Seahorse', legs:0, type:'Fish', color:'#F4A259'},
    {id:'bee', name:'Bee', legs:6, type:'Insect', color:'#FFD23F'},
    {id:'butterfly', name:'Butterfly', legs:6, type:'Insect', color:'#7B61FF'},
    {id:'ladybird', name:'Ladybird', legs:6, type:'Insect', color:'#E63946'},
    {id:'ant', name:'Ant', legs:6, type:'Insect', color:'#3B3B3B'},
    {id:'dragonfly', name:'Dragonfly', legs:6, type:'Insect', color:'#2EC4B6'},
    {id:'spider', name:'Spider', legs:8, type:'Arachnid', color:'#3B3B3B'},
    {id:'scorpion', name:'Scorpion', legs:8, type:'Arachnid', color:'#8B5A2B'},
    {id:'octopus', name:'Octopus', legs:null, type:'Mollusc', color:'#C77DFF'}
  ];

  /* ================= svg rendering ================= */
  function quadLegs(color, xs, topY, botY, w){
    xs = xs || [72,98,142,168]; topY = topY===undefined?168:topY; botY=botY===undefined?214:botY; w=w||13;
    return xs.map(x=>`<line x1="${x}" y1="${topY}" x2="${x}" y2="${botY}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`).join('');
  }
  function birdLegs(color, xs, topY, botY){
    xs = xs || [108,132]; topY=topY===undefined?172:topY; botY=botY===undefined?212:botY;
    return xs.map(x=>`<line x1="${x}" y1="${topY}" x2="${x}" y2="${botY}" stroke="${color}" stroke-width="7" stroke-linecap="round"/>
      <line x1="${x-7}" y1="${botY}" x2="${x+7}" y2="${botY}" stroke="${color}" stroke-width="6" stroke-linecap="round"/>`).join('');
  }
  function sixLegs(color){
    return `
      <line x1="98" y1="118" x2="62" y2="104" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
      <line x1="94" y1="140" x2="56" y2="140" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
      <line x1="98" y1="160" x2="62" y2="176" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
      <line x1="142" y1="118" x2="178" y2="104" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
      <line x1="146" y1="140" x2="184" y2="140" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
      <line x1="142" y1="160" x2="178" y2="176" stroke="${color}" stroke-width="5" stroke-linecap="round"/>`;
  }
  function eightLegs(color){
    return `
      <line x1="100" y1="108" x2="58" y2="86" stroke="${color}" stroke-width="6" stroke-linecap="round"/>
      <line x1="96" y1="126" x2="48" y2="118" stroke="${color}" stroke-width="6" stroke-linecap="round"/>
      <line x1="96" y1="150" x2="48" y2="160" stroke="${color}" stroke-width="6" stroke-linecap="round"/>
      <line x1="100" y1="168" x2="58" y2="192" stroke="${color}" stroke-width="6" stroke-linecap="round"/>
      <line x1="140" y1="108" x2="182" y2="86" stroke="${color}" stroke-width="6" stroke-linecap="round"/>
      <line x1="144" y1="126" x2="192" y2="118" stroke="${color}" stroke-width="6" stroke-linecap="round"/>
      <line x1="144" y1="150" x2="192" y2="160" stroke="${color}" stroke-width="6" stroke-linecap="round"/>
      <line x1="140" y1="168" x2="182" y2="192" stroke="${color}" stroke-width="6" stroke-linecap="round"/>`;
  }
  function eyeDots(cx1,cy1,cx2,cy2,r){ r=r||6; return `<circle cx="${cx1}" cy="${cy1}" r="${r}" fill="#232538"/><circle cx="${cx2}" cy="${cy2}" r="${r}" fill="#232538"/>`; }

  function animalSvgInner(a){
    const c = a.color, dark = shade(c,-.3), light = shade(c,.4), darker = shade(c,-.5);
    switch(a.id){
      case 'dog': return `
        ${quadLegs(dark)}
        <ellipse cx="122" cy="150" rx="60" ry="40" fill="${c}"/>
        <path d="M60 150 q-18 4 -16 -18 q14 -4 22 10 z" fill="${c}"/>
        <circle cx="92" cy="92" r="36" fill="${c}"/>
        <ellipse cx="70" cy="78" rx="12" ry="20" fill="${dark}" transform="rotate(-20 70 78)"/>
        <ellipse cx="112" cy="78" rx="12" ry="20" fill="${dark}" transform="rotate(20 112 78)"/>
        <ellipse cx="92" cy="104" rx="14" ry="10" fill="${light}"/>
        ${eyeDots(80,90,104,90,5)}
        <ellipse cx="92" cy="108" rx="5" ry="4" fill="#232538"/>`;
      case 'cat': return `
        ${quadLegs(dark)}
        <ellipse cx="122" cy="152" rx="58" ry="38" fill="${c}"/>
        <path d="M178 150 q28 -6 30 20 q-16 6 -30 -10 z" fill="${c}"/>
        <circle cx="92" cy="94" r="34" fill="${c}"/>
        <polygon points="66,72 78,78 68,94" fill="${c}"/>
        <polygon points="118,72 106,78 116,94" fill="${c}"/>
        ${eyeDots(80,92,104,92,5)}
        <polygon points="92,102 86,110 98,110" fill="${dark}"/>
        <line x1="60" y1="104" x2="30" y2="100" stroke="${dark}" stroke-width="2"/>
        <line x1="60" y1="110" x2="30" y2="112" stroke="${dark}" stroke-width="2"/>
        <line x1="124" y1="104" x2="154" y2="100" stroke="${dark}" stroke-width="2"/>
        <line x1="124" y1="110" x2="154" y2="112" stroke="${dark}" stroke-width="2"/>`;
      case 'elephant': return `
        ${quadLegs(dark,[68,96,146,174],172,216,16)}
        <ellipse cx="126" cy="150" rx="66" ry="44" fill="${c}"/>
        <circle cx="176" cy="56" r="30" fill="${c}"/>
        <ellipse cx="150" cy="70" rx="26" ry="30" fill="${light}"/>
        <ellipse cx="200" cy="70" rx="26" ry="30" fill="${light}"/>
        <path d="M188 78 q10 30 -4 52 q-8 8 -16 0" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round"/>
        ${eyeDots(168,52,184,52,4)}`;
      case 'lion': return `
        ${quadLegs(dark)}
        <ellipse cx="122" cy="156" rx="58" ry="36" fill="${c}"/>
        <circle cx="98" cy="94" r="42" fill="${dark}"/>
        <circle cx="98" cy="94" r="26" fill="${c}"/>
        <polygon points="78,66 88,80 70,82" fill="${dark}"/>
        <polygon points="118,66 108,80 126,82" fill="${dark}"/>
        ${eyeDots(88,92,110,92,4)}
        <polygon points="98,100 92,108 104,108" fill="${darker}"/>
        <line x1="178" y1="150" x2="206" y2="170" stroke="${c}" stroke-width="8" stroke-linecap="round"/>
        <circle cx="208" cy="172" r="8" fill="${dark}"/>`;
      case 'giraffe': return `
        ${quadLegs(dark,[86,104,140,158],186,220,11)}
        <ellipse cx="122" cy="176" rx="42" ry="26" fill="${c}"/>
        <path d="M126 60 q-10 60 -4 96" fill="none" stroke="${c}" stroke-width="26" stroke-linecap="round"/>
        <circle cx="128" cy="46" r="20" fill="${c}"/>
        <line x1="122" y1="30" x2="120" y2="18" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>
        <line x1="134" y1="30" x2="136" y2="18" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>
        ${eyeDots(122,44,134,44,3.5)}
        <ellipse cx="122" cy="70" rx="8" ry="6" fill="${dark}"/>
        <ellipse cx="112" cy="92" rx="7" ry="5" fill="${dark}"/>
        <ellipse cx="134" cy="150" rx="8" ry="6" fill="${dark}"/>
        <ellipse cx="108" cy="170" rx="7" ry="5" fill="${dark}"/>`;
      case 'zebra': return `
        ${quadLegs('#232538')}
        <ellipse cx="122" cy="152" rx="58" ry="38" fill="${c}"/>
        <circle cx="90" cy="94" r="32" fill="${c}"/>
        <polygon points="68,68 78,74 68,88" fill="#232538"/>
        <polygon points="112,68 102,74 112,88" fill="#232538"/>
        ${eyeDots(78,92,100,92,4.5)}
        <path d="M70 128 q10 -6 20 0 M78 148 q12 -6 24 0 M92 168 q12 -6 24 0 M70 86 q10 8 16 20" stroke="#232538" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      case 'kangaroo': return `
        <path d="M150 210 q28 6 30 -18 q-6 -18 -26 -14 z" fill="${dark}"/>
        <line x1="96" y1="176" x2="88" y2="216" stroke="${c}" stroke-width="16" stroke-linecap="round"/>
        <line x1="132" y1="176" x2="140" y2="216" stroke="${c}" stroke-width="16" stroke-linecap="round"/>
        <ellipse cx="118" cy="150" rx="42" ry="46" fill="${c}"/>
        <ellipse cx="118" cy="160" rx="26" ry="20" fill="${light}"/>
        <line x1="80" y1="128" x2="60" y2="150" stroke="${c}" stroke-width="10" stroke-linecap="round"/>
        <circle cx="116" cy="90" r="26" fill="${c}"/>
        <ellipse cx="100" cy="66" rx="8" ry="16" fill="${dark}" transform="rotate(-15 100 66)"/>
        <ellipse cx="132" cy="66" rx="8" ry="16" fill="${dark}" transform="rotate(15 132 66)"/>
        ${eyeDots(106,88,126,88,4)}`;
      case 'bear': return `
        ${quadLegs(dark,[74,98,142,166],174,214,15)}
        <ellipse cx="120" cy="152" rx="60" ry="40" fill="${c}"/>
        <circle cx="98" cy="92" r="34" fill="${c}"/>
        <circle cx="72" cy="66" r="12" fill="${c}"/>
        <circle cx="124" cy="66" r="12" fill="${c}"/>
        <ellipse cx="98" cy="104" rx="16" ry="12" fill="${light}"/>
        ${eyeDots(86,88,110,88,4.5)}
        <circle cx="98" cy="106" r="4" fill="#232538"/>`;
      case 'duck': return `
        ${birdLegs('#FF8C42')}
        <ellipse cx="122" cy="150" rx="52" ry="36" fill="${c}"/>
        <circle cx="98" cy="98" r="26" fill="${c}"/>
        <polygon points="70,98 40,94 70,110" fill="#FF8C42"/>
        ${eyeDots(96,90,96,90,4)}
        <path d="M150 140 q20 4 16 22 q-14 2 -20 -14" fill="${dark}"/>`;
      case 'owl': return `
        ${birdLegs('#8B5A2B',[110,134],180,214)}
        <ellipse cx="122" cy="150" rx="50" ry="52" fill="${c}"/>
        <polygon points="98,102 108,80 116,104" fill="${dark}"/>
        <polygon points="128,102 138,80 146,104" fill="${dark}"/>
        <circle cx="104" cy="132" r="20" fill="#FFFCF5"/>
        <circle cx="140" cy="132" r="20" fill="#FFFCF5"/>
        <circle cx="104" cy="132" r="9" fill="#232538"/>
        <circle cx="140" cy="132" r="9" fill="#232538"/>
        <polygon points="122,142 114,158 130,158" fill="#FF8C42"/>`;
      case 'penguin': return `

  }
  function animalSvg(a){ return `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">${animalSvgInner(a)}</svg>`; }

  /* ================= sound ================= */
  let audioCtx = null;
  function tone(freqs, dur){
    if(state.muted) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      let t = audioCtx.currentTime;
      freqs.forEach((f)=>{
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type='sine'; osc.frequency.value=f;
        gain.gain.setValueAtTime(0.001,t);
        gain.gain.exponentialRampToValueAtTime(0.18,t+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t+dur+0.02);
        t += dur*0.65;
      });
    }catch(e){}
  }
  function playCorrect(){ tone([523.25,659.25,783.99],0.16); }
  function playWrong(){ tone([180],0.28); }

  /* ================= questions ================= */
  function makeNameQuestion(a){
    const others = [...new Set(ANIMALS.filter(x=>x.id!==a.id).map(x=>x.name))];
    const options = shuffle([a.name, ...pick(others,3)]);
    return {kind:'name', shape:a, prompt:'What animal is this?', options, correct:a.name};
  }
  function makeLegsQuestion(a){
    const correctVal = a.legs;
    const pool = [...new Set(ANIMALS.filter(x=>x.legs!==null).map(x=>x.legs))].filter(v=>v!==correctVal);
    let distractors = pick(pool,3);
    let guard=0;
    while(distractors.length<3 && guard<20){
      guard++;
      const cand = Math.max(0, correctVal + (Math.floor(Math.random()*6)-3)*2);
      if(cand!==correctVal && !distractors.includes(cand)) distractors.push(cand);
    }
    const options = shuffle([correctVal, ...distractors]).map(String);
    return {kind:'legs', shape:a, prompt:'How many legs does this animal have?', options, correct:String(correctVal)};
  }
  function makeTypeQuestion(a){
    const distractors = pick(CATEGORIES.filter(c=>c!==a.type),3);
    const options = shuffle([a.type, ...distractors]);
    return {kind:'type', shape:a, prompt:'What type of animal is this?', options, correct:a.type};
  }
  function questionFor(type, a){
    if(type==='name') return makeNameQuestion(a);
    if(type==='legs') return makeLegsQuestion(a);
    return makeTypeQuestion(a);
  }
  function buildRound(mode){
    const namePool = ANIMALS;
    const legsPool = ANIMALS.filter(a=>a.legs!==null);
    const typePool = ANIMALS;
    const N = 10;
    const qs = [];
    if(mode==='mixed'){
      for(let i=0;i<N;i++){
        const type = ['name','legs','type'][Math.floor(Math.random()*3)];
        const pool = type==='name' ? namePool : (type==='legs' ? legsPool : typePool);
        qs.push(questionFor(type, pool[Math.floor(Math.random()*pool.length)]));
      }
    } else {
      const pool = mode==='name' ? namePool : (mode==='legs' ? legsPool : typePool);
      const bag = shuffle(pool);
      for(let i=0;i<N;i++) qs.push(questionFor(mode, bag[i % bag.length]));
    }
    return qs;
  }

  /* ================= state ================= */
  const state = { screen:'menu', mode:null, round:[], qIndex:0, score:0, streak:0, bestStreak:0, locked:false, muted: safeGet('animals_muted')==='1' };

  const MODE_META = {
    name:{emoji:'🐾', label:'Name That Animal', sub:'Pick the right name'},
    legs:{emoji:'🦵', label:'Count the Legs', sub:'How many legs?'},
    type:{emoji:'🧬', label:'What Type?', sub:'Mammal, bird, or more?'},
    mixed:{emoji:'🎲', label:'Mixed Challenge', sub:'A bit of everything'}
  };

  function bestFor(mode){ return safeGet('animals_best_'+mode) || '0'; }
  function setBestFor(mode, score){ const cur = parseInt(bestFor(mode),10)||0; if(score>cur) safeSet('animals_best_'+mode, String(score)); }

  /* ================= render: menu ================= */
  function renderMenu(){
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="menu-hero">
        <div class="drift d1">${animalSvg({id:'butterfly', color:'#7B61FF'})}</div>
        <div class="drift d2">${animalSvg({id:'ladybird', color:'#E63946'})}</div>
        <div class="drift d3">${animalSvg({id:'goldfish', color:'#FF9F45'})}</div>
        <div class="drift d4">${animalSvg({id:'frog', color:'#6FCB6A'})}</div>
      </div>
      <div class="title-wrap">
        <h1>Dexter's Animal Game</h1>
        <p>From dogs to dragonflies — how many can you spot?</p>
      </div>
      <div class="mode-grid">
        ${['name','legs','type'].map(m=>`
          <button class="mode-card" data-mode="${m}">
            <span class="emoji">${MODE_META[m].emoji}</span>
            <span class="label">${MODE_META[m].label}</span>
            <span class="sub">${MODE_META[m].sub}</span>
          </button>`).join('')}
        <button class="mode-card mixed" data-mode="mixed">
          <span class="emoji">${MODE_META.mixed.emoji}</span>
          <span class="txt">
            <span class="label">${MODE_META.mixed.label}</span>
            <span class="sub">${MODE_META.mixed.sub}</span>
          </span>
        </button>
      </div>
      <div class="best-row">
        ${['name','legs','type','mixed'].map(m=>`<span>${MODE_META[m].emoji} best: <b>${bestFor(m)}/10</b></span>`).join('')}
      </div>
    `;
    app.querySelectorAll('.mode-card').forEach(btn=>btn.addEventListener('click', ()=>startMode(btn.dataset.mode)));
  }

  /* ================= render: game ================= */
  function startMode(mode){
    state.mode = mode; state.round = buildRound(mode); state.qIndex = 0; state.score = 0; state.streak = 0;
    state.screen = 'game'; renderGame();
  }
  function currentQuestion(){ return state.round[state.qIndex]; }

  function renderGame(){
    const app = document.getElementById('app');
    const q = currentQuestion();
    const dots = state.round.map((_,i)=>{
      let cls=''; if(i<state.qIndex) cls='done'; else if(i===state.qIndex) cls='current';
      return `<span class="${cls}"></span>`;
    }).join('');

    app.innerHTML = `
      <div class="topbar">
        <button class="icon-btn" id="backBtn" aria-label="Back to menu">↩️</button>
        <div class="stat">⭐ ${state.score}</div>
        <div class="stat">🔥 ${state.streak}</div>
        <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">${state.muted?'🔇':'🔊'}</button>
      </div>
      <div class="progress-dots">${dots}</div>
      <div class="shape-card" id="shapeCard">
        ${animalSvg(q.shape)}
        <div class="burst" id="burst"></div>
      </div>
      <div class="prompt">${q.prompt}</div>
      <div class="options" id="options">
        ${q.options.map((opt,i)=>`<button class="opt-btn c${i}" data-val="${opt}">${opt}</button>`).join('')}
      </div>
      <div class="next-wrap" id="nextWrap"></div>
    `;

    document.getElementById('backBtn').addEventListener('click', ()=>{ state.screen='menu'; renderMenu(); });
    document.getElementById('muteBtn').addEventListener('click', ()=>{
      state.muted = !state.muted; safeSet('animals_muted', state.muted?'1':'0'); renderGame();
    });
    state.locked = false;
    document.querySelectorAll('.opt-btn').forEach(btn=>btn.addEventListener('click', ()=>selectAnswer(btn)));
  }

  function burstAt(container, emoji){
    for(let i=0;i<8;i++){
      const s = document.createElement('span'); s.textContent = emoji;
      const angle = Math.random()*Math.PI*2; const dist = 60+Math.random()*40;
      s.style.setProperty('--dx',(Math.cos(angle)*dist).toFixed(0)+'px');
      s.style.setProperty('--dy',(Math.sin(angle)*dist).toFixed(0)+'px');
      s.style.animationDelay=(Math.random()*0.1)+'s';
      container.appendChild(s);
    }
    setTimeout(()=>{ container.innerHTML=''; },900);
  }

  function selectAnswer(btn){
    if(state.locked) return; state.locked = true;
    const q = currentQuestion(); const val = btn.dataset.val; const correct = val === q.correct;
    document.querySelectorAll('.opt-btn').forEach(b=>{
      b.classList.add('locked');
      if(b.dataset.val === q.correct) b.classList.add('correct');
      else if(b===btn) b.classList.add('incorrect');
      else b.classList.add('dim');
    });
    if(correct){
      state.score++; state.streak++; if(state.streak>state.bestStreak) state.bestStreak=state.streak;
      playCorrect(); burstAt(document.getElementById('burst'), '✨');
    } else {
      state.streak = 0; playWrong();
      const card = document.getElementById('shapeCard');
      card.classList.add('wrong-shake'); setTimeout(()=>card.classList.remove('wrong-shake'),420);
    }
    const nextWrap = document.getElementById('nextWrap');
    nextWrap.innerHTML = `<button class="next-btn" id="nextBtn">${state.qIndex < state.round.length-1 ? 'Next ➜' : 'See my score 🏆'}</button>`;
    document.getElementById('nextBtn').addEventListener('click', advance);
    const stats = document.querySelectorAll('.stat');
    if(stats[0]) stats[0].textContent = `⭐ ${state.score}`;
    if(stats[1]) stats[1].textContent = `🔥 ${state.streak}`;
  }

  function advance(){
    if(state.qIndex < state.round.length-1){ state.qIndex++; renderGame(); }
    else { state.screen='result'; renderResult(); }
  }

  /* ================= render: result ================= */
  function renderResult(){
    setBestFor(state.mode, state.score);
    const pct = state.score/state.round.length;
    let stars='⭐', msg='Nice try — let\u2019s spot some more animals!';
    if(pct===1){ stars='⭐⭐⭐'; msg='Perfect score! You know every animal!'; }
    else if(pct>=0.7){ stars='⭐⭐⭐'; msg='Brilliant animal spotting!'; }
    else if(pct>=0.4){ stars='⭐⭐'; msg='Great effort — getting sharper!'; }

    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="menu-hero" style="height:70px;">
        <div class="drift d1">${animalSvg({id:'ladybird', color:'#E63946'})}</div>
        <div class="drift d3">${animalSvg({id:'frog', color:'#6FCB6A'})}</div>
      </div>
      <div class="result-card">
        <div class="stars">${stars}</div>
        <div class="score-big">${state.score}/${state.round.length}</div>
        <div class="result-msg">${msg}</div>
        <div class="result-msg">${MODE_META[state.mode].emoji} best for this game: ${bestFor(state.mode)}/10</div>
        <div class="result-actions">
          <button class="pill-btn" id="againBtn">Play again 🔁</button>
          <button class="pill-btn" id="menuBtn">Choose another game 🧩</button>
        </div>
      </div>
    `;
    document.getElementById('againBtn').addEventListener('click', ()=>startMode(state.mode));
    document.getElementById('menuBtn').addEventListener('click', ()=>{ state.screen='menu'; renderMenu(); });
    if(pct===1) burstConfetti();
  }

  function burstConfetti(){
    const layer = document.createElement('div');
    layer.className='burst'; layer.style.position='fixed'; layer.style.left='50%'; layer.style.top='30%';
    document.body.appendChild(layer);
    const emojis=['✨','🎉','⭐','🐾','🦋'];
    for(let i=0;i<16;i++){
      const s=document.createElement('span'); s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      const angle=Math.random()*Math.PI*2; const dist=80+Math.random()*140;
      s.style.setProperty('--dx',(Math.cos(angle)*dist).toFixed(0)+'px');
      s.style.setProperty('--dy',(Math.sin(angle)*dist).toFixed(0)+'px');
      s.style.animationDuration='1.1s';
      layer.appendChild(s);
    }
    setTimeout(()=>layer.remove(),1300);
  }

  /* ================= boot ================= */
  renderMenu();
})();
</script>
</body>
</html>
