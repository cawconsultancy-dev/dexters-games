<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dexter's Shapes Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFCF5;
    --ink:#232538;
    --card:#FFFFFF;
    --coral:#FF6B5B;
    --marigold:#FFB627;
    --teal:#2EC4B6;
    --violet:#7B61FF;
    --grass:#43B75D;
    --pink:#FF8FB1;
    --muted:#6B6D82;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  :root:not([data-theme="light"]){
    --bg:var(--cream); --fg:var(--ink); --card-bg:var(--card); --card-border:var(--ink);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1C2B; --fg:#FDF9EE; --card-bg:#262840; --card-border:#FDF9EE;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1C2B; --fg:#FDF9EE; --card-bg:#262840; --card-border:#FDF9EE;
  }
  html,body{height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Baloo 2', ui-rounded, 'Segoe UI', sans-serif;
    min-height:100%;
    display:flex; justify-content:center;
    overflow-x:hidden;
  }
  #app{
    width:100%; max-width:520px;
    padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:18px;
    scroll-padding-top:env(safe-area-inset-top,0px);
  }

  /* ---------- shared bits ---------- */
  .pill-btn{
    font-family:inherit; font-weight:700; font-size:1rem; color:var(--ink);
    border:3px solid var(--card-border); border-radius:999px;
    padding:12px 20px; cursor:pointer; background:var(--card-bg);
    box-shadow:5px 5px 0 var(--card-border);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .pill-btn:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--card-border); }
  .icon-btn{
    width:44px; height:44px; border-radius:50%; border:3px solid var(--card-border);
    background:var(--card-bg); font-size:1.2rem; display:flex; align-items:center;
    justify-content:center; cursor:pointer; box-shadow:3px 3px 0 var(--card-border);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .icon-btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--card-border); }
  h1,h2,h3{ margin:0; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  /* ---------- menu screen ---------- */
  .menu-hero{
    position:relative; height:150px; display:flex; align-items:center; justify-content:center;
    margin-bottom:-6px;
  }
  .menu-hero .drift{ position:absolute; animation:drift 5.5s ease-in-out infinite; opacity:.9; }
  .menu-hero svg{ display:block; }
  .drift.d1{ top:2px; left:6%; width:52px; animation-delay:.2s; }
  .drift.d2{ top:14px; right:8%; width:44px; animation-delay:1.1s; }
  .drift.d3{ bottom:0; left:20%; width:38px; animation-delay:.6s; }
  .drift.d4{ bottom:6px; right:20%; width:46px; animation-delay:1.6s; }
  @keyframes drift{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-10px) rotate(8deg); }
  }
  .title-wrap{ text-align:center; }
  .title-wrap h1{
    font-size:2.1rem; font-weight:800; line-height:1.05;
    letter-spacing:.2px;
  }
  .title-wrap p{ margin:6px 0 0; color:var(--muted); font-weight:600; font-size:.95rem; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px; }
  @media (max-width:380px){ .mode-grid{ grid-template-columns:1fr; } }
  .mode-card{
    border:3px solid var(--card-border); border-radius:22px; background:var(--card-bg);
    box-shadow:6px 6px 0 var(--card-border);
    padding:18px 14px; text-align:left; cursor:pointer; font-family:inherit;
    color:var(--fg); display:flex; flex-direction:column; gap:6px;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .mode-card:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--card-border); }
  .mode-card .emoji{ font-size:1.9rem; }
  .mode-card .label{ font-weight:800; font-size:1.05rem; }
  .mode-card .sub{ font-weight:600; font-size:.82rem; color:var(--muted); }
  .mode-card.mixed{ grid-column:1 / -1; flex-direction:row; align-items:center; gap:14px; }
  .mode-card.mixed .txt{ display:flex; flex-direction:column; gap:2px; }

  .best-row{
    display:flex; justify-content:center; gap:16px; font-weight:700; font-size:.82rem;
    color:var(--muted); flex-wrap:wrap; margin-top:2px;
  }
  .best-row span b{ color:var(--fg); }

  /* ---------- game screen ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .stat{
    font-weight:800; font-size:.95rem; display:flex; align-items:center; gap:6px;
    background:var(--card-bg); border:3px solid var(--card-border); border-radius:999px;
    padding:6px 14px; box-shadow:3px 3px 0 var(--card-border);
  }
  .progress-dots{ display:flex; gap:5px; justify-content:center; flex-wrap:wrap; }
  .progress-dots span{
    width:10px; height:10px; border-radius:50%; background:var(--card-border); opacity:.25;
  }
  .progress-dots span.done{ opacity:1; background:var(--grass); }
  .progress-dots span.current{ opacity:1; background:var(--marigold); transform:scale(1.3); }

  .shape-card{
    position:relative; align-self:center; width:min(80vw,260px); height:min(80vw,260px);
    background:var(--card-bg); border:4px solid var(--card-border); border-radius:28px;
    box-shadow:7px 7px 0 var(--card-border); transform:rotate(-1.5deg);
    display:flex; align-items:center; justify-content:center; margin:4px 0;
  }
  .shape-card svg{ width:78%; height:78%; animation:popin .32s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popin{ 0%{ transform:scale(.55); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .shape-card.wrong-shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:rotate(-1.5deg) translateX(0); }
    25%{ transform:rotate(-1.5deg) translateX(-8px); }
    75%{ transform:rotate(-1.5deg) translateX(8px); }
  }

  .prompt{ text-align:center; font-weight:800; font-size:1.15rem; margin-top:2px; }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
  .opt-btn{
    font-family:inherit; font-weight:700; font-size:1.05rem; color:var(--ink);
    border:3px solid var(--ink); border-radius:18px; padding:16px 10px; cursor:pointer;
    box-shadow:5px 5px 0 var(--ink); min-height:64px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .opt-btn:active:not(.locked){ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--ink); }
  .opt-btn.c0{ background:var(--coral); }
  .opt-btn.c1{ background:var(--teal); }
  .opt-btn.c2{ background:var(--marigold); }
  .opt-btn.c3{ background:var(--violet); color:#fff; }
  .opt-btn.correct{ background:var(--grass); color:#fff; outline:4px solid var(--ink); }
  .opt-btn.incorrect{ background:#E24C4C; color:#fff; }
  .opt-btn.dim{ opacity:.45; }

  .next-wrap{ display:flex; justify-content:center; margin-top:4px; min-height:52px; }
  .next-btn{
    background:var(--fg); color:var(--bg); font-weight:800; font-size:1rem;
    border:3px solid var(--card-border); border-radius:999px; padding:12px 26px; cursor:pointer;
    box-shadow:5px 5px 0 var(--card-border); animation:popin .25s ease;
  }
  .next-btn:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--card-border); }

  .burst{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .burst span{
    position:absolute; left:50%; top:50%; font-size:1.4rem;
    animation:fly .8s ease-out forwards;
  }
  @keyframes fly{
    0%{ transform:translate(-50%,-50%) scale(.6); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity:0; }
  }

  /* ---------- result screen ---------- */
  .result-card{
    text-align:center; background:var(--card-bg); border:4px solid var(--card-border);
    border-radius:26px; box-shadow:7px 7px 0 var(--card-border); padding:30px 20px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .stars{ font-size:2.2rem; letter-spacing:4px; }
  .score-big{ font-size:2.6rem; font-weight:800; }
  .result-msg{ font-weight:700; color:var(--muted); }
  .result-actions{ display:flex; gap:12px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ================= shape data ================= */
  const SHAPES = [
    {id:'circle', name:'Circle', sides:0, corners:0, countable:true, kind:'circle'},
    {id:'oval', name:'Oval', sides:0, corners:0, countable:true, kind:'oval'},
    {id:'triangle', name:'Triangle', sides:3, corners:3, countable:true, kind:'polygon', n:3},
    {id:'square', name:'Square', sides:4, corners:4, countable:true, kind:'rect', square:true},
    {id:'rectangle', name:'Rectangle', sides:4, corners:4, countable:true, kind:'rect', square:false},
    {id:'pentagon', name:'Pentagon', sides:5, corners:5, countable:true, kind:'polygon', n:5},
    {id:'hexagon', name:'Hexagon', sides:6, corners:6, countable:true, kind:'polygon', n:6},
    {id:'rhombus', name:'Rhombus', sides:4, corners:4, countable:true, kind:'polygon', n:4},
    {id:'trapezoid', name:'Trapezoid', sides:4, corners:4, countable:true, kind:'trapezoid'},
    {id:'parallelogram', name:'Parallelogram', sides:4, corners:4, countable:true, kind:'parallelogram'},
    {id:'kite', name:'Kite', sides:4, corners:4, countable:true, kind:'kite'},
    {id:'heptagon', name:'Heptagon', sides:7, corners:7, countable:true, kind:'polygon', n:7},
    {id:'octagon', name:'Octagon', sides:8, corners:8, countable:true, kind:'polygon', n:8},
    {id:'nonagon', name:'Nonagon', sides:9, corners:9, countable:true, kind:'polygon', n:9},
    {id:'decagon', name:'Decagon', sides:10, corners:10, countable:true, kind:'polygon', n:10},
    {id:'star', name:'Star', sides:10, corners:10, countable:true, kind:'star'},
    {id:'semicircle', name:'Semicircle', sides:null, corners:null, countable:false, kind:'semicircle'},
    {id:'crescent', name:'Crescent', sides:null, corners:null, countable:false, kind:'crescent'},
    {id:'cube', name:'Cube', sides:null, corners:null, countable:false, kind:'cube'},
    {id:'sphere', name:'Sphere', sides:null, corners:null, countable:false, kind:'sphere'},
    {id:'cylinder', name:'Cylinder', sides:null, corners:null, countable:false, kind:'cylinder'},
    {id:'cone', name:'Cone', sides:null, corners:null, countable:false, kind:'cone'},
    {id:'pyramid', name:'Square pyramid', sides:null, corners:null, countable:false, kind:'pyramid'}
  ];
  const PALETTE = ['#FF6B5B','#2EC4B6','#FFB627','#7B61FF','#43B75D','#FF8FB1'];

  /* ================= svg rendering ================= */
  function hexToRgb(h){ h=h.replace('#',''); return {r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16)}; }
  function shade(hex, amt){
    const {r,g,b} = hexToRgb(hex);
    const f = (c)=> Math.max(0, Math.min(255, Math.round(amt>0 ? c+(255-c)*amt : c+c*amt)));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function polyPts(n, cx, cy, r, rot){
    rot = rot===undefined? -90 : rot;
    const pts=[];
    for(let i=0;i<n;i++){
      const a=(rot + i*360/n)*Math.PI/180;
      pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));
    }
    return pts.join(' ');
  }
  function starPts(cx, cy, rOut, rIn, points){
    const pts=[];
    for(let i=0;i<points*2;i++){
      const r = i%2===0? rOut : rIn;
      const a=(-90 + i*180/points)*Math.PI/180;
      pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));
    }
    return pts.join(' ');
  }

  function shapeSvgInner(shape, color){
    switch(shape.kind){
      case 'circle':
        return `<circle cx="120" cy="120" r="88" fill="${color}"/>`;
      case 'oval':
        return `<ellipse cx="120" cy="120" rx="100" ry="66" fill="${color}"/>`;
      case 'polygon':
        return `<polygon points="${polyPts(shape.n,120,120,shape.n<=4?92:96)}" fill="${color}"/>`;
      case 'rect':
        return shape.square
          ? `<rect x="32" y="32" width="176" height="176" rx="10" fill="${color}"/>`
          : `<rect x="12" y="54" width="216" height="132" rx="10" fill="${color}"/>`;
      case 'trapezoid':
        return `<polygon points="70,52 170,52 212,190 28,190" fill="${color}"/>`;
      case 'parallelogram':
        return `<polygon points="66,58 206,58 174,182 34,182" fill="${color}"/>`;
      case 'kite':
        return `<polygon points="120,10 195,100 120,225 45,100" fill="${color}"/>`;
      case 'star':
        return `<polygon points="${starPts(120,120,96,42,5)}" fill="${color}"/>`;
      case 'semicircle':
        return `<path d="M 28 148 A 92 92 0 0 1 212 148 Z" fill="${color}"/>`;
      case 'crescent':
        return `<path d="M120 24 a96 96 0 1 0 0 192 a72 72 0 1 1 0 -192 Z" fill="${color}"/>`;
      case 'cube':
        return `
          <polygon points="60,74 120,42 182,74 122,106" fill="${shade(color,.35)}"/>
          <polygon points="60,74 122,106 122,196 60,164" fill="${color}"/>
          <polygon points="182,74 182,164 122,196 122,106" fill="${shade(color,-.25)}"/>`;
      case 'sphere':
        return `
          <defs><radialGradient id="sph" cx="35%" cy="32%" r="75%">
            <stop offset="0%" stop-color="${shade(color,.55)}"/>
            <stop offset="100%" stop-color="${shade(color,-.2)}"/>
          </radialGradient></defs>
          <circle cx="120" cy="120" r="88" fill="url(#sph)"/>`;
      case 'cylinder':
        return `
          <rect x="46" y="66" width="148" height="110" fill="${color}"/>
          <path d="M46 176 a74 24 0 0 0 148 0 v-4 a74 24 0 0 1 -148 0 z" fill="${shade(color,-.25)}"/>
          <ellipse cx="120" cy="66" rx="74" ry="24" fill="${shade(color,.3)}" stroke="${shade(color,-.3)}" stroke-width="3"/>`;
      case 'cone':
        return `
          <ellipse cx="120" cy="188" rx="72" ry="22" fill="${shade(color,-.25)}"/>
          <polygon points="120,28 190,188 50,188" fill="${color}"/>`;
      case 'pyramid':
        return `
          <polygon points="120,26 208,190 32,190" fill="${color}"/>
          <line x1="120" y1="26" x2="120" y2="190" stroke="${shade(color,-.35)}" stroke-width="4"/>`;
      default:
        return `<circle cx="120" cy="120" r="80" fill="${color}"/>`;
    }
  }
  function shapeSvg(shape, color){
    return `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">${shapeSvgInner(shape,color)}</svg>`;
  }

  /* ================= helpers ================= */
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function pick(arr,n){ return shuffle(arr).slice(0,n); }
  function randColor(){ return PALETTE[Math.floor(Math.random()*PALETTE.length)]; }

  function safeGet(key){ try{ return localStorage.getItem(key); } catch(e){ return null; } }
  function safeSet(key,val){ try{ localStorage.setItem(key,val); } catch(e){} }

  /* ================= question generation ================= */
  function makeNameQuestion(shape){
    const others = [...new Set(SHAPES.filter(s=>s.id!==shape.id).map(s=>s.name))];
    const options = shuffle([shape.name, ...pick(others,3)]);
    return {kind:'name', shape, prompt:"What shape is this?", options, correct:shape.name};
  }
  function makeCountQuestion(shape, field){
    const correctVal = shape[field];
    const pool = [...new Set(SHAPES.filter(s=>s.countable).map(s=>s[field]))].filter(v=>v!==correctVal);
    let distractors = pick(pool,3);
    let guard = 0;
    while(distractors.length<3 && guard<20){
      guard++;
      const cand = Math.max(0, correctVal + (Math.floor(Math.random()*6)-3));
      if(cand!==correctVal && !distractors.includes(cand)) distractors.push(cand);
    }
    const options = shuffle([correctVal, ...distractors]).map(String);
    const word = field==='sides' ? 'sides' : 'corners';
    return {kind:field, shape, prompt:`How many ${word} does this shape have?`, options, correct:String(correctVal)};
  }
  function questionFor(type, shape){
    if(type==='name') return makeNameQuestion(shape);
    return makeCountQuestion(shape, type);
  }

  function buildRound(mode){
    const namePool = SHAPES;
    const countPool = SHAPES.filter(s=>s.countable);
    const N = 10;
    const qs = [];
    if(mode==='mixed'){
      for(let i=0;i<N;i++){
        const type = ['name','sides','corners'][Math.floor(Math.random()*3)];
        const pool = type==='name' ? namePool : countPool;
        qs.push(questionFor(type, pool[Math.floor(Math.random()*pool.length)]));
      }
    } else {
      const pool = mode==='name' ? namePool : countPool;
      const bag = shuffle(pool);
      for(let i=0;i<N;i++){
        const shape = bag[i % bag.length];
        qs.push(questionFor(mode, shape));
      }
    }
    return qs;
  }

  /* ================= sound ================= */
  let audioCtx = null;
  function tone(freqs, dur){
    if(state.muted) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      let t = audioCtx.currentTime;
      freqs.forEach((f,i)=>{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = f;
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(0.18, t+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t+dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t+dur+0.02);
        t += dur*0.65;
      });
    }catch(e){}
  }
  function playCorrect(){ tone([523.25,659.25,783.99], 0.16); }
  function playWrong(){ tone([180], 0.28); }

  /* ================= state ================= */
  const state = {
    screen:'menu', mode:null, round:[], qIndex:0, score:0, streak:0, bestStreak:0,
    locked:false, muted: safeGet('shapes_muted')==='1'
  };

  const MODE_META = {
    name: {emoji:'🔺', label:'Name That Shape', sub:'Pick the right name'},
    sides:{emoji:'📏', label:'Count the Sides', sub:'How many sides?'},
    corners:{emoji:'📐', label:'Count the Corners', sub:'How many corners?'},
    mixed:{emoji:'🎲', label:'Mixed Challenge', sub:'A bit of everything'}
  };

  function bestFor(mode){ return safeGet('shapes_best_'+mode) || '0'; }
  function setBestFor(mode, score){
    const cur = parseInt(bestFor(mode),10) || 0;
    if(score>cur) safeSet('shapes_best_'+mode, String(score));
  }

  /* ================= render: menu ================= */
  function renderMenu(){
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="menu-hero">
        <div class="drift d1">${shapeSvg({kind:'polygon',n:5},'#7B61FF')}</div>
        <div class="drift d2">${shapeSvg({kind:'star'},'#FFB627')}</div>
        <div class="drift d3">${shapeSvg({kind:'polygon',n:3},'#FF6B5B')}</div>
        <div class="drift d4">${shapeSvg({kind:'polygon',n:6},'#2EC4B6')}</div>
      </div>
      <div class="title-wrap">
        <h1>Dexter's Shapes Game</h1>
        <p>Circles to decagons — how many can you spot?</p>
      </div>
      <div class="mode-grid">
        ${['name','sides','corners'].map(m=>`
          <button class="mode-card" data-mode="${m}">
            <span class="emoji">${MODE_META[m].emoji}</span>
            <span class="label">${MODE_META[m].label}</span>
            <span class="sub">${MODE_META[m].sub}</span>
          </button>`).join('')}
        <button class="mode-card mixed" data-mode="mixed">
          <span class="emoji">${MODE_META.mixed.emoji}</span>
          <span class="txt">
            <span class="label">${MODE_META.mixed.label}</span>
            <span class="sub">${MODE_META.mixed.sub}</span>
          </span>
        </button>
      </div>
      <div class="best-row">
        ${['name','sides','corners','mixed'].map(m=>`<span>${MODE_META[m].emoji} best: <b>${bestFor(m)}/10</b></span>`).join('')}
      </div>
    `;
    app.querySelectorAll('.mode-card').forEach(btn=>{
      btn.addEventListener('click', ()=> startMode(btn.dataset.mode));
    });
  }

  /* ================= render: game ================= */
  function startMode(mode){
    state.mode = mode;
    state.round = buildRound(mode);
    state.qIndex = 0;
    state.score = 0;
    state.streak = 0;
    state.screen = 'game';
    renderGame();
  }

  function currentQuestion(){ return state.round[state.qIndex]; }

  function renderGame(){
    const app = document.getElementById('app');
    const q = currentQuestion();
    const color = randColor();
    const dots = state.round.map((_,i)=>{
      let cls = '';
      if(i < state.qIndex) cls = 'done';
      else if(i === state.qIndex) cls = 'current';
      return `<span class="${cls}"></span>`;
    }).join('');

    app.innerHTML = `
      <div class="topbar">
        <button class="icon-btn" id="backBtn" aria-label="Back to menu">↩️</button>
        <div class="stat">⭐ ${state.score}</div>
        <div class="stat">🔥 ${state.streak}</div>
        <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">${state.muted?'🔇':'🔊'}</button>
      </div>
      <div class="progress-dots">${dots}</div>
      <div class="shape-card" id="shapeCard">
        ${shapeSvg(q.shape, color)}
        <div class="burst" id="burst"></div>
      </div>
      <div class="prompt">${q.prompt}</div>
      <div class="options" id="options">
        ${q.options.map((opt,i)=>`<button class="opt-btn c${i}" data-val="${opt}">${opt}</button>`).join('')}
      </div>
      <div class="next-wrap" id="nextWrap"></div>
    `;

    document.getElementById('backBtn').addEventListener('click', ()=>{ state.screen='menu'; renderMenu(); });
    document.getElementById('muteBtn').addEventListener('click', ()=>{
      state.muted = !state.muted; safeSet('shapes_muted', state.muted?'1':'0'); renderGame();
    });
    state.locked = false;
    document.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> selectAnswer(btn));
    });
  }

  function burstAt(container, emoji){
    for(let i=0;i<8;i++){
      const s = document.createElement('span');
      s.textContent = emoji;
      const angle = Math.random()*Math.PI*2;
      const dist = 60 + Math.random()*40;
      s.style.setProperty('--dx', (Math.cos(angle)*dist).toFixed(0)+'px');
      s.style.setProperty('--dy', (Math.sin(angle)*dist).toFixed(0)+'px');
      s.style.animationDelay = (Math.random()*0.1)+'s';
      container.appendChild(s);
    }
    setTimeout(()=>{ container.innerHTML=''; }, 900);
  }

  function selectAnswer(btn){
    if(state.locked) return;
    state.locked = true;
    const q = currentQuestion();
    const val = btn.dataset.val;
    const correct = val === q.correct;
    document.querySelectorAll('.opt-btn').forEach(b=>{
      b.classList.add('locked');
      if(b.dataset.val === q.correct) b.classList.add('correct');
      else if(b === btn) b.classList.add('incorrect');
      else b.classList.add('dim');
    });

    if(correct){
      state.score++; state.streak++;
      if(state.streak>state.bestStreak) state.bestStreak = state.streak;
      playCorrect();
      burstAt(document.getElementById('burst'), '✨');
    } else {
      state.streak = 0;
      playWrong();
      const card = document.getElementById('shapeCard');
      card.classList.add('wrong-shake');
      setTimeout(()=>card.classList.remove('wrong-shake'), 420);
    }

    document.getElementById('stat-score');
    const nextWrap = document.getElementById('nextWrap');
    nextWrap.innerHTML = `<button class="next-btn" id="nextBtn">${state.qIndex < state.round.length-1 ? 'Next ➜' : 'See my score 🏆'}</button>`;
    document.getElementById('nextBtn').addEventListener('click', advance);

    // reflect updated score/streak in topbar without full rebuild
    const stats = document.querySelectorAll('.stat');
    if(stats[0]) stats[0].textContent = `⭐ ${state.score}`;
    if(stats[1]) stats[1].textContent = `🔥 ${state.streak}`;
  }

  function advance(){
    if(state.qIndex < state.round.length-1){
      state.qIndex++;
      renderGame();
    } else {
      state.screen = 'result';
      renderResult();
    }
  }

  /* ================= render: result ================= */
  function renderResult(){
    setBestFor(state.mode, state.score);
    const pct = state.score / state.round.length;
    let stars = '⭐';
    let msg = 'Nice try — let\u2019s spot some more shapes!';
    if(pct === 1){ stars='⭐⭐⭐'; msg = 'Perfect score! You know every shape!'; }
    else if(pct >= 0.7){ stars='⭐⭐⭐'; msg = 'Brilliant shape spotting!'; }
    else if(pct >= 0.4){ stars='⭐⭐'; msg = 'Great effort — getting sharper!'; }

    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="menu-hero" style="height:70px;">
        <div class="drift d1">${shapeSvg({kind:'star'},'#FFB627')}</div>
        <div class="drift d3">${shapeSvg({kind:'polygon',n:6},'#2EC4B6')}</div>
      </div>
      <div class="result-card">
        <div class="stars">${stars}</div>
        <div class="score-big">${state.score}/${state.round.length}</div>
        <div class="result-msg">${msg}</div>
        <div class="result-msg">${MODE_META[state.mode].emoji} best for this game: ${bestFor(state.mode)}/10</div>
        <div class="result-actions">
          <button class="pill-btn" id="againBtn">Play again 🔁</button>
          <button class="pill-btn" id="menuBtn">Choose another game 🧩</button>
        </div>
      </div>
    `;
    document.getElementById('againBtn').addEventListener('click', ()=> startMode(state.mode));
    document.getElementById('menuBtn').addEventListener('click', ()=>{ state.screen='menu'; renderMenu(); });
    if(pct === 1) burstConfetti();
  }

  function burstConfetti(){
    const app = document.getElementById('app');
    const layer = document.createElement('div');
    layer.className = 'burst';
    layer.style.position='fixed'; layer.style.left='50%'; layer.style.top='30%';
    document.body.appendChild(layer);
    const emojis = ['✨','🎉','⭐','🔺','🟦'];
    for(let i=0;i<16;i++){
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const angle = Math.random()*Math.PI*2;
      const dist = 80 + Math.random()*140;
      s.style.setProperty('--dx', (Math.cos(angle)*dist).toFixed(0)+'px');
      s.style.setProperty('--dy', (Math.sin(angle)*dist).toFixed(0)+'px');
      s.style.animationDuration = '1.1s';
      layer.appendChild(s);
    }
    setTimeout(()=> layer.remove(), 1300);
  }

  /* ================= boot ================= */
  renderMenu();
})();
</script>
</body>
</html>
