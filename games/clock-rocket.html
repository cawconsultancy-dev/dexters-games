<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<script src="../voice.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dexter's Clock Rocket</title>
<style>
:root{--bg1:#0b0a2a;--bg2:#2a1b5e;--gold:#ffd400;--ink:#1a1a2e;--card:#ffffff;--good:#2bb24c;--bad:#ff6b6b;--blue:#3a86ff;--purple:#6a4c93}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;overflow-x:hidden}
#stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 15%,#fff9,transparent),radial-gradient(2px 2px at 40% 70%,#fff7,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff8,transparent),radial-gradient(1px 1px at 25% 45%,#fff9,transparent),radial-gradient(1.5px 1.5px at 60% 90%,#fff7,transparent)}
#app{position:relative;max-width:620px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:100%}
h1{margin:6px 0 0;font-size:clamp(30px,7vw,46px);color:var(--gold);text-align:center;line-height:1.05}
.sub{margin:0;text-align:center;font-size:clamp(16px,3.8vw,20px);opacity:.9}
.btn{font:inherit;font-weight:700;font-size:clamp(18px,4.4vw,24px);color:#fff;background:var(--blue);border:none;border-radius:22px;padding:16px 20px;width:100%;cursor:pointer;box-shadow:0 5px 0 #0003}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.modes{display:grid;gap:12px;width:100%}
.mode{display:flex;align-items:center;gap:14px;text-align:left}
.mode .em{font-size:34px}
.mode small{display:block;font-weight:400;font-size:.7em;opacity:.9}
.top{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px}
.pill{background:#ffffff22;border-radius:999px;padding:8px 14px;font-weight:700;font-size:18px}
.home{background:#ff8c42;width:auto;padding:10px 16px;font-size:18px}
.q{font-size:clamp(22px,5.4vw,30px);font-weight:700;text-align:center;margin:4px 0}
.clockwrap{background:#ffffff10;border-radius:50%;padding:8px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.ans{background:var(--card);color:var(--ink);font-size:clamp(18px,4.6vw,24px);min-height:72px}
.ans.clockans{padding:6px;min-height:0;display:flex;justify-content:center}
.ans.right{background:var(--good);color:#fff}
.ans.wrong{background:var(--bad);color:#fff}
.fuel{width:100%;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:18px;background:#ffffff22;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb000,#ff5a3a);width:0;transition:width .4s}
.rocket{font-size:30px;transition:transform 1.5s ease-in}
.msg{min-height:30px;font-size:20px;font-weight:700;text-align:center}
.result{background:#ffffff14;border-radius:24px;padding:20px;width:100%;text-align:center}
.big{font-size:56px;font-weight:800;color:var(--gold)}
.launch{animation:launch 2.2s ease-in forwards}
@keyframes launch{0%{transform:translateY(0)}20%{transform:translateY(6px) rotate(-3deg)}100%{transform:translateY(-120vh)}}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app"></div>
<script>
const app=document.getElementById('app');
let voiceOn=true,AC=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function sGood(){[523,659,784].forEach((f,i)=>tone(f,0.22,'triangle',0.15,i*0.08));}
function sBad(){tone(220,0.25,'sawtooth',0.08);}
function sWin(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.15,i*0.12));}
function say(t){if(!voiceOn)return;try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.95;u.pitch=1.1;const v=s.getVoices().find(x=>/en[-_]GB/i.test(x.lang));if(v)u.voice=v;s.speak(u);}catch(e){}}
function getBest(m){try{return parseInt(localStorage.getItem('clock_best_'+m))||0;}catch(e){return 0;}}
function setBest(m,v){try{if(v>getBest(m))localStorage.setItem('clock_best_'+m,v);}catch(e){}}
const NUM=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
/* a time is {h:1-12, m:0|15|30|45} */
function words(t){const nextH=t.h%12+1;
 if(t.m===0)return t.h+" o'clock";if(t.m===30)return 'half past '+t.h;if(t.m===15)return 'quarter past '+t.h;return 'quarter to '+nextH;}
function spoken(t){return words(t).replace(/\d+/,n=>NUM[+n]);}
function same(a,b){return a.h===b.h&&a.m===b.m;}
function clockSVG(t,size){const s=size||220,c=s/2,R=s*0.46;let h='<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'" aria-label="clock">';
 h+='<circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="#fffdf4" stroke="#ffd400" stroke-width="'+s*0.035+'"/>';
 for(let i=0;i<60;i++){const a=i/60*Math.PI*2,big=i%5===0,r1=R*(big?0.84:0.9),r2=R*0.95;h+='<line x1="'+(c+Math.sin(a)*r1)+'" y1="'+(c-Math.cos(a)*r1)+'" x2="'+(c+Math.sin(a)*r2)+'" y2="'+(c-Math.cos(a)*r2)+'" stroke="#1a1a2e" stroke-width="'+(big?s*0.014:s*0.006)+'"/>';}
 for(let n=1;n<=12;n++){const a=n/12*Math.PI*2,r=R*0.7;h+='<text x="'+(c+Math.sin(a)*r)+'" y="'+(c-Math.cos(a)*r)+'" font-family="Arial" font-weight="700" font-size="'+s*0.1+'" fill="#1a1a2e" text-anchor="middle" dominant-baseline="central">'+n+'</text>';}
 /* the hour hand moves part of the way to the next hour, as on a real clock */
 const ha=((t.h%12)+t.m/60)/12*Math.PI*2,ma=t.m/60*Math.PI*2;
 h+='<line x1="'+c+'" y1="'+c+'" x2="'+(c+Math.sin(ha)*R*0.45)+'" y2="'+(c-Math.cos(ha)*R*0.45)+'" stroke="#e63946" stroke-width="'+s*0.045+'" stroke-linecap="round"/>';
 h+='<line x1="'+c+'" y1="'+c+'" x2="'+(c+Math.sin(ma)*R*0.74)+'" y2="'+(c-Math.cos(ma)*R*0.74)+'" stroke="#1d4ed8" stroke-width="'+s*0.028+'" stroke-linecap="round"/>';
 h+='<circle cx="'+c+'" cy="'+c+'" r="'+s*0.03+'" fill="#1a1a2e"/></svg>';return h;}
const MODES=[
 {id:'oclock',em:'🕐',name:"O'clock and half past",desc:'Read the clock',mins:[0,30],type:'read'},
 {id:'quarter',em:'🕒',name:'Quarter past and quarter to',desc:'Read the clock',mins:[15,45],type:'read'},
 {id:'find',em:'🔎',name:'Find the clock',desc:'Pick the clock that shows the time',mins:[0,15,30,45],type:'find'},
 {id:'mixed',em:'🚀',name:'Mixed mission',desc:'Everything together',mins:[0,15,30,45],type:'mixed'}];
let st=null;
function rand(a){return a[Math.floor(Math.random()*a.length)];}
function randTime(mins){return{h:1+Math.floor(Math.random()*12),m:rand(mins)};}
function options(t,mins){const opts=[t];
 /* tricky wrong answers: hour one off (the common half-past mistake), and mixed-up quarter past/to */
 const cands=[{h:t.h%12+1,m:t.m},{h:(t.h+10)%12+1,m:t.m}];
 if(t.m===15)cands.push({h:t.h%12+1,m:45},{h:t.h,m:45});if(t.m===45)cands.push({h:t.h,m:15},{h:(t.h+10)%12+1,m:15});
 if(t.m===30)cands.push({h:t.h,m:0},{h:t.h%12+1,m:0});if(t.m===0)cands.push({h:t.h,m:30},{h:(t.h+10)%12+1,m:30});
 for(const c of cands.sort(()=>Math.random()-0.5)){if(opts.length>=4)break;if(!opts.some(o=>same(o,c)))opts.push(c);}
 while(opts.length<4){const c=randTime(mins);if(!opts.some(o=>same(o,c)))opts.push(c);}
 return opts.sort(()=>Math.random()-0.5);}
function menu(){st=null;app.innerHTML='<img src="../img/logo-192.png" alt="" style="width:110px;height:110px;margin-top:6px" onerror="this.remove()"><h1>Clock Rocket</h1><p class="sub">Tell the time to fuel your rocket!</p><div class="modes" id="modes"></div><button class="btn" id="voice" style="background:#6a4c93">Voice: '+(voiceOn?'on':'off')+'</button>';
 const m=document.getElementById('modes');
 MODES.forEach(md=>{const b=document.createElement('button');b.className='btn mode';b.innerHTML='<span class="em">'+md.em+'</span><span>'+md.name+'<small>'+md.desc+' · best '+getBest(md.id)+'/10</small></span>';b.onclick=()=>{audioInit();start(md);};m.appendChild(b);});
 document.getElementById('voice').onclick=()=>{voiceOn=!voiceOn;menu();};}
function start(md){st={md,q:0,score:0,streak:0,list:[]};
 for(let i=0;i<10;i++){const type=md.type==='mixed'?(i%3===2?'find':'read'):md.type;st.list.push({t:randTime(md.mins),type});}
 ask();}
function ask(){const it=st.list[st.q],md=st.md,opts=options(it.t,md.mins);let locked=false;
 app.innerHTML='<div class="top"><button class="btn home" id="home">⌂ Menu</button><span class="pill">Question '+(st.q+1)+' of 10</span><span class="pill">⭐ '+st.score+'</span></div>'+
 '<div class="fuel"><span class="rocket" id="rk">🚀</span><div class="bar"><i id="fuel" style="width:'+(st.score*10)+'%"></i></div><span>⛽</span></div>'+
 (it.type==='read'?'<div class="q">What time is it?</div><div class="clockwrap">'+clockSVG(it.t,Math.min(260,innerWidth*0.62))+'</div>':'<div class="q">Find the clock that says<br><span style="color:#ffd400">'+words(it.t)+'</span></div>')+
 '<div class="answers" id="ans"></div><div class="msg" id="msg"></div>';
 document.getElementById('home').onclick=menu;
 say(it.type==='read'?'What time is it?':'Find the clock that says '+spoken(it.t));
 const box=document.getElementById('ans');
 opts.forEach(o=>{const b=document.createElement('button');b.className='btn ans'+(it.type==='find'?' clockans':'');
  b.innerHTML=it.type==='read'?words(o):clockSVG(o,Math.min(150,innerWidth*0.36));
  b.onclick=()=>{if(locked)return;locked=true;const ok=same(o,it.t);const msg=document.getElementById('msg');
   if(ok){b.classList.add('right');st.score++;st.streak++;sGood();msg.textContent=rand(['Brilliant!','Spot on!','Rocket fuel added!','Well done!'])+(st.streak>=3?' 🔥 '+st.streak+' in a row':'');say('Yes! '+spoken(it.t));document.getElementById('fuel').style.width=(st.score*10)+'%';}
   else{b.classList.add('wrong');st.streak=0;sBad();[...box.children].forEach((c,i)=>{if(same(opts[i],it.t))c.classList.add('right');});
    msg.textContent='It was '+words(it.t)+'.'+(it.t.m===30||it.t.m===45?' Look at where the short red hand is.':'');say('Good try. It was '+spoken(it.t));}
   setTimeout(()=>{st.q++;if(st.q<10)ask();else result();},ok?1300:2600);};
  box.appendChild(b);});}
function result(){const md=st.md,s=st.score;setBest(md.id,s);sWin();
 const line=s===10?'Perfect! Your rocket has full fuel!':s>=7?'Great time-telling!':s>=4?'Good effort, keep practising!':'Nice try, let\'s fuel up again!';
 app.innerHTML='<h1>Mission complete</h1><div class="result"><div style="font-size:70px" id="rk">🚀</div><div class="big">'+s+'/10</div><p class="sub">'+line+'</p><p class="sub">Best for this mission: '+getBest(md.id)+'/10</p></div><button class="btn" id="again" style="background:#2bb24c">Play again</button><button class="btn" id="menu" style="background:#6a4c93">Choose a mission</button>';
 say(s+' out of 10. '+line);if(s>=7)setTimeout(()=>{const r=document.getElementById('rk');if(r)r.classList.add('launch');},300);
 document.getElementById('again').onclick=()=>start(md);document.getElementById('menu').onclick=menu;}
menu();
</script>
</body>
</html>
