<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<script src="../voice.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12234a">
<title>World Studio</title>
<style>
:root{--bg:#1f6fb0;--accent:radial-gradient(circle at 35% 30%,#5cc1ee,#1f5f9e);--accent-d:#2b86c9}

@font-face{font-family:Fredoka;src:url(../fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff6e5;font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5;transition:opacity .2s}
.hud.off{opacity:0}
.hud .pill{display:flex;align-items:center;gap:8px;background:#0b123acc;border:2px solid #ffffff22;border-radius:999px;padding:6px 16px 6px 10px;font-size:24px;font-weight:700;box-shadow:0 6px 16px #0005;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud .pill i{font-style:normal;font-size:22px}
.hud .lives{font-size:24px;letter-spacing:2px}
.hud .sp{flex:1}
.hud button{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:2px solid #ffffff33;background:#0b123acc;color:#fff;font:700 18px Fredoka,sans-serif;box-shadow:0 6px 16px #0005;cursor:pointer}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:10;background:radial-gradient(circle at 50% 40%,#0000 0,#00000059 100%)}
.ov[hidden]{display:none}
.card{width:min(440px,100%);text-align:center;padding:26px 24px 24px;border-radius:34px;background:linear-gradient(180deg,#ffffffee,#f3eeffee);color:#1d1b3a;box-shadow:0 30px 70px #000a,inset 0 -6px 0 #0000000f;animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{transform:translateY(40px) scale(.9);opacity:0}}
.icon{width:132px;height:132px;margin:-90px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:72px;background:radial-gradient(circle at 35% 30%,#ffffff66,transparent 40%),var(--accent);box-shadow:0 0 0 7px #fff,0 0 0 13px var(--gold,#f2b33d),0 18px 30px #0006}
.card h1{margin:4px 0 6px;font-size:clamp(34px,8vw,46px);line-height:1;font-weight:700;letter-spacing:-.02em}
.card p{margin:0 auto 18px;font-size:19px;line-height:1.35;color:#4a4870;max-width:30ch}
.big{font-size:72px;font-weight:700;line-height:1;color:var(--accent-d);margin:6px 0 4px}
.tag{display:inline-block;background:var(--gold,#f2b33d);color:#2a1a00;border-radius:999px;padding:4px 14px;font-weight:700;font-size:17px;margin-bottom:10px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:999px;padding:16px;font:700 26px Fredoka,sans-serif;background:var(--gold,#f2b33d);color:#2a1a00;box-shadow:0 7px 0 #b7801d;cursor:pointer;margin-top:4px}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 #b7801d}
.go svg{width:30px;height:30px}
.row{display:flex;gap:10px;margin-top:14px}
.ghost{flex:1;border:2px solid #1d1b3a22;background:#fff;color:#1d1b3a;border-radius:999px;padding:11px;font:600 18px Fredoka,sans-serif;cursor:pointer}
.best{font-size:17px;color:#6b6990;margin-top:12px}
.hint{font-size:16px;color:#6b6990;margin:-6px 0 14px}
.float{position:fixed;pointer-events:none}
@media (prefers-reduced-motion:reduce){.card{animation:none}}


.hud{display:none!important}
.tools{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(1060px,calc(100% - 12px));background:#ffffffee;border-radius:28px;box-shadow:0 14px 40px #0008;padding:10px 12px;display:flex;flex-direction:column;gap:8px;z-index:6;color:#1d1b3a}
.tools[hidden]{display:none}
.trow{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.trow::-webkit-scrollbar{display:none}
.tb{flex:none;height:42px;min-width:42px;padding:0 12px;border-radius:14px;border:2px solid #1d1b3a18;background:#fff;font:600 16px Fredoka,sans-serif;color:#1d1b3a;display:flex;align-items:center;gap:6px;cursor:pointer}
.tb.on{background:#1d1b3a;color:#fff;border-color:#1d1b3a}
.st{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:70px;border:none;background:#0b1240;border-radius:16px;padding:6px 4px 5px;cursor:pointer;color:#fff;font:600 11px Fredoka,sans-serif;box-shadow:0 0 0 2px transparent}
.st canvas{width:52px;height:52px}
.st.on{box-shadow:0 0 0 3px #f2b33d;background:#22307a}
.sep{flex:none;width:2px;height:30px;background:#1d1b3a15;border-radius:2px}
.topbtns{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;z-index:6}
.topbtns[hidden]{display:none}
.topbtns .tb{box-shadow:0 6px 16px #0004}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#fff;color:#1d1b3a;border-radius:999px;padding:10px 20px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}
.mv{flex:none;height:40px;padding:0 10px;border-radius:14px;border:2px solid #1d1b3a18;background:#f3f1ff;font:600 15px Fredoka,sans-serif;color:#1d1b3a;display:flex;align-items:center;gap:5px;cursor:pointer}
.mv.on{background:#6a4cff;color:#fff;border-color:#6a4cff}
.mvlab{flex:none;font:700 14px Fredoka,sans-serif;color:#6a4cff;padding:0 4px}
.recb{background:#e5243b!important;color:#fff!important;border-color:#e5243b!important}
.recbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:8;background:#ffffffee;border-radius:999px;padding:6px 8px 6px 16px;box-shadow:0 8px 24px #0006;font:700 18px Fredoka,sans-serif;color:#1d1b3a}
.recbar[hidden],.count[hidden],.modal[hidden]{display:none}
.mtr{width:70px;height:10px;border-radius:5px;background:#1d1b3a22;overflow:hidden;display:inline-block}#meter{display:block;height:100%;width:0;background:#2bb673;transition:width .08s}
.dot{width:14px;height:14px;border-radius:50%;background:#e5243b;animation:blinkr 1s infinite}
@keyframes blinkr{50%{opacity:.25}}
.count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;font:700 160px Fredoka,sans-serif;color:#fff;text-shadow:0 8px 30px #000a;pointer-events:none}
.modal{position:fixed;inset:0;background:#05082acc;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:26px;padding:14px;max-width:min(900px,100%);width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.mbox video{width:100%;max-height:60vh;border-radius:16px;background:#000}
.mrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (max-width:560px){.st{width:60px}.st canvas{width:44px;height:44px}.tb{height:38px;font-size:14px;padding:0 9px}}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud off" id="hud"><div class="pill"><i id="scoreIcon">⭐</i><span id="score">0</span></div><div class="lives" id="lives"></div><span class="sp"></span><button id="pauseBtn" aria-label="Pause">❚❚</button></div>
<div class="ov" id="title" hidden><div class="card"><div class="icon" id="tIcon"></div><h1 id="tTitle"></h1><p id="tSub"></p><div class="hint" id="tHint"></div><button class="go" id="play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2a1a00"/><path d="M10 7.5v9l7-4.5z" fill="#f2b33d"/></svg>Play</button><div class="best" id="tBest"></div><div class="row"><button class="ghost snd"></button></div></div></div>
<div class="ov" id="pause" hidden><div class="card"><h1>Paused</h1><p>Take a break. Your game is waiting.</p><button class="go" id="resume"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2a1a00"/><path d="M10 7.5v9l7-4.5z" fill="#f2b33d"/></svg>Keep playing</button><div class="row"><button class="ghost" id="restart">Start again</button><button class="ghost snd"></button></div></div></div>
<div class="ov" id="over" hidden><div class="card"><div class="tag" id="oTag">New best!</div><h1 id="oTitle"></h1><div class="big" id="oScore">0</div><div class="best" id="oUnit" style="margin-top:0">points</div><div class="best" id="oBest"></div><button class="go" id="again" style="margin-top:16px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2a1a00"/><path d="M10 7.5v9l7-4.5z" fill="#f2b33d"/></svg>Play again</button><div class="row"><button class="ghost" id="toTitle">Menu</button><button class="ghost snd"></button></div></div></div>

<div class="topbtns" id="topb" hidden><button class="tb" id="undo">↩️ Undo</button><button class="tb" id="clear">🗑️ New</button><button class="tb recb" id="save">⏺️ Record</button><button class="tb" id="exit">✕</button></div>
<div class="tools" id="tools" hidden>
 <div class="trow" id="moves" hidden></div>
 <div class="trow" id="cats"></div>
 <div class="trow" id="stamps"></div>
 <div class="trow" id="opts"></div>
</div>
<div class="toast" id="toast"></div>
<div class="recbar" id="recbar" hidden><span class="dot"></span><span id="rect">0:00</span><span class="mtr" title="Voice"><span id="meter"></span></span><button class="tb" id="allr">👄 Everyone</button><button class="tb" id="stopb">⏹️ Stop</button></div>
<div class="count" id="count" hidden></div>
<div class="modal" id="prev" hidden><div class="mbox"><video id="pv" playsinline controls></video><div class="mrow"><button class="tb" id="psave">📤 Save or send</button><button class="tb" id="pagain">🎬 Make another</button><button class="tb" id="pdel">🗑️ Delete</button></div></div></div>

<script>
const GAME_KEY='worldstudio';

const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');let W=innerWidth,H=innerHeight,DPR=1;
const store={get(k,d){try{const v=localStorage.getItem('fun_'+GAME_KEY+'_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('fun_'+GAME_KEY+'_'+k,JSON.stringify(v));}catch(e){}}};
/* ---------- sound ---------- */
let AC=null,soundOn=store.get('sound',true),master=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=soundOn?1:0;master.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,vol,delay,slideTo){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.05);}
function noise(d,vol,freq,delay,type){if(!AC)return;const t=AC.currentTime+(delay||0),n=Math.max(1,Math.floor(AC.sampleRate*d)),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq||1000;const g=AC.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(master);s.start(t);}
const sfx={
 coin(){tone(988,0.08,'square',0.06);tone(1319,0.18,'square',0.06,0.07);},
 pop(){noise(0.08,0.25,1800);tone(500,0.08,'sine',0.12,0,1200);},
 jump(){tone(330,0.18,'square',0.06,0,700);},
 hit(){noise(0.25,0.35,400,0,'lowpass');tone(160,0.3,'sawtooth',0.08,0,60);},
 good(){[523,659,784].forEach((f,i)=>tone(f,0.16,'triangle',0.12,i*0.06));},
 win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.24,'triangle',0.13,i*0.1));},
 over(){[392,330,262,196].forEach((f,i)=>tone(f,0.3,'triangle',0.12,i*0.16));},
 whoosh(){noise(0.18,0.18,600,0,'bandpass');},
 tap(){tone(700,0.05,'sine',0.07);}};
function say(t){if(!soundOn)return;try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.92;u.pitch=1.1;const v=s.getVoices().find(x=>/en[-_]GB/i.test(x.lang));if(v)u.voice=v;s.speak(u);}catch(e){}}
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}}
function emoji(e,x,y,size,rot,alpha){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(alpha!==undefined)ctx.globalAlpha=alpha;ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,0,size*0.06);ctx.restore();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function text(t,x,y,size,col,align,stroke){ctx.font='700 '+size+'px Fredoka,"Arial Rounded MT Bold",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=size*0.18;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(t,x,y);}ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);}
/* ---------- particles, floating text, shake ---------- */
let parts=[],floats=[],shakeT=0,shakeM=0;
function burst(x,y,cols,n,spd,size,grav){for(let i=0;i<(n||14);i++){const a=Math.random()*Math.PI*2,s=rnd(0.3,1)*(spd||260);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(0.5,0.9),L:0.9,r:rnd(0.5,1)*(size||6),c:pick(cols),g:grav===undefined?500:grav,star:Math.random()<0.25});}}
function floatText(t,x,y,col,size){floats.push({t,x,y,c:col||'#fff',s:size||30,l:1});}
function shake(m,t){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t||0.3);}
function star(x,y,r,fill){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}}
function drawFx(dt){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=0.985;p.l-=dt;ctx.globalAlpha=clamp(p.l/p.L*1.4,0,1);if(p.star)star(p.x,p.y,p.r*1.4,p.c);else circ(p.x,p.y,p.r,p.c);});ctx.globalAlpha=1;parts=parts.filter(p=>p.l>0);
 floats.forEach(f=>{f.y-=60*dt;f.l-=dt*0.9;ctx.globalAlpha=clamp(f.l*1.5,0,1);text(f.t,f.x,f.y,f.s*(1+0.2*(1-f.l)),f.c,'center','#0008');});ctx.globalAlpha=1;floats=floats.filter(f=>f.l>0);}
/* ---------- game state ---------- */
let state='title',score=0,lives=0,best=store.get('best',0),T=0,last=0;
function setScore(v){score=Math.max(0,Math.round(v));$('score').textContent=score;}
function addScore(v,x,y,col){setScore(score+v);if(x!==undefined)floatText((v>0?'+':'')+v,x,y,col||'#ffd27a');}
function setLives(v){lives=v;$('lives').textContent=v>0?'❤️'.repeat(v):'';$('lives').hidden=!G.lives;}
function loseLife(x,y){if(!G.lives)return;setLives(lives-1);shake(14,0.35);sfx.hit();if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}if(lives<=0)setTimeout(()=>{if(state==='play')gameOver();},450);}
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';if(G.resize)G.resize();}
function show(id){['title','pause','over'].forEach(k=>$(k).hidden=k!==id);$('hud').classList.toggle('off',!(id===null||id==='pause'));}
function start(){audioInit();parts=[];floats=[];T=0;setScore(0);setLives(G.lives||0);G.init();state='play';show(null);sfx.tap();}
function gameOver(custom){if(state!=='play')return;state='over';const nb=score>best;if(nb){best=score;store.set('best',best);}
 $('oTitle').textContent=(custom&&custom.title)||(nb&&score>0?pick(['Amazing!','Superstar!','Wow!']):(score>0?pick(['Great game!','Brilliant!','So close!','Nice one!']):'Have another go!'));
 $('oTag').hidden=!(nb&&score>0);$('oScore').textContent=score;$('oUnit').textContent=G.unit||'points';$('oBest').textContent='Best: '+best+' '+(G.unit||'points');
 setTimeout(()=>{show('over');(nb&&score>0?sfx.win:sfx.over)();if(nb&&score>0)for(let i=0;i<4;i++)setTimeout(()=>burst(rnd(W*0.2,W*0.8),rnd(H*0.2,H*0.5),['#ffd27a','#ff6b9a','#7ad7ff','#9bff8a','#fff'],26,380,7,300),i*180);},custom&&custom.delay!==undefined?custom.delay:500);}
function pause(){if(state!=='play')return;state='pause';show('pause');}
function resume(){if(state!=='pause')return;state='play';show(null);last=performance.now();}
function frame(now){const dt=Math.min(0.034,(now-(last||now))/1000);last=now;
 if(state==='play'){T+=dt;G.update(dt);}else if(G.idle)G.idle(dt);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(shakeT>0){shakeT-=dt;const m=shakeM*clamp(shakeT/0.3,0,1);ctx.translate(rnd(-m,m),rnd(-m,m));}else shakeM=0;
 G.draw(ctx,dt);drawFx(dt);requestAnimationFrame(frame);}
function pos(e){return[e.clientX,e.clientY];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(state!=='play')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}if(G.down)G.down(...pos(e),e);});
cv.addEventListener('pointermove',e=>{if(state==='play'&&G.move)G.move(...pos(e),e);});
addEventListener('pointerup',e=>{if(state==='play'&&G.up)G.up(...pos(e),e);});
addEventListener('pointercancel',e=>{if(state==='play'&&G.up)G.up(...pos(e),e);});
addEventListener('keydown',e=>{if(e.repeat)return;if(state==='title'&&(e.key===' '||e.key==='Enter')){start();return;}if(e.key==='Escape'||e.key==='p'){state==='play'?pause():resume();return;}if(state==='play'&&G.key){G.key(e.key,true);e.preventDefault();}});
addEventListener('keyup',e=>{if(state==='play'&&G.key)G.key(e.key,false);});
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
function setSound(on){soundOn=on;store.set('sound',on);if(master)master.gain.value=on?1:0;document.querySelectorAll('.snd').forEach(b=>b.textContent=on?'🔊 Sound on':'🔇 Sound off');}
function boot(){document.title=G.title;$('tIcon').textContent=G.icon;$('tTitle').textContent=G.title;$('tSub').textContent=G.sub;$('tHint').textContent=G.hint||'';$('tBest').textContent=best?'Best: '+best+' '+(G.unit||'points'):'';$('scoreIcon').textContent=G.scoreIcon||'⭐';
 $('play').onclick=start;$('again').onclick=start;$('restart').onclick=()=>{state='over';start();};$('resume').onclick=resume;$('pauseBtn').onclick=pause;
 $('toTitle').onclick=()=>{$('tBest').textContent=best?'Best: '+best+' '+(G.unit||'points'):'';state='title';G.init();show('title');};
 document.querySelectorAll('.snd').forEach(b=>b.onclick=()=>{audioInit();setSound(!soundOn);});setSound(soundOn);

function buildTools(){if(built)return;built=true;renderCats();renderOpts();renderStamps();
 $('cats').onclick=$('opts').onclick=e=>{const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;renderCats();renderStamps();sfx.tap();say(b.textContent.replace(/^\S+\s/,''));return;}
  const s=e.target.closest('[data-s]');if(s){size=+s.dataset.s;renderOpts();sfx.tap();}
  if(e.target.closest('#names')){names=!names;renderOpts();sfx.tap();}
  if(e.target.closest('#allb')){setAllTalk(!allTalk);}
  if(e.target.closest('#micb')){ensureMic().then(ok=>{if(ok){if(!talker)talker=[...items].reverse().find(i=>hasFace(i.t))||null;toast(talker?'Talk and watch '+OBJ[talker.t][0]+' talk!':'Stamp a planet, then talk!');}});}
  if(e.target.closest('#bgb')){bgi=(bgi+1)%BGS.length;bgSeed++;makeBg();sfx.whoosh();}};
 $('stamps').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;sel=b.dataset.t;renderStamps();const o=OBJ[sel];say(o[0]+', '+o[2]);};
 $('undo').onclick=()=>{const g=items.pop();if(g===selected)selected=null;if(g===talker)talker=null;renderMoves();sfx.tap();};
 $('clear').onclick=()=>{if(items.length&&!confirmClear)return armClear();items=[];selected=null;talker=null;renderMoves();confirmClear=false;$('clear').textContent='🗑️ New';sfx.whoosh();toast('A brand new sky!');};
 $('save').onclick=startRec;$('stopb').onclick=stopRec;$('allr').onclick=()=>setAllTalk(!allTalk);$('exit').onclick=()=>{if(rec)stopRec();state='title';tools(false);show('title');};
 $('moves').onclick=e=>{const b=e.target.closest('[data-m]');if(!b||!selected)return;const m=b.dataset.m;
  if(m==='del'){items=items.filter(i=>i!==selected);if(talker===selected)talker=null;selected=null;renderMoves();sfx.whoosh();return;}
  selected.an=m;selected.ph=nowS*-1.3;renderMoves();sfx.tap();say(MOVES.find(q=>q[0]===m)[1].replace(/^\S+\s/,''));};
 $('psave').onclick=saveVid;$('pagain').onclick=()=>{$('prev').hidden=true;$('pv').pause();};

const MOVES=[['none','⏸️ Still'],['bob','↕️ Up and down'],['sway','↔️ Side to side'],['spin','🔄 Spin'],['bounce','🏀 Bounce'],['orbit','🌀 Go round'],['grow','💗 Grow'],['dance','💃 Dance']];
function hasFace(t){return !!OBJ[t];}
function renderMoves(){const m=$('moves');if(!selected||rec){m.hidden=true;return;}m.hidden=false;
 m.innerHTML='<span class="mvlab">'+OBJ[selected.t][0]+(selected===talker?' 🗣️':'')+'</span>'+MOVES.map(q=>'<button class="mv'+((selected.an||'none')===q[0]?' on':'')+'" data-m="'+q[0]+'">'+q[1]+'</button>').join('')+'<span class="sep"></span><button class="mv" data-m="del">🗑️ Remove</button>';}
function animOf(it,tm){let dx=0,dy=0,dr=0,sc=1;const p=it.ph||0,r=it.r;
 switch(it.an){case 'bob':dy=Math.sin(tm*2.2+p)*r*0.5;break;case 'sway':dx=Math.sin(tm*1.8+p)*r*0.9;break;case 'spin':dr=tm*1.6+p;break;
 case 'bounce':dy=-Math.abs(Math.sin(tm*3+p))*r*1.2;break;case 'orbit':dx=Math.cos(tm*1.3+p)*r*1.8;dy=Math.sin(tm*1.3+p)*r;break;
 case 'grow':sc=1+0.2*Math.sin(tm*3+p);break;case 'dance':dr=Math.sin(tm*5+p)*0.3;dy=-Math.abs(Math.sin(tm*5+p))*r*0.25;break;}
 if(it===talker||(allTalk&&hasFace(it.t))){dy-=lvl*r*0.12;sc*=1+lvl*0.05;}return [dx,dy,dr,sc];}
function hitItem(x,y){for(let i=items.length-1;i>=0;i--){const it=items[i];const [dx,dy]=animOf(it,nowS);if(Math.hypot(x-(it.x+dx),y-(it.y+dy))<Math.max(24,it.r*1.1))return it;}return null;}
let MAC=null,meterStream=null,noiseF=0.01,peakF=0.05;
function setupMeter(){try{if(MAC){try{MAC.close();}catch(e){}}MAC=new(window.AudioContext||window.webkitAudioContext)();
 meterStream=new MediaStream(micStream.getAudioTracks().map(t=>t.clone()));const src=MAC.createMediaStreamSource(meterStream);analyser=MAC.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=0.2;src.connect(analyser);
 const z=MAC.createGain();z.gain.value=0;analyser.connect(z);z.connect(MAC.destination);abuf=new Uint8Array(analyser.fftSize);if(MAC.state!=='running')MAC.resume();}catch(e){analyser=null;}}
function wakeMeter(){if(MAC&&MAC.state!=='running'){try{MAC.resume();}catch(e){}}}
document.addEventListener('pointerdown',wakeMeter,true);
async function ensureMic(){if(micStream)return true;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('No microphone on this device');return false;}
 try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});setupMeter();return true;}
 catch(e){toast('Microphone not allowed, so no sound');return false;}}
function setAllTalk(v){allTalk=v;renderOpts();const b=$('allr');if(b)b.classList.toggle('on',allTalk);if(!rec){sfx.tap();toast(allTalk?'Everyone talks with your voice!':'Only the one you tap talks');}}
function fmtT(sec){sec=Math.floor(sec);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
const _say=say;say=function(t){if(rec)return;_say(t);};
async function startRec(){if(rec)return;if(!window.MediaRecorder||!cv.captureStream){toast('This device cannot record videos');return;}
 if(!items.length){toast('Stamp something first!');say('Stamp something first!');return;}
 await ensureMic();selected=null;dragItem=null;press=null;
 if(!talker){talker=[...items].reverse().find(i=>hasFace(i.t))||null;}
 tools(false);$('moves').hidden=true;const ce=$('count');ce.hidden=false;
 for(const n of [3,2,1]){ce.textContent=n;tone(660,0.15,'sine',0.12);await new Promise(r=>setTimeout(r,800));}
 ce.hidden=true;tone(990,0.25,'sine',0.14);await new Promise(r=>setTimeout(r,300));try{speechSynthesis.cancel();}catch(e){}
 if(master)master.gain.value=0;
 recStream=cv.captureStream(30);const tr=[...recStream.getVideoTracks()];if(micStream)tr.push(...micStream.getAudioTracks());const ms=new MediaStream(tr);
 const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];const mime=types.find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}})||'';
 try{rec=new MediaRecorder(ms,mime?{mimeType:mime,videoBitsPerSecond:4000000}:{});}catch(e){try{rec=new MediaRecorder(ms);}catch(e2){rec=null;}}
 if(!rec){if(master)master.gain.value=soundOn?1:0;tools(true);toast('This device cannot record videos');return;}
 chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};rec.onstop=finishRec;rec.start(1000);recT0=performance.now();$('recbar').hidden=false;$('allr').classList.toggle('on',allTalk);$('rect').textContent='0:00';}
function stopRec(){if(!rec)return;try{rec.stop();}catch(e){finishRec();}}
function ensureTalker(){if(talker&&items.includes(talker)&&hasFace(talker.t))return;talker=[...items].reverse().find(i=>hasFace(i.t))||null;}
function finishRec(){const r0=rec;rec=null;if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}if(master)master.gain.value=soundOn?1:0;$('recbar').hidden=true;tools(true);renderMoves();
 if(!chunks.length){toast('Nothing recorded, try again');return;}
 const type=(r0&&r0.mimeType)||chunks[0].type||'video/webm';lastBlob=new Blob(chunks,{type});chunks=[];saved++;setScore(saved);
 const v=$('pv');v.src=URL.createObjectURL(lastBlob);$('prev').hidden=false;sfx.win();try{v.play();}catch(e){}}
async function saveVid(){if(!lastBlob)return;const ext=lastBlob.type.includes('mp4')?'mp4':'webm';const file=new File([lastBlob],'dexter-space-video.'+ext,{type:lastBlob.type.split(';')[0]});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'My space video'});toast('Sent!');return;}}catch(e){if(e.name==='AbortError')return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Video saved!');}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&rec)stopRec();});
let confirmClear=false;function armClear(){confirmClear=true;$('clear').textContent='🗑️ Sure?';setTimeout(()=>{confirmClear=false;$('clear').textContent='🗑️ New';},2500);}
function renderCats(){$('cats').innerHTML=CATS.map(c=>'<button class="tb'+(c[0]===cat?' on':'')+'" data-c="'+c[0]+'">'+c[1]+'</button>').join('');}
function renderOpts(){$('opts').innerHTML=[10,16,23].map((f,i)=>'<button class="tb'+(i===size?' on':'')+'" data-s="'+i+'" aria-label="'+['Small','Medium','Large'][i]+'"><span style="font-size:'+f+'px;line-height:1">●</span></button>').join('')+'<span class="sep"></span><button class="tb'+(names?' on':'')+'" id="names">🏷️ Names</button><button class="tb" id="bgb">🎨 New blue</button><button class="tb" id="micb">🎙️ Try my voice</button><button class="tb'+(allTalk?' on':'')+'" id="allb">👄 Everyone talks</button>';}
function renderStamps(){animOn=false;const keys=Object.keys(OBJ).filter(k=>OBJ[k][1]===cat);if(!keys.includes(sel))sel=keys[0];
 $('stamps').innerHTML=keys.map(k=>'<button class="st'+(k===sel?' on':'')+'" data-t="'+k+'"><canvas width="104" height="104" data-i="'+k+'"></canvas>'+OBJ[k][0]+'</button>').join('');
 document.querySelectorAll('#stamps canvas').forEach(cv2=>{const c=cv2.getContext('2d');const k=cv2.dataset.i;const r=thumbR(k);drawObj(c,k,k.includes('comet')?34:52,k.includes('comet')?66:52,r,0,k.includes('comet')?-Math.PI*0.25:undefined);});}
function tools(on){$('tools').hidden=!on;$('topb').hidden=!on;}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1800);}
G.resize=()=>{if(DPR>1.5){DPR=1.5;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}makeBg();};
G.init=()=>{if(!bgCanvas)makeBg();buildTools();};
const _start=start;start=function(){_start();tools(true);setTimeout(()=>say('Stamp countries and landmarks, give them moves, then press record and talk!'),300);};
G.down=(x,y)=>{wakeMeter();const h=hitItem(x,y);if(h){selected=h;dragItem=h;dragOff=[h.x-x,h.y-y];if(hasFace(h.t))talker=h;renderMoves();return;}press={x,y,t:sel,cx:x,cy:y};};
pause=function(){};
G.move=(x,y)=>{if(dragItem){dragItem.x=x+dragOff[0];dragItem.y=y+dragOff[1];return;}if(press)press.cx=x,press.cy=y;};
G.up=(x,y)=>{if(dragItem){dragItem=null;return;}if(!press)return;const p=press;press=null;const t=p.t,r=radiusFor(t);let dir;const dx=x-p.x,dy=y-p.y;const dragged=Math.hypot(dx,dy)>12;if(y>H-8||x<0)return;p.x=x;p.y=y;
 if(t.includes('comet'))dir=dragged?Math.atan2(-dy,-dx):Math.atan2(y-H/2,x-W/2)+Math.PI*0.15;
 if(t==='rocket')dir=dragged?Math.atan2(dy,dx):-Math.PI/2;
 items.push({t,x:p.x,y:p.y,r,rot:t.includes('comet')||t==='rocket'||t==='saturn'||t==='haumea'||t==='quaoar'||(SPEC[t]&&'con iss hubble jwst voyager'.includes(SPEC[t].k))?0:(NOROT(t)?0:rnd(-0.3,0.3)),dir});popT.push({x:p.x,y:p.y,r,l:0.35});
 {const nw=items[items.length-1];nw.an='none';nw.ph=0;selected=nw;if(hasFace(t))talker=nw;renderMoves();}tone(rnd(500,800),0.12,'triangle',0.09,0,1300);burst(p.x,p.y,['#ffd27a','#bfe9ff','#fff'],10,200,3,0);say(OBJ[t][0]);};
G.update=dt=>{ensureTalker();popT.forEach(q=>q.l-=dt);popT=popT.filter(q=>q.l>0);
 if(analyser){wakeMeter();analyser.getByteTimeDomainData(abuf);let sum=0;for(let i=0;i<abuf.length;i++){const v=(abuf[i]-128)/128;sum+=v*v;}const rms=Math.sqrt(sum/abuf.length);noiseF=rms<noiseF?noiseF*0.9+rms*0.1:noiseF*0.999+rms*0.001;peakF=Math.max(rms,peakF*0.997,noiseF*4,0.02);const tg=clamp((rms-noiseF*1.6)/(peakF-noiseF*1.6+1e-4)*1.4,0,1);lvl=lvl*0.5+tg*0.5;const mb=$('meter');if(mb)mb.style.width=Math.round(lvl*100)+'%';}else lvl=0;
 if(rec){const el=(performance.now()-recT0)/1000;$('rect').textContent=fmtT(el);if(el>=180)stopRec();}};
function paint(c,w,h,scale){c.drawImage(bgCanvas,0,0,w,h);items.forEach(it=>{const s=scale;const [dx,dy,dr,sc]=animOf(it,nowS);it._ax=it.x+dx;it._ay=it.y+dy;faceOpen=(it===talker||(allTalk&&hasFace(it.t)))?lvl:0;drawObj(c,it.t,it._ax*s,it._ay*s,it.r*sc*s,(it.rot||0)+dr,it.dir);faceOpen=0;});
 if(names){c.font='600 '+(14*scale)+'px Fredoka,sans-serif';c.textAlign='center';c.textBaseline='top';items.forEach(it=>{if(it.t==='star')return;const yy=(it._ay+it.r*labelY(it.t))*scale+4*scale;c.lineWidth=4*scale;c.strokeStyle='rgba(0,0,0,0.6)';c.strokeText(OBJ[it.t][0],it._ax*scale,yy);c.fillStyle='#fff';c.fillText(OBJ[it.t][0],it._ax*scale,yy);});}}
async function sendPic(){const out=document.createElement('canvas');out.width=Math.round(W*DPR);out.height=Math.round(H*DPR);const o=out.getContext('2d');paint(o,out.width,out.height,DPR);
 o.font='600 '+(16*DPR)+'px Fredoka,sans-serif';o.fillStyle='rgba(255,255,255,0.7)';o.textAlign='right';o.textBaseline='alphabetic';o.fillText("Made by Dexter in Dexter's Games",out.width-14*DPR,out.height-14*DPR);
 out.toBlob(async b=>{if(!b)return;const file=new File([b],'my-space-picture.png',{type:'image/png'});saved++;setScore(saved);
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'My space picture',text:'Look at my space picture!'});toast('Sent!');sfx.good();return;}}catch(e){if(e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-space-picture.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Picture saved!');sfx.good();},'image/png');}
G.draw=()=>{if(!bgCanvas)makeBg();nowS=performance.now()/1000;animOn=true;paint(ctx,W,H,1);
 if(selected&&!rec&&state==='play'){ctx.strokeStyle='rgba(255,210,122,0.9)';ctx.lineWidth=3;ctx.setLineDash([8,6]);circ(selected._ax,selected._ay,Math.max(24,selected.r*1.25));ctx.stroke();ctx.setLineDash([]);}
 if(talker&&!rec&&state==='play'){ctx.font='24px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🗣️',talker._ax+talker.r*0.95,talker._ay-talker.r*0.95);}
 if(rec){ctx.font='600 16px Fredoka,sans-serif';ctx.fillStyle='rgba(255,255,255,0.75)';ctx.textAlign='right';ctx.textBaseline='alphabetic';ctx.fillText("Made by Dexter in Dexter's Games",W-14,H-14);}
 if(state==='title'&&!items.length)showcase(ctx);
 popT.forEach(q=>{ctx.globalAlpha=q.l/0.35;ctx.strokeStyle='#ffd27a';ctx.lineWidth=3;circ(q.x,q.y,q.r*(1.6-q.l));ctx.stroke();});ctx.globalAlpha=1;
 if(press){ctx.globalAlpha=0.55;const pdx=press.cx-press.x,pdy=press.cy-press.y,dr=Math.hypot(pdx,pdy)>12;drawObj(ctx,press.t,press.cx,press.cy,radiusFor(press.t),0,press.t.includes('comet')?(dr?Math.atan2(-pdy,-pdx):undefined):press.t==='rocket'?(dr?Math.atan2(pdy,pdx):undefined):undefined);ctx.globalAlpha=1;}
 if(press&&(press.t.includes('comet')||press.t==='rocket')&&Math.hypot(press.cx-press.x,press.cy-press.y)>12){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(press.x,press.y);ctx.lineTo(press.cx,press.cy);ctx.stroke();ctx.setLineDash([]);}};

boot();
