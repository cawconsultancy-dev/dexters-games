<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Planet Face test</title>
<style>
@font-face{font-family:Fredoka;src:url(../fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;color:#fff;font-family:Fredoka,Arial,sans-serif;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
video{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:150px;border-radius:14px;border:3px solid #fff8;transform:scaleX(-1);z-index:3;background:#000}
.info{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:3;background:#000a;border-radius:14px;padding:8px 12px;font-size:16px;line-height:1.4;max-width:60vw}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px))}
button{border:none;border-radius:18px;background:#fff;color:#2a1a55;font:700 19px Fredoka,sans-serif;padding:10px 16px;min-height:54px;cursor:pointer;box-shadow:0 4px 0 #b9a8e0}
button.on{background:#ffd23f}
button.rec{background:#e63946;color:#fff;box-shadow:0 4px 0 #8c1c25}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0b1030ee;padding:20px;text-align:center}
.ov div{max-width:460px}
.ov h1{font-size:40px;margin:0 0 10px}
.ov p{font-size:20px;line-height:1.4;color:#d8d4ff}
.big{font-size:26px;padding:16px 30px;background:#ff6fb5;color:#fff;box-shadow:0 6px 0 #a01e58}
#clip{position:fixed;inset:0;z-index:11;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#clip video{position:static;width:auto;max-width:90vw;max-height:65vh;transform:none;border:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>
<div class="info" id="info">Starting…</div>
<div class="bar">
 <button data-p="0" class="pl on">🌍 Earth</button><button data-p="1" class="pl">🔴 Mars</button><button data-p="2" class="pl">🟠 Jupiter</button><button data-p="3" class="pl">🌕 Moon</button><button data-p="4" class="pl">☀️ Sun</button>
 <button id="mode">👀 Eyes and mouth</button>
 <button id="recBtn" class="rec">⏺ Record</button>
</div>
<div class="ov" id="start"><div><h1>🪐 Planet Face</h1><p>Test version. Your face stays on this iPad. Nothing is uploaded.</p><button class="big" id="go">Start the camera</button><p id="err"></p></div></div>
<div id="clip" hidden><video id="cv" playsinline controls></video><div><button id="saveBtn">💾 Save or send</button> <button id="closeBtn">✕ Close</button></div></div>

<script src="lib/facemesh/face_mesh.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),video=$('v');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* landmark index sets (MediaPipe Face Mesh, 468 points) */
const LEYE=[263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466];
const REYE=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
const LBROW=[276,283,282,295,285,300,293,334,296,336];
const RBROW=[46,53,52,65,55,70,63,105,66,107];
const LIPS=[61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];
const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

/* planets drawn in code */
const PL=[
 {n:'Earth',a:'#5fb0ff',b:'#1d4fa8',spots:'#3fae5a'},
 {n:'Mars',a:'#ff8a5c',b:'#a3341b',spots:'#c9532f'},
 {n:'Jupiter',a:'#f6d3a5',b:'#b36b37',bands:['#e8b07a','#c98a52','#f1d2a8','#b9733f']},
 {n:'Moon',a:'#f0f0f0',b:'#8a8a94',spots:'#b9b9c2'},
 {n:'Sun',a:'#fff3a0',b:'#ff9a1f',glow:true}];
let planet=0,mode=0;
const blobs=[...Array(9)].map(()=>({x:Math.random()*1.4-.7,y:Math.random()*1.4-.7,r:.12+Math.random()*.2}));
function drawPlanet(cx,cy,R){const p=PL[planet];
 if(p.glow){const g=ctx.createRadialGradient(cx,cy,R*.8,cx,cy,R*1.5);g.addColorStop(0,'#ffcf4080');g.addColorStop(1,'#ffcf4000');ctx.fillStyle=g;ctx.fillRect(cx-R*1.6,cy-R*1.6,R*3.2,R*3.2);}
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
 const g=ctx.createRadialGradient(cx-R*.35,cy-R*.35,R*.1,cx,cy,R);g.addColorStop(0,p.a);g.addColorStop(1,p.b);ctx.fillStyle=g;ctx.fillRect(cx-R,cy-R,2*R,2*R);
 if(p.bands)p.bands.forEach((c,i)=>{ctx.fillStyle=c+'aa';ctx.fillRect(cx-R,cy-R+R*(.25+i*.42),2*R,R*.16);});
 if(p.spots){ctx.fillStyle=p.spots+'bb';blobs.forEach(b=>{ctx.beginPath();ctx.ellipse(cx+b.x*R,cy+b.y*R,b.r*R,b.r*R*.7,b.x,0,Math.PI*2);ctx.fill();});}
 const sh=ctx.createRadialGradient(cx-R*.3,cy-R*.3,R*.6,cx,cy,R*1.05);sh.addColorStop(0,'#0000');sh.addColorStop(1,'#0006');ctx.fillStyle=sh;ctx.fillRect(cx-R,cy-R,2*R,2*R);
 ctx.restore();}

/* cut a feature out of the camera picture with a soft oval edge */
const tmp=document.createElement('canvas'),tctx=tmp.getContext('2d');
function feature(pts,pad,dx,dy,scale,roll,cx,cy){
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;pts.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);});
 const fx=(x0+x1)/2,fy=(y0+y1)/2,fw=(x1-x0)*pad[0],fh=(y1-y0)*pad[1];if(fw<4||fh<4)return;
 const tw=Math.ceil(fw),th=Math.ceil(fh);tmp.width=tw;tmp.height=th;
 tctx.drawImage(video,fx-fw/2,fy-fh/2,fw,fh,0,0,tw,th);
 tctx.globalCompositeOperation='destination-in';tctx.save();tctx.translate(tw/2,th/2);tctx.scale(tw/2,th/2);
 const g=tctx.createRadialGradient(0,0,.55,0,0,1);g.addColorStop(0,'#000');g.addColorStop(1,'#0000');tctx.fillStyle=g;tctx.fillRect(-1,-1,2,2);tctx.restore();tctx.globalCompositeOperation='source-over';
 ctx.save();ctx.translate(cx,cy);ctx.rotate(roll);ctx.translate(dx,dy);ctx.scale(-scale,scale);ctx.drawImage(tmp,-tw/2,-th/2);ctx.restore();}

let lm=null,lastSeen=0,trackN=0,trackT0=performance.now(),trackFps=0,frameN=0,drawFps=0,drawT0=performance.now(),busyMs=0;
function px(i){return [lm[i].x*video.videoWidth,lm[i].y*video.videoHeight];}
function draw(){const R=Math.min(W,H-150)*.36,cx=W/2,cy=(H-90)/2+10;
 ctx.fillStyle='#0b1030';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffffff55';for(let i=0;i<60;i++){const x=(i*97.3)%W,y=(i*53.7)%H;ctx.fillRect(x,y,2,2);}
 drawPlanet(cx,cy,R);
 if(lm&&video.videoWidth){const L=px(263),Rr=px(33),eyeD=Math.hypot(L[0]-Rr[0],L[1]-Rr[1]);
  if(mode===0){const s=(R*.62)/eyeD;
   const mid=[(L[0]+Rr[0])/2,(L[1]+Rr[1])/2];
   ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
   const parts=[[LEYE.concat(LBROW),[1.35,1.5]],[REYE.concat(RBROW),[1.35,1.5]],[LIPS,[1.45,1.7]]];
   parts.forEach(([idx,pad])=>{const pts=idx.map(px);let mx=0,my=0;pts.forEach(p=>{mx+=p[0];my+=p[1];});mx/=pts.length;my/=pts.length;
    const ox=-(mx-mid[0])*s,oy=(my-mid[1])*s-R*.12;feature(pts,pad,ox,oy,s,0,cx,cy);});
   ctx.restore();
  }else{const pts=OVAL.map(px);let mx=0,my=0;pts.forEach(p=>{mx+=p[0];my+=p[1];});mx/=pts.length;my/=pts.length;
   let fh=0;pts.forEach(p=>fh=Math.max(fh,Math.hypot(p[0]-mx,p[1]-my)));const s=(R*.82)/fh;
   ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();feature(pts,[1.05,1.05],0,0,s,0,cx,cy);ctx.restore();}
 }
 if(performance.now()-lastSeen>800){ctx.fillStyle='#fff';ctx.font='700 24px Fredoka,Arial';ctx.textAlign='center';ctx.fillText(lm?'Looking for your face…':'Getting ready…',cx,cy+R+40);}
 frameN++;const n=performance.now();if(n-drawT0>1000){drawFps=frameN*1000/(n-drawT0);frameN=0;drawT0=n;}
 $('info').innerHTML=`Tracking: <b>${trackFps.toFixed(0)}</b> per second<br>Picture: <b>${drawFps.toFixed(0)}</b> per second<br>Each check: <b>${busyMs.toFixed(0)}</b> ms<br>Face: <b>${performance.now()-lastSeen<800?'found ✅':'not found'}</b>${recording?'<br>🔴 Recording':''}`;
 requestAnimationFrame(draw);}

/* face tracking loop */
let fm=null,running=false;
async function track(){if(!running)return;if(video.readyState>=2){const t=performance.now();try{await fm.send({image:video});}catch(e){$('info').textContent='Tracking error: '+e.message;}busyMs=busyMs*.8+(performance.now()-t)*.2;
  trackN++;const n=performance.now();if(n-trackT0>1000){trackFps=trackN*1000/(n-trackT0);trackN=0;trackT0=n;}}
 requestAnimationFrame(track);}

let stream=null;
$('go').onclick=async()=>{$('err').textContent='Starting…';
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:true});}
 catch(e){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});}catch(e2){$('err').textContent='Camera not allowed: '+e2.message;return;}}
 video.srcObject=stream;try{await video.play();}catch(e){}
 fm=new FaceMesh({locateFile:f=>'lib/facemesh/'+f});
 fm.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.5,minTrackingConfidence:.5,selfieMode:false});
 fm.onResults(r=>{if(r.multiFaceLandmarks&&r.multiFaceLandmarks[0]){lm=r.multiFaceLandmarks[0];lastSeen=performance.now();}});
 try{await fm.initialize();}catch(e){$('err').textContent='Face tracking could not start: '+e.message;return;}
 $('start').hidden=true;running=true;track();};

document.querySelectorAll('.pl').forEach(b=>b.onclick=()=>{planet=+b.dataset.p;document.querySelectorAll('.pl').forEach(x=>x.classList.toggle('on',x===b));});
$('mode').onclick=()=>{mode=1-mode;$('mode').textContent=mode?'🙂 Whole face':'👀 Eyes and mouth';};

/* recording (stays on the iPad) */
let rec=null,chunks=[],recording=false,clipBlob=null,clipType='';
$('recBtn').onclick=()=>{if(!stream)return;if(recording){rec.stop();return;}
 const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];clipType=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
 const out=cv.captureStream(30);stream.getAudioTracks().forEach(t=>out.addTrack(t));
 try{rec=new MediaRecorder(out,clipType?{mimeType:clipType}:{});}catch(e){alert('Recording not supported: '+e.message);return;}
 chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
 rec.onstop=()=>{recording=false;$('recBtn').textContent='⏺ Record';clipBlob=new Blob(chunks,{type:clipType||'video/mp4'});$('cv').src=URL.createObjectURL(clipBlob);$('clip').hidden=false;};
 rec.start(500);recording=true;$('recBtn').textContent='⏹ Stop';setTimeout(()=>{if(recording)rec.stop();},180000);};
$('closeBtn').onclick=()=>{$('clip').hidden=true;$('cv').pause();};
$('saveBtn').onclick=async()=>{if(!clipBlob)return;const ext=clipType.includes('mp4')?'mp4':'webm',file=new File([clipBlob],'planet-face.'+ext,{type:clipBlob.type});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){}}
 const a=document.createElement('a');a.href=URL.createObjectURL(clipBlob);a.download=file.name;a.click();};
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
