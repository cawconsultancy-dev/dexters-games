 let n=v/u[0];n=n<10?Math.round(n*100)/100:n<100?Math.round(n*10)/10:Math.round(n);return n+u[1];}

function tone(f,d,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function sMerge(k){const b=330*Math.pow(2,(k%8)/8);[0,4,7,12].forEach((s,i)=>tone(b*Math.pow(2,s/12),0.25,'triangle',0.15,i*0.06));}

function blobs(r,list,col,al){fa(al);cx.fillStyle=col;for(const[a,b,c,d,e]of list){cx.beginPath();cx.ellipse(a*r,b*r,c*r,d*r,e||0,0,7);cx.fill();}fa(1);}
function stripes(r,col,alpha,gap,h,off){fa(alpha);cx.fillStyle=col;for(let i=-5;i<=5;i++)cx.fillRect(-r,(i*gap+(off||0))*r,2*r,h*r);fa(1);}

 fa(0.7);cx.strokeStyle='#b8995c';cx.lineWidth=r*0.07;cx.beginPath();cx.ellipse(0,0,r*1.45,r*0.33,-0.3,a0,a1);cx.stroke();fa(1);}

 fa(0.6);cx.strokeStyle='#e6fbff';cx.lineWidth=r*0.06;cx.beginPath();cx.ellipse(0,0,r*0.42,r*1.3,0.2,a0,a1);cx.stroke();fa(1);}

  {const L=[];for(let i=0;i<26;i++){const a=i*2.399,d=Math.sqrt((i*11%26)/26)*0.7;L.push([Math.cos(a)*d*r+0.1*r,Math.sin(a)*d*r*0.8,r*0.025]);}dots(L,'#ffffff',0.9);}glow(-0.35*r,-0.25*r,r*0.2,'#ff8ab8',0.8);break;

/* ---------- Dexter's Crazy Snake Game ---------- */
const TOP=PL.length-1,WORLD=2400,NFOOD=300,NAI=9;
let W,H,DPR,zoom=1,cam={x:0,y:0};
let state='title',voiceOn=true,dist=0;

let killer='',wonShown=false,eatenCount=0,peakK=0,thinkT=0;

const stars=[];for(let i=0;i<140;i++)stars.push({x:Math.random(),y:Math.random(),s:0.3+Math.random()*0.7});

function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
function uiFs(){return Math.max(15,Math.min(34,Math.min(W,H)/20));}
const CAP=Math.pow(2,TOP+1)-1;
function lev(s){return Math.max(0,Math.min(TOP,Math.floor(Math.log2(Math.max(1,s)))));}
function rad(k){return 19+0.4*k;}
function lenFor(s){const k=lev(s),f=Math.min(1,Math.log2(Math.max(1,s))-k);return Math.round(8+k*1.6+f*1.6);}
function angDiff(a,b){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;}
function bodyCol(k){return DEEP.includes(PL[k].f)?['#8a6cff','#ff6ab0','#5fc8ff'][k%3]:PL[k].c;}
function sx(x){return (x-cam.x)*zoom+W/2;}
function sy(y){return (y-cam.y)*zoom+H/2;}
function snakeName(s){return 'the '+PL[lev(s.score)].short+' snake';}

/* ---------- making things ---------- */
function mkSnake(x,y,score,ai){const s={x,y,ang:Math.random()*6.283,tgt:null,score,ai,segs:[],dead:false,shield:0,fleeing:false,lastK:lev(score)};
 const n=lenFor(score),g=rad(lev(score))*0.55;for(let i=0;i<n;i++)s.segs.push({x:x-Math.cos(s.ang)*g*i,y:y-Math.sin(s.ang)*g*i});return s;}
function randIn(maxR){const a=Math.random()*6.283,d=Math.sqrt(Math.random())*maxR;return{x:Math.cos(a)*d,y:Math.sin(a)*d};}
function offscreenNear(){const view=Math.max(W,H)/zoom;for(let t=0;t<30;t++){const a=Math.random()*6.283,d=view*0.6+Math.random()*view*0.6;const x=me.x+Math.cos(a)*d,y=me.y+Math.sin(a)*d;if(Math.hypot(x,y)<WORLD-120)return{x,y};}return randIn(WORLD-150);}
function spawnAI(start){const pk=lev(me.score);const offs=[-3,-2,-2,-1,-1,-1,1,1,2,3];let off=offs[Math.floor(Math.random()*offs.length)];
 if(pk<=1&&off<0&&Math.random()<0.5)off=-off;
 let score=Math.round(me.score*Math.pow(2,off)*(0.8+Math.random()*0.4));score=Math.max(1,Math.min(Math.pow(2,TOP+1)-1,score));if(score===Math.round(me.score))score+=1;
 const p=start?(()=>{for(let t=0;t<30;t++){const q=randIn(WORLD-150);if(Math.hypot(q.x-me.x,q.y-me.y)>450)return q;}return randIn(WORLD-150);})():offscreenNear();
 snakes.push(mkSnake(p.x,p.y,score,true));}
function spawnFood(near){const pk=lev(me.score);let fk=pk-1-Math.floor(Math.random()*3);if(Math.random()<0.12)fk=pk;fk=Math.max(0,fk);
 const p=near?offscreenNear():randIn(WORLD-60);food.push({x:p.x,y:p.y,k:fk,v:Math.pow(2,fk)*0.6,wob:Math.random()*6});}
function fr(f){return rad(f.k)*0.72;}

function startGame(){snakes=[];food=[];parts=[];banners=[];eatenCount=0;wonShown=false;
 me=mkSnake(0,0,4,false);me.shield=3;snakes.push(me);peakK=lev(me.score);
 for(let i=0;i<NFOOD;i++)spawnFood(false);
 for(let i=0;i<NAI;i++)spawnAI(true);
 cam.x=0;cam.y=0;zoom=Math.max(0.7,Math.min(1.8,Math.min(W,H)/620));state='play';
 say('You are '+PL[lev(me.score)].label+'. Eat planets to grow. Eat green snakes, run from red snakes!');}

/* ---------- effects ---------- */
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=40+Math.random()*220;parts.push({kind:'dot',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,life:0.8,r:2+Math.random()*4});}}
function floatText(x,y,t,col){parts.push({kind:'text',x,y,vx:0,vy:-60,t,col,life:1.4});}
function banner(t,sub){banners=[{t,sub,life:2.6}];}
function confetti(){for(let i=0;i<110;i++)parts.push({kind:'conf',screen:true,x:Math.random()*W,y:-Math.random()*H*0.5,vx:(Math.random()-0.5)*W*0.2,vy:Math.random()*H*0.2,col:PL[(i*7)%PL.length].c,life:3.5,rot:Math.random()*6});}

/* ---------- movement ---------- */
function moveSnake(s,dt,sp){const h=s.segs[0],k=lev(s.score),r=rad(k);
 h.x+=Math.cos(s.ang)*sp*dt;h.y+=Math.sin(s.ang)*sp*dt;
 const d=Math.hypot(h.x,h.y);if(d>WORLD-r){h.x*=(WORLD-r)/d;h.y*=(WORLD-r)/d;s.ang+=angDiff(s.ang,Math.atan2(-h.y,-h.x))*Math.min(1,dt*4);}
 const g=r*0.55;for(let i=1;i<s.segs.length;i++){const a=s.segs[i-1],b=s.segs[i],dx=a.x-b.x,dy=a.y-b.y,dd=Math.hypot(dx,dy);if(dd>g){b.x=a.x-dx/dd*g;b.y=a.y-dy/dd*g;}}
 const n=lenFor(s.score);while(s.segs.length<n){const t=s.segs[s.segs.length-1];s.segs.push({x:t.x,y:t.y});}while(s.segs.length>n)s.segs.pop();
 s.x=h.x;s.y=h.y;}
function aiThink(s){let ax=0,ay=0,flee=false,bx=0,by=0,bump=false;
 for(const o of snakes){if(o===s||o.dead)continue;const bigger=o.score>s.score;
  for(let i=0;i<o.segs.length;i+=2){const q=o.segs[i],dx=s.x-q.x,dy=s.y-q.y,d=Math.hypot(dx,dy)+1;
   if(bigger&&d<210){ax+=dx/d;ay+=dy/d;flee=true;}
   else if(!bigger&&d<(o===me?190:110)){bx+=dx/d;by+=dy/d;bump=true;}}}
 s.fleeing=flee;
 if(flee){s.tgt=Math.atan2(ay,ax);}
 else if(bump){s.tgt=Math.atan2(by,bx);}
 else{let best=null,bd=430*430;for(const f of food){const dx=f.x-s.x,dy=f.y-s.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=f;}}
  if(best)s.tgt=Math.atan2(best.y-s.y,best.x-s.x);else if(Math.random()<0.4)s.tgt=s.ang+(Math.random()-0.5)*2;}
 if(Math.hypot(s.x,s.y)>WORLD-260)s.tgt=Math.atan2(-s.y,-s.x);}

/* ---------- eating ---------- */
function eatSnake(eater,victim,x,y){victim.dead=true;eater.score=Math.min(CAP,eater.score+victim.score*0.5);
 for(let i=0;i<victim.segs.length;i+=3)burst(victim.segs[i].x,victim.segs[i].y,bodyCol(lev(victim.score)),3);
 if(victim===me){killer=snakeName(eater);state='over';sComet();
  say('Gulp! '+killer.replace(/^the /,'The ')+' ate you! You got to '+PL[peakK].label);}
 else if(eater===me){eatenCount++;sMerge(lev(me.score));floatText(x,y-30,'Gulp! '+PL[lev(victim.score)].short+' snake!','#7dff9a');
  say('Gulp! You ate '+snakeName(victim)+'!');}}
function snakeContacts(){const n=snakes.length;
 for(let i=0;i<n;i++){const a=snakes[i];if(a.dead)continue;
  for(let j=0;j<n;j++){if(i===j)continue;const b=snakes[j];if(b.dead||a.dead)continue;
   const ra=rad(lev(a.score))*0.85,rb=rad(lev(b.score))*0.8;
   for(const q of b.segs){const dx=a.x-q.x,dy=a.y-q.y;if(dx*dx+dy*dy<(ra+rb)*(ra+rb)){
     if(a.score===b.score)break;
     const small=a.score<b.score?a:b,big=small===a?b:a;
     if(small.shield>0||big.shield>0){break;}
     eatSnake(big,small,q.x,q.y);break;}}}}}

/* ---------- update ---------- */
function update(dt){
 dist+=dt*60;
 for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==='conf')p.vy+=H*0.25*dt;if(p.kind==='dot'){p.vx*=0.94;p.vy*=0.94;}if(p.rot!==undefined)p.rot+=dt*6;}
 parts=parts.filter(p=>p.life>0);
 for(const b of banners)b.life-=dt;banners=banners.filter(b=>b.life>0);
 if(state!=='play')return;
 const pk=lev(me.score);
 // player steering
 if(pointer){me.tgt=Math.atan2(pointer.y-sy(me.y),pointer.x-sx(me.x));}
 if(keys.l){me.ang-=3.6*dt;me.tgt=null;}if(keys.r){me.ang+=3.6*dt;me.tgt=null;}
 if(me.tgt!==null&&pointer){const d=angDiff(me.ang,me.tgt);me.ang+=Math.sign(d)*Math.min(Math.abs(d),6.5*dt);}
 me.ang=Math.atan2(Math.sin(me.ang),Math.cos(me.ang));
 me.shield=Math.max(0,me.shield-dt);
 moveSnake(me,dt,215+2*pk);
 // computer snakes
 thinkT-=dt;const think=thinkT<=0;if(think)thinkT=0.2;
 for(const s of snakes){if(!s.ai||s.dead)continue;if(think)aiThink(s);
  if(s.tgt!==null){const d=angDiff(s.ang,s.tgt);s.ang+=Math.sign(d)*Math.min(Math.abs(d),(s.fleeing?3.4:2.6)*dt);}
  s.ang=Math.atan2(Math.sin(s.ang),Math.cos(s.ang));const k=lev(s.score);moveSnake(s,dt,(s.fleeing?180:150)+2*k);}
 // food (planets close to your head get pulled in)
 {const pr=rad(pk)*4;for(const f of food){const dx=me.x-f.x,dy=me.y-f.y,d=Math.hypot(dx,dy);if(d<pr&&d>1){const pull=Math.min(d,(1-d/pr)*420*dt);f.x+=dx/d*pull;f.y+=dy/d*pull;}}}
 for(const s of snakes){if(s.dead)continue;const r=rad(lev(s.score));
  for(const f of food){if(f.eaten)continue;const dx=f.x-s.x,dy=f.y-s.y,rr2=r*1.1+fr(f);if(dx*dx+dy*dy<rr2*rr2){f.eaten=true;s.score+=f.v;
   if(s===me){tone(520+60*(f.k%6),0.09,'triangle',0.09);burst(f.x,f.y,PL[f.k].c,6);floatText(f.x,f.y-20,'+'+PL[f.k].short,'#ffffff');}}}}
 for(const s of snakes)s.score=Math.min(CAP,s.score);
 food=food.filter(f=>!f.eaten&&f.k>=pk-4);
 while(food.length<NFOOD)spawnFood(true);
 // snake meets snake
 snakeContacts();
 if(state!=='play')return;
 // keep computer snakes near the player's size and nearby
 const view=Math.max(W,H)/zoom;
 for(const s of snakes){if(!s.ai||s.dead)continue;const dk=lev(s.score)-pk,d=Math.hypot(s.x-me.x,s.y-me.y);
  if((Math.abs(dk)>4&&d>view*0.7)||d>view*2.5)s.dead=true;}
 snakes=snakes.filter(s=>!s.dead);
 while(snakes.length<NAI+1)spawnAI(false);
 // growing up the ladder
 const nk=lev(me.score);
 if(nk>me.lastK){me.lastK=nk;peakK=Math.max(peakK,nk);sMerge(nk);const p=PL[nk];
  if(nk>bestK){bestK=nk;try{localStorage.setItem('dsnake_best',bestK);}catch(e){}}
  if(nk===TOP&&!wonShown){wonShown=true;confetti();sWin();banner("You're the whole universe!",'You won! Keep playing if you like.');say('Amazing! You are the whole universe! You won!');}
  else{banner("You're "+p.label+'!',p.cat);say(p.label+', '+p.cat+'!');}}
 // camera
 const base=Math.max(0.7,Math.min(1.8,Math.min(W,H)/620));zoom+=(base*(1-0.007*nk)-zoom)*Math.min(1,dt*2);
 cam.x+=(me.x-cam.x)*Math.min(1,dt*8);cam.y+=(me.y-cam.y)*Math.min(1,dt*8);
}

/* ---------- drawing ---------- */

 cx.lineWidth=10*zoom;cx.strokeStyle='rgba(255,90,140,0.55)';cx.beginPath();cx.arc(sx(0),sy(0),WORLD*zoom,0,7);cx.stroke();

function drawFood(){for(const f of food){if(!onScreen(f.x,f.y,60))continue;const r=fr(f)*zoom*(1+0.06*Math.sin(dist*0.08+f.wob));drawPlanet(sx(f.x),sy(f.y),Math.pow(2,f.k),r,'plain',1,1,0);}}
function eyes(x,y,r,ang){const ex=Math.cos(ang),ey=Math.sin(ang),px=-ey,py=ex;
 for(const s of[-1,1]){const X=x+ex*r*0.32+px*s*r*0.4,Y=y+ey*r*0.32+py*s*r*0.4;
  cx.fillStyle='#fff';cx.beginPath();cx.arc(X,Y,r*0.3,0,7);cx.fill();cx.lineWidth=Math.max(1,r*0.05);cx.strokeStyle='#222';cx.stroke();
  cx.fillStyle='#111';cx.beginPath();cx.arc(X+ex*r*0.12,Y+ey*r*0.12,r*0.15,0,7);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(X+ex*r*0.12-r*0.05,Y+ey*r*0.12-r*0.05,r*0.05,0,7);cx.fill();}}
function drawSnake(s){const k=lev(s.score),r=rad(k)*zoom,n=s.segs.length,c1=bodyCol(k),c2=shade(c1,-0.3),line=shade(c1,-0.55);
 if(!onScreen(s.x,s.y,(n*rad(k)*0.55+80)*zoom))return;
 const blink=s.shield>0&&Math.floor(dist/6)%2===0;cx.globalAlpha=blink?0.45:1;
 for(let i=n-1;i>=1;i--){const q=s.segs[i],ri=r*(1-0.45*i/n);const X=sx(q.x),Y=sy(q.y);
  cx.fillStyle=(Math.floor(i/2)%2)?c1:c2;cx.beginPath();cx.arc(X,Y,ri,0,7);cx.fill();cx.lineWidth=Math.max(1,ri*0.12);cx.strokeStyle=line;cx.stroke();}
 const X=sx(s.x),Y=sy(s.y),hr=r*1.18;
 if(s===me){cx.strokeStyle='#ffd400';cx.lineWidth=Math.max(2,hr*0.14);cx.beginPath();cx.arc(X,Y,hr*1.12,0,7);cx.stroke();}
 drawPlanet(X,Y,Math.pow(2,k),hr,'plain',1,cx.globalAlpha,0);
 eyes(X,Y,hr,s.ang);
 // number badge: yellow = you, green = smaller (eat it), red = bigger (run!)
 const t=fmt(Math.round(s.score)),L=t.length,bf=Math.max(14,hr*0.62*(L>9?0.55:L>6?0.65:L>4?0.78:1));
 cx.font='bold '+bf+'px Arial';const bw=cx.measureText(t).width+bf*0.9,bh=bf*1.3,by=Y-hr-bh-hr*0.25;
 const col=s===me?'#ffd400':s.score<me.score?'#4fe07a':'#ff5a5a';
 rr(X-bw/2,by,bw,bh,bh/2);cx.fillStyle=col;cx.fill();cx.lineWidth=2;cx.strokeStyle='rgba(0,0,0,0.4)';cx.stroke();
 cx.fillStyle='#111';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,X,by+bh/2+1);
 cx.globalAlpha=1;}
function drawParts(){for(const p of parts){cx.globalAlpha=Math.min(1,p.life);
 if(p.kind==='dot'){cx.fillStyle=p.col;cx.beginPath();cx.arc(sx(p.x),sy(p.y),p.r*zoom,0,7);cx.fill();}
 else if(p.kind==='text'){tag(sx(p.x),sy(p.y),p.t,uiFs()*0.8,p.col);}
 else if(p.kind==='conf'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.col;cx.fillRect(-6,-3,12,6);cx.restore();}}cx.globalAlpha=1;}
function drawHud(){const fs=uiFs(),h=fs*2.6,k=lev(me.score),p=PL[k];
 cx.fillStyle='rgba(10,10,40,0.78)';rr(10,10,W-20,h,h/2);cx.fill();
 drawPlanet(10+h*0.55,10+h/2,Math.pow(2,k),h*0.33,'plain',1,1,0);
 tag(10+h*1.05,10+h*0.36,p.short,fs*0.9,'#fff','left');tag(10+h*1.05,10+h*0.72,p.cat,fs*0.58,'#cfe0ff','left');
 // progress to the next object
 const bx=W*0.5,bw=Math.min(W*0.3,260),f=k>=TOP?1:Math.min(1,(me.score-Math.pow(2,k))/Math.pow(2,k));
 tag(bx+bw/2,10+h*0.3,k>=TOP?'Top of the universe!':'Next: '+PL[k+1].short,fs*0.6,'#cfe0ff');
 rr(bx,10+h*0.55,bw,h*0.22,h*0.11);cx.fillStyle='rgba(255,255,255,0.18)';cx.fill();
 if(f>0){rr(bx,10+h*0.55,Math.max(h*0.22,bw*f),h*0.22,h*0.11);cx.fillStyle='#ffd400';cx.fill();}
 const bs=h*0.8;button('II',W-20-bs,10+h*0.1,bs,bs,'#ff8c42',()=>{state='pause';},fs*0.8);
 if(eatenCount>0)tag(W-30-bs,10+h+fs*0.7,'Snakes eaten: '+eatenCount,fs*0.6,'#7dff9a','right');
 if(me.shield>0)tag(W/2,10+h+fs*0.8,'Safe start: '+Math.ceil(me.shield),fs*0.75,'#ffd400');}
function drawBanners(){const fs=uiFs();for(const b of banners){cx.globalAlpha=Math.min(1,b.life);tag(W/2,H*0.24,b.t,fs*1.5,'#ffd400');if(b.sub)tag(W/2,H*0.24+fs*1.5,b.sub,fs*0.85,'#ffffff');}cx.globalAlpha=1;}
function shadeScreen(){cx.fillStyle='rgba(5,5,25,0.72)';cx.fillRect(0,0,W,H);}
function title(t,y,size,col){cx.fillStyle=col||'#ffd400';cx.font='bold '+size+'px Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,W/2,y);}
function badge(x,y,t,col,size){cx.font='bold '+size+'px Arial';const bw=cx.measureText(t).width+size*0.9,bh=size*1.3;rr(x-bw/2,y-bh/2,bw,bh,bh/2);cx.fillStyle=col;cx.fill();cx.fillStyle='#111';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,x,y+1);}
function drawTitle(){const fs=uiFs();shadeScreen();
 title("Dexter's",H*0.08,fs*1.5,'#ffffff');title('Crazy Snake Game',H*0.08+fs*2,fs*2.2);
 // a little demo snake
 const r=Math.min(W,H)*0.045,cy=H*0.3;for(let i=9;i>=1;i--){const X=W/2+i*r*0.9-r*3,Y=cy+Math.sin(dist*0.06+i*0.7)*r*0.5;cx.fillStyle=(Math.floor(i/2)%2)?'#2f6fd6':shade('#2f6fd6',-0.3);cx.beginPath();cx.arc(X,Y,r*(1-0.04*i),0,7);cx.fill();}
 drawPlanet(W/2-r*3,cy+Math.sin(dist*0.06)*r*0.5,Math.pow(2,23),r*1.2,'plain',1,1,0);eyes(W/2-r*3,cy+Math.sin(dist*0.06)*r*0.5,r*1.2,Math.PI);
 const ly=H*0.43;title('Eat planets to grow bigger!',ly,fs*0.85,'#fff');
 badge(W/2-fs*7.2,ly+fs*1.8,'32','#4fe07a',fs*0.8);tag(W/2-fs*5.6,ly+fs*1.8,'Smaller snake: eat it!',fs*0.75,'#7dff9a','left');
 badge(W/2-fs*7.2,ly+fs*3.3,'512','#ff5a5a',fs*0.8);tag(W/2-fs*5.6,ly+fs*3.3,'Bigger snake: run away!',fs*0.75,'#ff9a9a','left');
 if(bestK>0)title('Biggest ever: '+PL[bestK].short,ly+fs*5,fs*0.8,'#cfe0ff');
 const bw=fs*12,bh=fs*2.6,by=H*0.66;
 button('Play',W/2-bw/2,by,bw,bh*1.1,'#2bb24c',()=>{startGame();},fs*1.4);
 button(voiceOn?'Voice: on':'Voice: off',W/2-bw/2,by+bh*1.1+fs,bw,bh*0.85,'#3a86ff',()=>{voiceOn=!voiceOn;},fs*0.95);}
function drawOver(){const fs=uiFs(),p=PL[peakK];shadeScreen();
 title('Gulp!',H*0.12,fs*2.6);title(killer.replace(/^the /,'The ')+' ate you!',H*0.12+fs*2.3,fs*1,'#fff');
 title('You got to '+p.label,H*0.12+fs*3.7,fs*0.9,'#cfe0ff');
 const r=Math.min(W,H)*0.1;drawPlanet(W/2,H*0.42,Math.pow(2,peakK),r,'plain',1,1,0);eyes(W/2,H*0.42,r,Math.PI/2);
 title(p.cat,H*0.42+r*1.4,fs*0.8,'#fff');if(eatenCount>0)title('Snakes eaten: '+eatenCount,H*0.42+r*1.4+fs*1.3,fs*0.8,'#7dff9a');
 const bw=fs*11,bh=fs*2.6;
 button('Play again',W/2-bw/2,H*0.66,bw,bh,'#2bb24c',()=>{startGame();},fs*1.1);
 button('Menu',W/2-bw/2,H*0.66+bh+fs,bw,bh,'#6a4c93',()=>{state='title';},fs*1.1);}
function drawPause(){const fs=uiFs();shadeScreen();title('Paused',H*0.3,fs*2.4);
 const bw=fs*11,bh=fs*2.6;
 button('Carry on',W/2-bw/2,H*0.45,bw,bh,'#2bb24c',()=>{state='play';},fs*1.1);
 button('Menu',W/2-bw/2,H*0.45+bh+fs,bw,bh,'#6a4c93',()=>{state='title';},fs*1.1);}
function draw(){buttons=[];drawBg();
 if(me&&state!=='title'){drawWorldBits();drawFood();for(const s of snakes)if(s!==me&&!s.dead)drawSnake(s);if(!me.dead)drawSnake(me);}
 drawParts();
 if(state==='play'||state==='pause'){drawHud();drawBanners();}
 if(state==='title')drawTitle();else if(state==='over')drawOver();else if(state==='pause')drawPause();}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();const x=e.clientX,y=e.clientY;
 for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}}
 if(state==='play')pointer={x,y,id:e.pointerId};});
cv.addEventListener('pointermove',e=>{if(state!=='play')return;if(pointer||e.pointerType==='mouse')pointer={x:e.clientX,y:e.clientY,id:e.pointerId};});
addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')pointer=null;});
addEventListener('pointercancel',()=>{pointer=null;});
addEventListener('keydown',e=>{audioInit();if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;
 if(state==='play'&&e.key==='p')state='pause';else if((e.key===' '||e.key==='Enter')&&(state==='title'||state==='over'))startGame();});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause';});

let last=performance.now();
function loop(t){const dt=Math.min(0.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

</script>
</body>
